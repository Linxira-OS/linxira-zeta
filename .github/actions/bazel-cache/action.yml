name: "Compose bazel cache config"
description: >
   Emits a bazelrc fragment wiring the cluster remote cache. Every Bazel job
   runs on omp-kata, where the pod env carries the bazel-remote credentials;
   elsewhere (no credentials) the fragment carries only --config=ci and the
   build runs uncached.

outputs:
   rc:
      description: Path to the generated bazelrc fragment
      value: ${{ steps.compose.outputs.rc }}

runs:
   using: composite
   steps:
      - name: Compose cache config
        id: compose
        shell: bash
        run: |
           set -euo pipefail
           remote=false
           if [ -n "${BAZEL_REMOTE_USER:-}" ] && [ -n "${BAZEL_REMOTE_PASSWORD:-}" ]; then
             remote=true
           elif [ -n "${BAZEL_REMOTE_USER:-}" ] || [ -n "${BAZEL_REMOTE_PASSWORD:-}" ]; then
             # Single-sided credential config (e.g. one repo secret set, the
             # other missing) must not fail the warm/seed runs — fall back to
             # the actions/cache-backed disk cache instead of erroring out.
             echo "::warning::BAZEL_REMOTE_USER/PASSWORD partially configured; using disk cache"
           fi
           key="bazel-disk-v3-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-$CONFIG_HASH-$SOURCE_HASH"
           prefix="bazel-disk-v3-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-$CONFIG_HASH-"
           bare_prefix="bazel-disk-v3-${{ inputs.scope }}-${{ runner.os }}-${{ runner.arch }}-"
           fallback_prefix=""
           if [ -n "${{ inputs.fallback-scope }}" ]; then
             fallback_prefix="bazel-disk-v3-${{ inputs.fallback-scope }}-${{ runner.os }}-${{ runner.arch }}-"
           fi
           {
             echo "remote=$remote"
             echo "cache-key=$key"
             echo "cache-prefix=$prefix"
             echo "cache-bare-prefix=$bare_prefix"
             echo "cache-fallback-prefix=$fallback_prefix"
           } >> "$GITHUB_OUTPUT"

      - name: Restore bazel disk cache
        id: restore
        if: steps.backend.outputs.remote != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
           # Both caches ride one archive: the action cache AND the repository
           # cache (downloads + extracted repo contents at repo/contents, which
           # reproducible repo rules reuse across output bases). Without the
           # repo half, every hosted job re-downloaded and re-extracted the
           # rust/LLVM/zig toolchains. Save sites must list the same paths.
           path: |
              ~/.cache/omp-bazel-disk
              ~/.cache/omp-bazel-repo
           key: ${{ steps.backend.outputs.cache-key }}
           # Order matters: exact key, same-config prefix, then any archive for
           # this scope+os+arch. The bare fallback is what keeps release version
           # bumps (Cargo.toml/Cargo.lock churn -> new CONFIG_HASH) from going
           # fully cold; bazel's content-addressed action keys make a
           # stale-config archive a partial hit, never a wrong output.
           restore-keys: |
              ${{ steps.backend.outputs.cache-prefix }}
              ${{ steps.backend.outputs.cache-bare-prefix }}
              ${{ steps.backend.outputs.cache-fallback-prefix }}

      - name: Compose cache config
        id: compose
        shell: bash
        env:
           REMOTE: ${{ steps.backend.outputs.remote }}
           RESTORE_HIT: ${{ steps.restore.outputs.cache-hit }}
           ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
           set -euo pipefail
           save_needed=false
           if [ "$REMOTE" != "true" ] && [ "$RESTORE_HIT" != "true" ] && [ "$ON_MAIN" = "true" ]; then
             save_needed=true
           fi

           rc="$RUNNER_TEMP/bazel-cache.rc"
           if [ "$remote" = "true" ]; then
             # Mask the derived credential BEFORE writing the rc: config=ci
             # enables --announce_rc, which prints --remote_header verbatim.
             # Mask lines inside the redirected block below would land in the
             # rc file itself and mask nothing.
             raw_auth="${BAZEL_REMOTE_USER}:${BAZEL_REMOTE_PASSWORD}"
             auth="$(printf %s "$raw_auth" | base64 | tr -d '\n')"
             echo "::add-mask::$raw_auth"
             echo "::add-mask::$auth"
             {
               # The PVC mount lives outside $HOME. Pods are single-job and
               # use RUNNER_TEMP for Bazel's output root.
               echo "startup --output_user_root=$RUNNER_TEMP/bazel-root"
               echo "common --config=ci"
               echo "common --repository_cache=/opt/bazel-repo-cache"
               echo "common --repo_env=OMP_XWIN_CACHE_DIR=/opt/bazel-repo-cache/xwin"
               echo "common --config=cache-rw"
               echo "common --remote_cache=grpcs://bazel-remote.bazel-cache.svc.cluster.local:9092"
               echo "common --tls_certificate=infra/bazel-remote/ca.crt"
               echo "common --remote_header='authorization=Basic ${auth}'"
               echo "common --remote_download_toplevel"
             } > "$rc"
           else
             echo "common --config=ci" > "$rc"
           fi
           echo "rc=$rc" >> "$GITHUB_OUTPUT"
