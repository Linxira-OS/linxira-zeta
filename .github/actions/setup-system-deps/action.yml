name: Setup system deps
description: >-
   Install the canvas/native runtime deps CI needs (cairo/pango stack, fd,
   ripgrep, imagemagick). No-op on the preloaded omp-kata runner image, which
   already ships them; self-heals on a stock runner by installing via apt.

runs:
   using: composite
   steps:
      - name: Install system deps (skip when preloaded)
        shell: bash
        run: |
           # The preloaded omp-kata runner image bakes these in. Detect that
           # and skip the apt round-trip; otherwise install the exact same set so
           # stock runners (and any future host) still work. Accept either
           # ImageMagick 7's `magick` or ImageMagick 6's `convert` — an image
           # that ships only `convert` is still preloaded.
           if command -v fd >/dev/null 2>&1 \
              && command -v rg >/dev/null 2>&1 \
              && { command -v magick >/dev/null 2>&1 || command -v convert >/dev/null 2>&1; } \
              && pkg-config --exists cairo pango 2>/dev/null; then
             echo "System deps already present (preloaded runner image); skipping apt."
             exit 0
           fi
           # GitHub-hosted runners prefer azure.archive.ubuntu.com, which
           # intermittently stalls on large fetches (repeated `Ign:`/silent
           # hangs). Point apt at the canonical archive mirror first so a
           # healthy source is always used; the timeout/retry loop below is the
           # fallback for genuinely unreachable network.
           sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
           # Bound per-mirror waits, cap each attempt with a hard `timeout`
           # (kill-after guarantees the SIGKILL if apt ignores SIGTERM), and
           # retry the whole fetch so transient mirror failures fail over to
           # archive.ubuntu.com instead of blocking the job for minutes.
           apt_opts=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=2)
           for attempt in 1 2 3; do
             if timeout -k 30s 120s sudo apt-get "${apt_opts[@]}" update; then break; fi
             echo "apt-get update attempt $attempt failed; retrying in 10s..."
             sleep 10
           done
           timeout -k 30s 300s sudo apt-get "${apt_opts[@]}" install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick
           sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
           sudo ln -sf /usr/bin/convert /usr/local/bin/magick
