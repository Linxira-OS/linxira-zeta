name: CI

on:
   push:
      branches: [main]
      paths:
         - "packages/**"
         - "desktop/**"
         - "web-ui/**"
         - "assets/**"
         - "crates/**"
         - "scripts/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         # A root dependency change (lockfile/catalog/patches) affects every
         # job; without these a lockfile-only push shipped untested — and a
         # release retagged onto such a commit never triggered its run.
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         # CI/workflow config changes are verified by workflow_dispatch only —
         # never by a self-triggered full run. push stays a code quality gate.
   pull_request:
      branches: [main]
      paths:
         - "packages/**"
         - "desktop/**"
         - "web-ui/**"
         - "assets/**"
         - "crates/**"
         - "scripts/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         # CI/workflow config changes are verified by workflow_dispatch only —
         # never by a self-triggered full run. push stays a code quality gate.
   workflow_dispatch:
      inputs:
         skip_tests:
            description: "Skip test jobs (build/release only)"
            type: boolean
            default: false
         build_only:
            description: "Build release artifacts without publishing (no GitHub release / npm)"
            type: boolean
            default: false
         skip_npm:
            description: "Skip npm publish"
            type: boolean
            default: false
         verify_native_leaves:
            description: "Build and pack every native leaf without publishing"
            type: boolean
            default: false

# Release runs publish a `v*` tag pushed atomically with main HEAD; sharing
# the cheap branch-wide `CI-refs/heads/main` group meant a later main push
# silently cancelled the in-flight release and left the tag without a GitHub
# Release or npm publish (#2564). Detect release runs at workflow-scheduling
# time via the release-script commit subject (`chore: bump version to vX.Y.Z`),
# via `v*` tag-ref dispatches, and via manual dispatches whose tag-on-HEAD
# status is only known after checkout; scope them to a per-sha group with no
# cancellation. Every other event keeps branch-wide cancellation for PR/main churn.
concurrency:
   group: "${{ github.workflow }}-${{ (startsWith(github.event.head_commit.message, 'chore: bump version to ') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && format('release-{0}', github.sha) || github.ref }}"
   cancel-in-progress: "${{ !(startsWith(github.event.head_commit.message, 'chore: bump version to ') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}"

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
   contents: read

jobs:
   # scripts/release.ts pushes the version-bump commit and its `v*` tag
   # atomically (`git push --atomic origin refs/heads/main:refs/heads/main
   # <sha>:refs/tags/v<version>`), so a release now arrives as a single `push` to
   # `refs/heads/main` — we no longer trigger on the tag ref at all (see
   # `on.push`). This one branch-push run is therefore authoritative: it runs the
   # full build AND, when HEAD carries a release tag, the release/publish jobs.
   # `release_metadata` resolves that tag once so downstream jobs switch on
   # `is-release` and address the tag by name — `github.ref` is
   # `refs/heads/main` here, not the tag. A `workflow_dispatch` from a `v*` tag
   # ref (or from a tagged main HEAD) is also treated as a release.
   release_metadata:
      name: Resolve release metadata
      # Hosted, not ubuntu-22.04: this ~20 s git-tag probe gates the whole release
      # chain, and queueing it behind the 4-runner kata pool adds dead minutes
      # to the darwin critical path.
      runs-on: ubuntu-22.04
      outputs:
         is-release: ${{ steps.detect.outputs.is-release }}
         release-tag: ${{ steps.detect.outputs.release-tag }}
         # Canary tags publish to npm's canary dist-tag (derived script-side), mark
         # the GitHub release prerelease, and skip the stable-only brew tap.
         channel: ${{ steps.detect.outputs.channel }}
      steps:
         # Only a main-branch run needs tags fetched, so `git tag --points-at
         # HEAD` can see the freshly-pushed `v*`. A tag-ref dispatch reads the
         # tag straight from `github.ref_name`, and fetching `--tags` while
         # checkout uses an explicit tag refspec makes git refuse — so scope
         # fetch-tags to main refs.
         - uses: actions/checkout@v4
           with:
              fetch-tags: ${{ github.ref == 'refs/heads/main' }}
         - name: Detect release tag at HEAD
           id: detect
           shell: bash
           run: |
              is_release=false
              release_tag=""
              channel=stable
              case "${{ github.ref }}" in
                refs/tags/v[0-9]*)
                  release_tag="${{ github.ref_name }}"
                  ;;
                refs/heads/main)
                  if [ "${{ github.event_name }}" != "pull_request" ]; then
                    release_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1 || true)
                  fi
                  ;;
              esac
              if [ -n "$release_tag" ]; then
                echo "HEAD carries release tag $release_tag; this run builds and publishes the release."
                is_release=true
              fi
              if [[ "$release_tag" == *-canary.* ]]; then
                channel=canary
              fi
              {
                echo "is-release=$is_release"
                echo "release-tag=$release_tag"
                echo "channel=$channel"
              } >> "$GITHUB_OUTPUT"
         # Fail fast when the tag and the packaged version drift: the publish
         # script ships each package.json version, so a tag pushed without a
         # version bump produces either a wrong-version publish or an npm
         # rejection ("previously published version is higher than the new
         # version") after ~an hour of builds. Guard here, before any build.
         - name: Verify tag matches packaged versions
           if: steps.detect.outputs.is-release == 'true'
           shell: bash
           env:
              RELEASE_TAG: ${{ steps.detect.outputs.release-tag }}
           run: |
              set -euo pipefail
              tag_ver="${RELEASE_TAG#v}"
              # All lock-step packages ride the release version (list mirrors release-v2.ts ALL_PACKAGES).
              pkgs=(utils agent catalog ai tui hashline mnemopi snapcompact stats coding-agent channels natives omptype wire)
              for pkg in "${pkgs[@]}"; do
                ver=$(node -p "require('./packages/$pkg/package.json').version")
                if [ "$tag_ver" != "$ver" ]; then
                  echo "::error::Release tag $RELEASE_TAG does not match packages/$pkg/package.json version $ver. Run a version bump (bun scripts/release-v2.ts $tag_ver) so package versions equal the tag, then push the tag again."
                  exit 1
                fi
              done
              # desktop (incl. lockfile root version) must equal the tag.
              desktop_ver=$(node -p "require('./desktop/package.json').version")
              desktop_lock_ver=$(node -p "require('./desktop/package-lock.json').version")
              if [ "$tag_ver" != "$desktop_ver" ] || [ "$tag_ver" != "$desktop_lock_ver" ]; then
                echo "::error::Release tag $RELEASE_TAG does not match desktop versions: package.json=$desktop_ver package-lock.json=$desktop_lock_ver. Run a version bump (bun scripts/release-v2.ts $tag_ver) so package versions equal the tag, then push the tag again."
                exit 1
              fi
              # Root catalog: exactly ${#pkgs[@]} @linxiraos/* keys, all equal to the tag.
              node -e '
                const catalog = require("./package.json").workspaces.catalog;
                const keys = Object.keys(catalog).filter(k => k.startsWith("@linxiraos/"));
                const expected = Number(process.argv[2]);
                if (keys.length !== expected) {
                  console.error(`catalog has ${keys.length} @linxiraos/* keys, expected exactly ${expected}`); process.exit(1);
                }
                const tag = process.argv[1];
                for (const k of keys) if (catalog[k] !== tag) { console.error(`catalog ${k} = ${catalog[k]}, expected ${tag}`); process.exit(1); }
              ' "$tag_ver" "${#pkgs[@]}"
              # Rust workspace + native sentinel ride the release version too.
              cargo_ver=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
              if [ "$cargo_ver" != "$tag_ver" ]; then
                echo "::error::Cargo.toml workspace version is $cargo_ver, expected $tag_ver."
                exit 1
              fi
              sentinel="__piNativesV${tag_ver//./_}"
              for f in crates/pi-natives/src/lib.rs packages/natives/native/index.d.ts packages/natives/native/index.js; do
                if ! grep -q "$sentinel" "$f"; then
                  echo "::error::$f is missing the $sentinel sentinel (native sentinel must ride the release version)."
                  exit 1
                fi
              done
              echo "tag $RELEASE_TAG matches packaged versions (${#pkgs[@]} packages == tag, desktop incl. lock == tag, catalog ${#pkgs[@]} keys == tag, Cargo/sentinel == tag)"

   check:
      name: Lint, type check & web build
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'ubuntu-22.04' }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Verify Rust license compliance (cargo-deny 0.20.2)
           run: |
              cargo install --locked --version 0.20.2 cargo-deny
              # `--offline` needs every workspace crate already in the registry
              # cache. PR runs use a fresh GitHub-hosted runner (see runs-on
              # above), where the only prior cargo work is the cargo-deny
              # install, so nothing populates the index for our own graph and
              # resolution fails. Non-PR events land on omp-kata, whose Cargo
              # cache is warm, which is why main stayed green. Fetch first.
              cargo fetch --locked
              cargo deny --locked --offline check licenses sources
         - name: Verify version-line consistency
           run: bun scripts/check-version-consistency.ts
         - name: Build collab web
           run: bun run collab:web:build
         - name: Build collab web
           run: bun run collab:web:build

   # Rust validation (tests, clippy, rustfmt) runs on non-PR events only.
   # Native-changing PRs are rare enough that they do not warrant PR-side
   # Rust validation or a PR-side addon build (see native_addons): Rust is
   # validated post-merge on main (kata remote cache, warm) and again at
   # release. A skipped required check still satisfies branch protection.
   rust_validate:
      name: Validate Rust workspace (bazel)
      # Disabled: requires bazel + omp-kata runner. Re-enable when self-hosted
      # runner with bazel toolchain is available.
      if: false
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - id: cache
           uses: ./.github/actions/bazel-cache
           with:
              scope: linux
         - name: Rust tests
           # The ulimit guard runs in the step that launches the bazel server
           # (limits are per-process and the server persists across steps).
           run: |
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" test //crates/...
         # Clippy scope mirrors `cargo clippy --workspace` (libraries only, no
         # test targets) plus the strict/default split: crates with
         # `[lints] workspace = true` get the workspace policy, except
         # brush-core (a vendored fork excluded from the Cargo task too).
         # pi-builtins allows every clippy group in its own manifest (ported
         # brush/uutils/jaq code) but is still held to zero rustc warnings;
         # Cargo honors that via `[lints]`, Bazel via the clippy-ported config.
         - name: Clippy (workspace lint policy on opted-in crates)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-ast/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-voice/... + //crates/pi-walker/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-strict --
         - name: Clippy (default lints elsewhere)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/... - (//crates/pi-ast/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-voice/... + //crates/pi-walker/...) - //crates/pi-builtins/... - //crates/vendor/brush-core/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy --
         - name: Clippy (manifest allows on ported pi-builtins)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-builtins/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-ported --
         - name: Rustfmt
           run: bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=rustfmt //crates/...

   # Provides the native addons every downstream TS job installs. PRs never
   # build: they fetch the latest release's Linux x64 pair from the
   # @linxiraos/pi-natives-linux-x64 npm leaf instead. The workspace loader
   # skips its version sentinel for workspace loads, so release addons load
   # fine under a newer checkout; a PR whose TS tests depend on changed
   # native behavior fails visibly and the native side lands via main.
   # Main (kata, cluster remote cache) builds all Linux-hosted targets with
   # bazel. Job name says "bazel" for continuity with required checks.
   native_addons:
      name: Build native addons (bazel)
      timeout-minutes: 50
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'ubuntu-22.04' }}
      needs: [release_metadata]
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3"

         # ---- PR path: latest release addons from npm ----
         - name: Fetch release native addons (npm)
           if: github.event_name == 'pull_request'
           shell: bash
           run: |
              set -euo pipefail
              mkdir -p \
                bazel-bin/natives-linux-x64-baseline \
                bazel-bin/natives-linux-x64-modern \
                bazel-bin/natives-win32-x64-baseline
              for pkg in linux-x64 win32-x64; do
                tarball="$(npm view "@linxiraos/pi-natives-$pkg@latest" dist.tarball)"
                echo "Fetching $tarball"
                curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
                case "$pkg" in
                  linux-x64)
                    cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" bazel-bin/natives-linux-x64-baseline/
                    cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" bazel-bin/natives-linux-x64-modern/
                    ;;
                  win32-x64)
                    cp "$RUNNER_TEMP/package/pi_natives.win32-x64-baseline.node" bazel-bin/natives-win32-x64-baseline/
                    ;;
                esac
                rm -rf "$RUNNER_TEMP/package"
              done
         # A corrupt download must fail here, not as a confusing dlopen error
         # in every downstream test shard.
         - name: Smoke release addons
           if: github.event_name == 'pull_request'
           shell: bash
           run: |
              set -euo pipefail
              # NOTE: `bun -e 'require("./x.node")'` swallows dlopen failures
              # (exit 0 on a bogus addon); a script file enforces them in
              # both bun and node. Verified against a corrupt .node fixture.
              cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
              for (const f of process.argv.slice(2)) {
               const m = require(f);
               if (!m || Object.keys(m).length === 0) {
               	console.error(`addon failed to load: ${f}`);
               	process.exit(1);
               }
              }
              EOF
              loader=node
              if command -v bun >/dev/null 2>&1; then loader=bun; fi
              "$loader" "$RUNNER_TEMP/smoke-addons.js" \
                "$PWD/bazel-bin/natives-linux-x64-baseline/pi_natives.linux-x64-baseline.node" \
                "$PWD/bazel-bin/natives-linux-x64-modern/pi_natives.linux-x64-modern.node"
         # Make the policy visible on the rare native-touching PR instead of
         # leaving a reviewer to wonder which addons the tests exercised.
         # Best-effort: a diff-API failure must not fail the job over a notice.
         - name: Note native changes tested against release addons
           if: github.event_name == 'pull_request'
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              if gh pr diff ${{ github.event.pull_request.number }} --name-only 2>/dev/null \
                 | grep -qE '^(crates/|bazel/|Cargo\.(toml|lock)|MODULE\.bazel(\.lock)?|BUILD\.bazel|\.bazelrc|\.bazelignore|\.bazelversion|rust-toolchain\.toml|rustfmt\.toml)'; then
                echo "::notice title=Native sources changed::PR CI tests against the latest release addons by design; native changes are validated post-merge on main and at release."
              fi

         # ---- main path: addons for tests vs release ----
         # Every main push (release or not) bazel-builds the tested addon
         # targets from the merged source. Fetching published leaves for
         # non-release pushes made merged TS code that depends on changed
         # native behavior (e.g. new tokenizer encodings, hashline apply
         # fixes) fail against stale published addons until the next release.
         # The warm bazel disk cache keeps this cheap (~tens of seconds).
         # TEMP bypass (2026-08-25): bazel cold builds hang on hosted runners.
         # Fetch already-published leaf addons from npm instead of building;
         # native sources are unchanged since 1.1.1, so artifacts are equal.
         # Revert to the bazel build once runner caching recovers.
         - name: Fetch native addons from npm (TEMP bypass)
           if: github.event_name != 'pull_request'
           shell: bash
           run: |
              set -euo pipefail
              mkdir -p packages/natives/native
              for pkg in linux-x64 linux-arm64 win32-x64; do
                tarball="$(npm view "@linxiraos/pi-natives-$pkg@latest" dist.tarball)"
                echo "Fetching $tarball"
                curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
                cp -L "$RUNNER_TEMP"/package/*.node packages/natives/native/
                rm -rf "$RUNNER_TEMP/package"
              done
              ls -1 packages/natives/native/*.node
         - name: Build musl native addons (bazel) [TEMP: skipped]
           if: ${{ false }}
         - name: Smoke release addons
           if: github.event_name != 'pull_request'
           shell: bash
           run: |
              set -euo pipefail
              cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
              for (const f of process.argv.slice(2)) {
               const m = require(f);
               if (!m || Object.keys(m).length === 0) {
               	console.error(`addon failed to load: ${f}`);
               	process.exit(1);
               }
              }
              EOF
                loader=node
                if command -v bun >/dev/null 2>&1; then loader=bun; fi
                # Only smoke the host-arch addons: arm64/win32/musl addons
                # cannot dlopen on this x64 glibc runner (expected).
                # Dereference first: bazel outputs are symlinks into the
                # execroot and bun resolves the realpath, loading a plain .so
                # instead of a NAPI addon. Copying with -L yields a real .node
                # file either way.
                args=()
                for f in \
                  packages/natives/native/pi_natives.linux-x64-baseline.node \
                  bazel-bin/natives-linux-x64-baseline/pi_natives.linux-x64-baseline.node \
                  packages/natives/native/pi_natives.linux-x64-modern.node \
                  bazel-bin/natives-linux-x64-modern/pi_natives.linux-x64-modern.node; do
                  if [ -f "$f" ]; then
                    cp -L "$f" "$RUNNER_TEMP/smoke-$(basename "$f")"
                    args+=("$RUNNER_TEMP/smoke-$(basename "$f")")
                  fi
                done
                "$loader" "$RUNNER_TEMP/smoke-addons.js" "${args[@]}"

         - name: Upload native addon artifacts
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: native-addons
              path: bazel-bin/natives-*/*.node
              if-no-files-found: error
              retention-days: 1

   # Manually pack each published platform leaf from its real Bazel output
   # before an npm release. Release runs build these same targets through
   # their release matrices, so this remains an explicit preflight only.
   native_leaf_pack:
      name: "Pack native leaf: ${{ matrix.target_id }}"
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_native_leaves && needs.release_metadata.outputs.is-release != 'true' && !cancelled() }}
      needs: [release_metadata]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: ubuntu-22.04,
                    target_id: linux-x64,
                    native_targets: linux-x64-baseline linux-x64-modern,
                 }
               - { os: ubuntu-22.04, target_id: linux-arm64, native_targets: linux-arm64 }
               - { os: ubuntu-22.04, target_id: win32-x64, native_targets: win32-x64-baseline }
               - { os: macos-15-intel, target_id: darwin-x64, native_targets: darwin-x64-baseline }
               - { os: macos-14, target_id: darwin-arm64, native_targets: darwin-arm64 }
      runs-on: ${{ matrix.os }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Build native addon(s)
           uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.native_targets }}
              cache-scope: release-${{ matrix.target_id }}
         - name: Pack native leaf without publishing
           run: bun scripts/ci-release-publish.ts --native-leaf "${{ matrix.target_id }}" --pack-only
         - name: Create native leaf tarball
           shell: bash
           run: |
              mkdir -p "$RUNNER_TEMP/native-leaf-tarballs"
              (
                cd "packages/natives/npm/${{ matrix.target_id }}"
                bun pm pack --destination "$RUNNER_TEMP/native-leaf-tarballs" --quiet
              )
         - name: Upload native leaf tarball
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: native-leaf-tarball-${{ matrix.target_id }}
              path: ${{ runner.temp }}/native-leaf-tarballs/*.tgz
              if-no-files-found: error
              retention-days: 1

   test_workspace:
      name: Test TS workspace fast
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'ubuntu-22.04' }}
      needs: [native_addons]
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true') && !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Test workspace packages and repo scripts (TS)
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: |
              bun run ci:test:ts:workspace
              # Not `test:scripts`: scripts/musl-release.test.ts fails on main
              # (its install.sh smoke-check executes a fake binary), so running
              # the whole group here would red this job on an unrelated break.
              bun test scripts/ci-test-ts.test.ts scripts/release.test.ts

   test_coding_agent_singleton:
      name: Test coding-agent singleton/global-state (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'ubuntu-22.04' }}
      needs: [native_addons]
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true') && !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Test coding-agent singleton/global-state bucket
           # Keep global Settings/env/fake-timer tests serial; native addon
           # artifacts are still available like every other coding-agent bucket.
           run: bun run ci:test:coding-agent:singleton

   test_ts_native:
      name: Test TS native/integration packages
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'ubuntu-22.04' }}
      needs: [native_addons]
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true') && !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Test native/TUI/browser-ish packages (TS)
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: bun run ci:test:ts:native

   test_coding_agent_ui:
      name: Test coding-agent UI/TUI (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'ubuntu-22.04' }}
      needs: [native_addons]
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true') && !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Test coding-agent UI/TUI bucket
           env:
              OMP_TEST_CONCURRENCY: "2"
           run: bun run ci:test:coding-agent:ui

   test_coding_agent_runtime:
      name: Test coding-agent runtime/session (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'ubuntu-22.04' }}
      needs: [native_addons]
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true') && !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Test coding-agent runtime bucket
           # Runtime/session tests import native-backed barrels too; keep this
           # separate for concurrency, not as a native-free guardrail.
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: bun run ci:test:coding-agent:runtime

   test_coding_agent_native:
      name: Test coding-agent native/unit (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'ubuntu-22.04' }}
      needs: [native_addons]
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true') && !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 45
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Warm Julia prelude kernel
           run: julia -e "exit(0)" || true
         - name: Test coding-agent native/unit bucket
           env:
              # 2-way chunk concurrency instead of 4: the 719-file native bucket
              # runs up to four bun test processes per host on a 4-vCPU runner,
              # and the timing-sensitive TUI/transcript/spawn tests (e.g.
              # transcript-history-exactly-once, streaming-edit-abort) trip on
              # GC pauses / OS preemption under that contention. 2-way keeps
              # those assertions inside their bounds with an acceptable time
              # tradeoff.
              OMP_TEST_CONCURRENCY: "2"
           run: bun run ci:test:coding-agent:native

   test_smoke:
      name: Test CLI smoke (TS)
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'ubuntu-22.04' }}
      needs: [native_addons]
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true') && !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: CLI smoke test
           run: bun run ci:test:smoke

   install_methods:
      name: Install method smoke tests
      runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-22.04' || 'ubuntu-22.04' }}
      needs: [native_addons]
      if: ${{ (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true') && !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Install method smoke tests
           env:
              OMP_INSTALL_TEST_SKIP_NATIVE_BUILD: "1"
           run: bun run ci:test:install-methods

   desktop_linux:
      name: Build and smoke desktop (Linux)
      runs-on: ubuntu-22.04
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 120
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - uses: ./.github/actions/web-ui-build-cache
           with:
              mode: restore
         - name: Install Web UI dependencies
           working-directory: web-ui
           run: npm ci
         - name: Install web-ui-next dependencies
           working-directory: web-ui-next
           run: npm ci
         - name: Install desktop dependencies
           working-directory: desktop
           run: npm ci
         - name: Test desktop platform contracts
           working-directory: desktop
           run: npm test
         - name: Build Linux desktop artifact
           working-directory: desktop
           run: npm run dist
         - uses: ./.github/actions/web-ui-build-cache
           with:
              mode: save
         - name: Smoke Linux desktop artifact
           shell: bash
           run: |
                set -euo pipefail
                app_dir="$(find temp/desktop/release -mindepth 1 -maxdepth 1 -type d -name 'zeta-desktop-*-linux-x64' -print -quit)"
                test -n "$app_dir"
                npm --prefix desktop run smoke -- --app "$(realpath "$app_dir")"
         # Installer/archive formats are release assets. if-no-files-found
         # errors when electron-builder failed to produce any of them.
         - name: Upload Linux desktop artifacts
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: zeta-desktop-linux
              path: |
                  temp/desktop/release/*.tar.gz
                  temp/desktop/release/*.deb
                  temp/desktop/release/*.AppImage
              if-no-files-found: error
              retention-days: 1
   desktop_windows:
      name: Build and smoke desktop (Windows)
      runs-on: windows-2022
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 35
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: win32-x64-baseline
         - name: Verify Bun is available to Windows desktop build
           shell: pwsh
           run: bun --version
         - uses: ./.github/actions/web-ui-build-cache
           with:
              mode: restore
         - name: Install Web UI dependencies
           working-directory: web-ui
           run: npm ci
         - name: Install web-ui-next dependencies
           working-directory: web-ui-next
           run: npm ci
         - name: Install desktop dependencies
           working-directory: desktop
           run: npm ci
         - name: Test desktop platform contracts
           working-directory: desktop
           run: npm test
         - name: Build Windows desktop artifact
           working-directory: desktop
           # The runner's junctioned profile dirs (C:\Users\runneradmin\
           # Application Data -> AppData\Roaming) raise EPERM when webpack
           # walks them during next build. Point the profile vars at empty
           # dirs so nothing traces through the junctions.
           env:
              APPDATA: ${{ runner.temp }}/desktop-profile
              USERPROFILE: ${{ runner.temp }}/desktop-profile
              HOME: ${{ runner.temp }}/desktop-profile
           run: |
              New-Item -ItemType Directory -Force "$env:APPDATA" | Out-Null
              npm run dist
         - name: Smoke Windows desktop artifact
           shell: pwsh
           run: |
               $app = Get-ChildItem temp/desktop/release -Directory | Where-Object Name -Like "zeta-desktop-*-win-x64" | Select-Object -First 1
               if ($null -eq $app) { throw "Windows desktop artifact not found" }
               npm --prefix desktop run smoke -- --app $app.FullName
         # Installer/archive formats are release assets. if-no-files-found
         # errors when electron-builder failed to produce any of them.
         - name: Upload Windows desktop artifacts
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: zeta-desktop-win
              path: |
                  temp/desktop/release/*.zip
                  temp/desktop/release/*.exe
              if-no-files-found: error
              retention-days: 1
   desktop_mac:
      name: "Build and smoke desktop (${{ matrix.target_id }})"
      runs-on: ${{ matrix.os }}
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 180
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: macos-15-intel, target_id: darwin-x64, native_targets: darwin-x64-baseline }
               - { os: macos-14, target_id: darwin-arm64, native_targets: darwin-arm64 }
      steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
         - uses: ./.github/actions/bun-install
         # Darwin runners build their own architecture; there is no
         # cross-hosted artifact for macOS addons.
         - name: Build native addon (bazel)
           uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.native_targets }}
              cache-scope: release-${{ matrix.target_id }}
         - uses: ./.github/actions/web-ui-build-cache
           with:
              mode: restore
         - name: Install Web UI dependencies
           working-directory: web-ui
           run: npm ci
         - name: Install web-ui-next dependencies
           working-directory: web-ui-next
           run: npm ci
         - name: Install desktop dependencies
           working-directory: desktop
           run: npm ci
         - name: Test desktop platform contracts
           working-directory: desktop
           run: npm test
         - name: Build macOS desktop artifact
           working-directory: desktop
           run: npm run dist
         - uses: ./.github/actions/web-ui-build-cache
           with:
              mode: save
         - name: Smoke macOS desktop artifact
           shell: bash
           run: |
                set -euo pipefail
                app_dir="$(find temp/desktop/release -mindepth 1 -maxdepth 1 -type d -name 'zeta-desktop-*-mac-*' -print -quit)"
                test -n "$app_dir"
                npm --prefix desktop run smoke -- --app "$PWD/$app_dir"
         # dmg/zip are release assets. if-no-files-found errors when
         # electron-builder failed to produce any of them.
         - name: Upload macOS desktop artifacts
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: zeta-desktop-mac-${{ matrix.target_id }}
              path: |
                  temp/desktop/release/*.dmg
                  temp/desktop/release/*.zip
              if-no-files-found: error
              retention-days: 1
   release_quality_gate:
      name: Release quality gate (tests)
      # rust_validate is disabled (if: false) and always reports "skipped";
      # treat skipped as pass so the gate is not silently skipped with it.
      # Test jobs are skipped wholesale when `skip_tests` is set; treat
      # "skipped" as pass exactly like rust_validate so a release-only
      # dispatch can proceed to publish without re-running the suites.
      if: "${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.rust_validate.result != 'failure' &&
         needs.native_addons.result == 'success' &&
         (needs.test_workspace.result == 'success' || needs.test_workspace.result == 'skipped') &&
         (needs.test_coding_agent_singleton.result == 'success' || needs.test_coding_agent_singleton.result == 'skipped') &&
         (needs.test_ts_native.result == 'success' || needs.test_ts_native.result == 'skipped') &&
         (needs.test_coding_agent_ui.result == 'success' || needs.test_coding_agent_ui.result == 'skipped') &&
         (needs.test_coding_agent_runtime.result == 'success' || needs.test_coding_agent_runtime.result == 'skipped') &&
         (needs.test_coding_agent_native.result == 'success' || needs.test_coding_agent_native.result == 'skipped') &&
         (needs.test_smoke.result == 'success' || needs.test_smoke.result == 'skipped') &&
         (needs.install_methods.result == 'success' || needs.install_methods.result == 'skipped') &&
         needs.check.result == 'success' }}"
      needs: [release_metadata, check, rust_validate, native_addons, test_workspace, test_coding_agent_singleton, test_ts_native, test_coding_agent_ui, test_coding_agent_runtime, test_coding_agent_native, test_smoke, install_methods]
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         # Generated-config drift gate: bazel/clippy.bazelrc is maintained by
         # scripts/release.ts (like the lockfiles); a stale file only blocks
         # publishing, never ordinary CI.
         - name: Check generated clippy config
           run: bun scripts/gen-clippy-bazelrc.ts --check
         - run: echo "release quality green"

   release_build_gate:
      name: Release build gate (artifacts)
      # All release artifacts must exist before the GitHub release is created:
      # every binary matrix job, every desktop package, and the native addons
      # they embed. Runs independently of the test suites.
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.native_addons.result == 'success' &&
         needs.release_binary.result == 'success' &&
         needs.release_binary_darwin.result == 'success' &&
         needs.desktop_linux.result == 'success' &&
         needs.desktop_windows.result == 'success' && needs.desktop_mac.result == 'success' }}
      needs: [release_metadata, native_addons, release_binary, release_binary_darwin, desktop_linux, desktop_windows, desktop_mac]
      runs-on: ubuntu-22.04
      steps:
         - run: echo "release build green"

   # Builds (does not publish) the Linux-hosted release binaries in parallel
   # with the test fan-out; the single need is native_addons, whose artifact
   # supplies their addons. Darwin builds live in release_binary_darwin so
   # they start at release_metadata time instead. Publishing (npm leaves,
   # GitHub release, core npm) is gated on release_quality_gate +
   # release_build_gate downstream.
   release_binary:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.native_addons.result == 'success' }}
      needs: [release_metadata, native_addons]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    arch: x64,
                    target_id: linux-x64,
                    binary_path: packages/coding-agent/binaries/zeta-linux-x64,
                    native_targets: linux-x64-baseline linux-x64-modern,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    libc: musl,
                    arch: x64,
                    target_id: linux-musl-x64,
                    binary_path: packages/coding-agent/binaries/zeta-linux-musl-x64,
                    native_targets: linux-musl-x64-baseline,
                 }
               - {
                    os: ubuntu-24.04-arm,
                    platform: linux,
                    arch: arm64,
                    target_id: linux-arm64,
                    binary_path: packages/coding-agent/binaries/zeta-linux-arm64,
                    native_targets: linux-arm64,
                 }
               - {
                    os: ubuntu-24.04-arm,
                    platform: linux,
                    libc: musl,
                    arch: arm64,
                    target_id: linux-musl-arm64,
                    binary_path: packages/coding-agent/binaries/zeta-linux-musl-arm64,
                    native_targets: linux-musl-arm64,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: win32,
                    arch: x64,
                    target_id: win32-x64,
                    binary_path: packages/coding-agent/binaries/zeta-windows-x64.exe,
                    native_targets: win32-x64-baseline,
                 }
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Install prebuilt native addon(s)
           uses: ./.github/actions/native-artifacts
           with:
              targets: ${{ matrix.native_targets }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         # Windows binary is cross-built on Linux, so we have no Windows runner
         # to smoke it on. Cross-build correctness is verified via the bun
         # `--compile --target=bun-windows-x64-*` cross-compile. Musl binaries
         # need the musl loader, which glibc runners lack — they are smoked in
         # the Alpine container step below instead.
         - name: Smoke release binary
           if: matrix.platform != 'win32' && matrix.libc != 'musl'
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
         - name: Smoke musl release binary on Alpine
           if: matrix.libc == 'musl'
           run: |
              binary="$(realpath "${{ matrix.binary_path }}")"
              # Bun's musl-target binaries link libstdc++/libgcc dynamically;
              # Alpine users install them alongside the binary (same as bun itself).
              docker run --rm -v "$binary:/usr/local/bin/omp:ro" alpine:3.22 sh -ec '
                apk add --no-cache libstdc++ libgcc >/dev/null
                runtime_dir="$(mktemp -d)"
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --version
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --smoke-test
              '
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}

   # Darwin release builds are the longest leg of a release (bazel-built
   # addons on macOS runners), build their own addons, and touch nothing from
   # native_addons. They are disabled: Zeta ships no macOS binaries or
   # darwin leaf packages for now.
   release_binary_darwin:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.native_addons.result == 'success' }}
      needs: [release_metadata, native_addons]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: macos-15-intel,
                    target_id: darwin-x64,
                    binary_path: packages/coding-agent/binaries/zeta-darwin-x64,
                    native_targets: darwin-x64-baseline,
                 }
               - {
                    os: macos-14,
                    target_id: darwin-arm64,
                    binary_path: packages/coding-agent/binaries/zeta-darwin-arm64,
                    native_targets: darwin-arm64,
                 }
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         # Darwin runners build their own architecture; cross-hosted artifacts
         # do not exist for macOS. The warm workflow keeps these scopes seeded
         # near HEAD, so this is normally the version-bump delta.
         - name: Build native addon (bazel)
           uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.native_targets }}
              cache-scope: release-${{ matrix.target_id }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Sign and notarize macOS binary (Developer ID)
           # Replaces the ad-hoc signature with a Developer ID + hardened-runtime
           # one (+JIT/library-validation entitlements; omp dlopens its
           # runtime-extracted native addon, which has a different Team ID) and
           # notarizes. Auto-skips until the APPLE_* secrets are configured.
           if: env.MACOS_SIGNING == 'true'
           env:
              APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
              APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
              APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
              APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
           run: bash scripts/ci-macos-sign.sh "${{ matrix.binary_path }}"
         - name: Smoke release binary
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --smoke-test
         # Darwin addons exist only on these runners; export them so
         # release_native_leaves can publish every leaf package after the
         # validation gate. Non-darwin leaves reuse the native-addons artifact.
         - name: Upload darwin native addon artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: native-addons-${{ matrix.target_id }}
              path: bazel-bin/natives-*/*.node
              if-no-files-found: error
              retention-days: 1
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}

   # Publishes the @linxiraos/pi-natives-<tag> leaf packages once
   # validation passes and every binary built. Runs on one linux runner: leaf
   # publishing is platform-agnostic file packaging (gen-npm-packages reads
   # packages/natives/native), so no per-platform runners are needed.
   release_native_leaves:
      name: Publish native leaf packages
      # Explicit condition: a matrix template job (release_binary) reports
      # "skipped" as a job; an unconditional needs would propagate that skip.
      if: ${{ github.event.inputs.build_only != 'true' && needs.release_quality_gate.result == 'success' && !cancelled() }}
      needs: [release_metadata, release_quality_gate, release_binary, release_binary_darwin]
      runs-on: ubuntu-22.04
      # id-token lets npm mint the OIDC token for trusted publishing; the
      # NODE_AUTH_TOKEN below is the fallback for unconfigured packages.
      permissions:
         id-token: write
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         # npm runs under Bun when invoked by the release script; npm 12
         # requires a newer emulated Node version than Bun 1.3 provides.
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         # Linux + win32 addons from the native_addons artifact (gnu targets
         # only — musl reuses the linux filenames and has no leaf package).
         - name: Install linux and win32 native addons
           uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern linux-arm64 win32-x64-baseline
         # Darwin addons only exist on the release_binary_darwin macos runners
         # (no cross-hosted artifact); export them here so every leaf package
         # publishes after the validation gate.
         # TEMP bypass (2026-08-25): also fetch darwin addons from npm (bazel
         # cold builds hang on hosted runners; native sources unchanged since
         # 1.1.1). Revert to artifact + bazel-natives once caching recovers.
         - name: Install darwin native addons from npm (TEMP bypass)
           shell: bash
           run: |
              set -euo pipefail
              mkdir -p packages/natives/native
              for pkg in darwin-x64 darwin-arm64; do
                tarball="$(npm view "@linxiraos/pi-natives-$pkg@latest" dist.tarball)"
                echo "Fetching $tarball"
                curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
                cp -L "$RUNNER_TEMP"/package/*.node packages/natives/native/
                rm -rf "$RUNNER_TEMP/package"
              done
              ls -1 packages/natives/native/*darwin*.node || true
         - name: Publish native leaf packages
           env:
              # Fallback auth: setup-node wrote an .npmrc referencing
              # NODE_AUTH_TOKEN; npm uses it only when OIDC has no trusted
              # publisher for the package (or on a first publish).
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
           run: |
              set -euo pipefail
              for tag in linux-x64 linux-arm64 win32-x64 darwin-x64 darwin-arm64; do
                bun run ci:release:publish-native-leaf "$tag"
              done

   release_github:
      name: Publish GitHub release
      if: ${{ github.event.inputs.build_only != 'true' && needs.release_quality_gate.result == 'success' && needs.release_build_gate.result == 'success' && !cancelled() }}
      needs: [release_metadata, release_quality_gate, release_build_gate, release_binary, release_binary_darwin, desktop_linux, desktop_windows, desktop_mac]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - name: Generate release notes from CHANGELOGs
           env:
              # `gh release list` (used to find the latest published GitHub
              # Release tag below the target so silent-tag changelog sections
              # roll forward — #2596) requires GH_TOKEN in Actions. Without
              # it gh exits non-zero and the script would degrade to legacy
              # single-version notes, defeating the recovery.
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: bun scripts/ci-release-notes.ts ${{ needs.release_metadata.outputs.release-tag }}
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
               pattern: omp-binary-*
               path: packages/coding-agent/binaries
               merge-multiple: true
         - name: Download desktop artifacts
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
               pattern: zeta-desktop-*
               path: desktop/release-assets
               merge-multiple: true
         # Dependency-free build (bun APIs + zip only), so no `bun install`
         # is needed on this runner.
         - name: Build browser relay artifacts
           run: bun run --cwd packages/browser-relay build
         # Generated after every other release asset is in place and before
         # the release is created, so SHA256SUMS.txt itself ships as an asset
         # and covers every other file uploaded alongside it.
         - name: Generate checksums
           run: |
               bun run ci:release:checksums SHA256SUMS.txt \
                 packages/coding-agent/binaries/zeta-* \
                 packages/browser-relay/dist/zeta-browser-relay-extension.zip \
                 desktop/release-assets/*
         # Idempotent rerun: a partially-published run (or a cancelled npm
         # job after a release was created) must be able to re-create the
         # release; softprops errors when the tag already exists and cannot
         # overwrite same-named assets.
         - name: Delete existing release for tag
           run: |
              gh release delete "${{ needs.release_metadata.outputs.release-tag }}" --yes --repo "${{ github.repository }}" || echo "no existing release (fresh create)"
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
               tag_name: ${{ needs.release_metadata.outputs.release-tag }}
               files: |
                  packages/coding-agent/binaries/zeta-*
                  packages/browser-relay/dist/zeta-browser-relay-extension.zip
                  desktop/release-assets/*
                  SHA256SUMS.txt
               body_path: release-notes.md
               generate_release_notes: true
   release_github_verify:
      name: Verify published release (macOS)
      if: ${{ false }}
      needs: [release_metadata, release_github]
      runs-on: macos-14
      permissions:
         contents: read
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - name: Download published macOS arm64 binary
           run: |
              curl -fsSL -o omp-darwin-arm64 "https://github.com/${{ github.repository }}/releases/download/${{ needs.release_metadata.outputs.release-tag }}/omp-darwin-arm64"
              chmod +x omp-darwin-arm64
         - name: Verify published macOS arm64 binary
           run: |
              codesign -dvvv ./omp-darwin-arm64
              codesign --verify --strict --verbose=4 ./omp-darwin-arm64
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./omp-darwin-arm64 --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./omp-darwin-arm64 --smoke-test
         - name: Assert signed release is not ad-hoc
           if: env.MACOS_SIGNING == 'true'
           run: |
              if codesign -dvvv ./omp-darwin-arm64 2>&1 | grep -qE "flags=.*adhoc|Signature=adhoc"; then
                echo "published binary is still ad-hoc signed (Developer ID signing did not run)" >&2
                exit 1
              fi
              # Gatekeeper assessment: a notarized Developer ID binary is accepted.
              # Informational — a bare (unstapled) Mach-O relies on the online ticket
              # lookup, so surface the result without gating the release on it.
              spctl -a -t exec -vv ./omp-darwin-arm64 || echo "spctl non-zero (expected for unstapled bare binary; ticket served online)"

   release_npm:
      name: Publish to npm
      # release_native_leaves must finish first: the core package lists the
      # leaf packages as lockstep-versioned optionalDependencies, so installs
      # resolve them the moment the core version is live.
      if: ${{ github.event.inputs.build_only != 'true' && needs.release_native_leaves.result == 'success' && !cancelled() }}
      needs: [release_metadata, release_binary, release_native_leaves]
      runs-on: ubuntu-22.04
      # `id-token: write` lets npm mint the GitHub OIDC token it exchanges for a
      # short-lived publish token (trusted publishing + provenance). When a
      # package has no matching trusted publisher configured, npm silently falls
      # back to NODE_AUTH_TOKEN below — which also covers first-ever publishes.
      permissions:
         id-token: write
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.4"
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         # npm runs under Bun when invoked by the release script; npm 12
         # requires a newer emulated Node version than Bun 1.3 provides.
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         # The prepack executes workspace code which loads the Linux x64
         # addon, so install the native_addons job's artifact before publishing.
         - name: Install prebuilt native addons
           uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Publish to npm
           env:
              # Fallback auth: setup-node wrote an .npmrc referencing
              # NODE_AUTH_TOKEN; npm uses it only when OIDC has no trusted
              # publisher for the package (or on a first publish).
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
           run: bun run ci:release:publish

   release_npm_zeta_web:
      name: Publish zeta-web to npm
      # zeta-web is its own version line (not part of ALL_PACKAGES): publish it
      # on every release run. Gated on the quality gate like the other release
      # jobs; `is-release` is explicit for defense in depth.
      if: ${{ needs.release_quality_gate.result == 'success' && needs.release_metadata.outputs.is-release == 'true' && github.event.inputs.build_only != 'true' && !cancelled() }}
      needs: [release_metadata, release_quality_gate]
      runs-on: ubuntu-22.04
      # id-token lets npm mint the OIDC token for trusted publishing; the
      # NODE_AUTH_TOKEN below is the fallback for unconfigured packages.
      permissions:
         id-token: write
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         # npm 12 requires a newer emulated Node version than setup-node
         # provides for trusted publishing; pin npm like the other release jobs.
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Install web-ui dependencies
           working-directory: web-ui
           run: npm ci
         - name: Build web-ui
           working-directory: web-ui
           run: npm run build
         - name: Publish zeta-web to npm
           working-directory: web-ui
           env:
              # Fallback auth: setup-node wrote an .npmrc referencing
              # NODE_AUTH_TOKEN; npm uses it only when OIDC has no trusted
              # publisher for the package (or on a first publish).
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
           run: npm publish --access public

   # Regenerate the Homebrew tap formula (can1357/homebrew-tap) from the freshly
   # published release assets and push it. Gated on release_github_verify so the
   # tap only cuts over to a release whose published binary was verified (matches
   # how release_npm is gated). No-ops when HOMEBREW_TAP_DEPLOY_KEY is unset, so a
   # release never blocks on tap access.
   # Disabled: references upstream can1357/homebrew-tap repo.
