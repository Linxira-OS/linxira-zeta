name: CI

on:
   push:
      branches: [main, "dev/*", "sync/omp-release/*", "port/**"]
      paths:
         - "packages/**"
         - "plugins/**"
         - "desktop/**"
         - "web-ui/**"
         - "web-app/**"
         - "editor/**"
         - "termide/**"
         - "main/**"
         - "crates/**"
         - "scripts/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         # A root dependency change (lockfile/catalog/patches) affects every
         # job; without these a lockfile-only push shipped untested — and a
         # release retagged onto such a commit never triggered its run.
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         - ".github/**"
         - ".zeta/**"
         - ".gitea/**"
         - "lsp/**"
         - "python/**"
         - "sdk/**"
         # Documentation and packaging-only commits still run CI: the release
         # gate (`scripts/release-v2.ts`) tags only a commit whose push run is
         # green, and a docs/README-only final commit used to match no path
         # filter, so no run ever registered and the wait timed out after 90
         # minutes with nothing to wait for.
         - "docs/**"
         - "document/**"
         - "README.md"
         - "UPDATE-LOG.md"
         - "nix/**"
         - "flake.nix"
         - "flake.lock"
   pull_request:
      branches: [main, omp2]
      paths:
         - "packages/**"
         - "plugins/**"
         - "desktop/**"
         - "web-ui/**"
         - "web-app/**"
         - "editor/**"
         - "termide/**"
         - "main/**"
         - "crates/**"
         - "scripts/**"
         - "bazel/**"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "BUILD.bazel"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         - ".github/**"
         - ".zeta/**"
         - ".gitea/**"
         - "lsp/**"
         - "python/**"
         - "sdk/**"
         # Documentation and packaging-only commits still run CI: the release
         # gate (`scripts/release-v2.ts`) tags only a commit whose push run is
         # green, and a docs/README-only final commit used to match no path
         # filter, so no run ever registered and the wait timed out after 90
         # minutes with nothing to wait for.
         - "docs/**"
         - "document/**"
         - "README.md"
         - "UPDATE-LOG.md"
         - "nix/**"
         - "flake.nix"
         - "flake.lock"
   # Nightly run for the real-browser bucket (`test_coding_agent_browser`): it
   # launches Chromium per file and is too slow/timing-sensitive for the
   # per-push path, so pushes and PRs skip it while this schedule keeps it
   # exercised. A `browser_tests` dispatch and every release-state run execute
   # it too.
   schedule:
      - cron: "37 3 * * *"
   workflow_dispatch:
      inputs:
         skip_npm:
            description: "Skip npm publish"
            type: boolean
            default: false
         full:
            description: "Run the full main gate even on a non-main branch"
            type: boolean
            default: false
         publish_plugins:
            description: "Publish only the official plugin packages (validates a pending npm trusted publisher)"
            type: boolean
            default: false
         build_desktop_archives:
            description: "Run the paused release_desktop_archives packaging path without a tag (zetawork suspended 2026-11-05; zetawork binaries must be staged manually)"
            type: boolean
            default: false
         desktop_app:
            description: "Package the Work Studio desktop editions without a release tag (upload-only smoke of the desktop pipeline)"
            type: boolean
            default: false
         browser_tests:
            description: "Run the coding-agent browser/Chromium bucket (otherwise nightly schedule and release-state runs only)"
            type: boolean
            default: false
         publish_web_ui:
            description: "Publish the frozen @linxiraos/zeta-web snapshot on release (superseded by web-app)"
            type: boolean
            default: false
         publish_zetawork:
            description: "Publish the paused @linxiraos/main workbench packages on release (zetawork is suspended since 2026-11-05)"
            type: boolean
            default: false
         # Owner-approved release override (ADR 0006). Empty by default: every
         # asset upload / npm publish is denied, and 1.5.x tags stay code-only.
         # Both values are required together, must name the exact release tag
         # version, and 1.6.0 is the first version they can unlock. The same
         # values may be set as repository variables
         # RELEASE_FREEZE_OVERRIDE_VERSION / RELEASE_FREEZE_OVERRIDE_REASON so a
         # tag push (which carries no inputs) can release an approved version.
         release_override_version:
            description: "Owner-approved version to unfreeze for assets/npm publish (must equal the tag version; 1.6.0+ only)"
            type: string
            default: ""
         release_override_reason:
            description: "Audit reason for release_override_version (required; recorded in the run log)"
            type: string
            default: ""
         # Android Tier 1 is paused by owner ruling (REQ-018); this job is
         # source-only and never runs automatically. Leave it false.
         android_build:
            description: "Build Android Tier 1 (paused by owner; no APK/AAB is produced in this train)"
            type: boolean
            default: false

# Release runs publish a `v*` tag pushed atomically with main HEAD; sharing
# the cheap branch-wide `CI-refs/heads/main` group meant a later main push
# silently cancelled the in-flight release and left the tag without a GitHub
# Release or npm publish (#2564). Detect release runs at workflow-scheduling
# time via the release-script commit subject (`chore: bump version to vX.Y.Z`),
# via `v*` tag-ref dispatches, and via manual dispatches whose tag-on-HEAD
# status is only known after checkout; scope them to a per-sha group with no
# cancellation. Every other event keeps branch-wide cancellation for PR/main churn.
#
# `scripts/release-v2.ts` tags the bump commit, so the atomic branch+tag push
# always carries the release subject as the branch HEAD and lands in the
# no-cancel group. Do NOT add `tags: ["v*"]` to `on.push`: GitHub fires the
# push event once per ref, so the atomic push would fire a second (tag-ref) run
# in the same `release-<sha>` group — a duplicate that re-publishes. A tag
# pushed on its own does not trigger CI; use `gh workflow run` (a dispatch is
# in the no-cancel group) for a standalone tag. Never push to main while a
# release run is in flight (document/release.md damage class 9).
concurrency:
   group: "${{ github.workflow }}-${{ (startsWith(github.event.head_commit.message, 'chore: bump version to ') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && format('release-{0}', github.sha) || github.ref }}"
   # Main pushes queue rather than cancel: a second push must never erase the
   # verdict the first one was about to produce (2026-10-17: four pushes in one
   # round cancelled each other, so no full run ever finished). Release runs and
   # main pushes are no-cancel; branch dispatches still supersede each other.
   cancel-in-progress: "${{ !(startsWith(github.event.head_commit.message, 'chore: bump version to ') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}"

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
   # native_addons builds the pair TS jobs need; native_addons_cross builds the
   # rest. Together they must equal //:natives-all (checked in the cross job),
   # so a filegroup addition cannot silently skip both.
   NATIVES_X64_TARGETS: natives-linux-x64-baseline natives-linux-x64-modern
   # 2026-10-08 裁定: darwin×2 与全 arm 注释退出(见 BUILD.bazel natives-all 注),
   # 稳妥构建机上线后恢复。保留: musl-x64 + win32-x64。
   NATIVES_CROSS_TARGETS: natives-linux-musl-x64-baseline natives-win32-x64-baseline
   # Fast path: PRs and non-main workflow_dispatch runs validate the code
   # without compiling natives or the Rust workspace. They restore the native
   # pair main built (or the latest npm leaf) instead. Main push and release
   # dispatch keep the full gate. Sync-branch PRs are the exception: they carry
   # upstream native changes, so they must build their own addon instead of
   # testing against main's prebuilt pair (which lacks those exports).
   FAST_PATH: ${{ ((github.event_name == 'pull_request' && !startsWith(github.head_ref, 'sync/omp-release/')) || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && inputs.full != true)) && 'true' || 'false' }}
   # Per-test wall-clock ceiling (seconds) for scripts/ci-test-ts.ts. The
   # SQLite/subprocess-heavy coding-agent suites run slowly enough on CI
   # runners that several cases (model-registry refresh, session fork,
   # credential bridge) overran the 30 s default; 120 s still catches a real
   # hang.
   OMP_TEST_TIMEOUT: "120"

permissions:
   contents: read

jobs:
   # scripts/release.ts pushes the version-bump commit and its `v*` tag
   # atomically (`git push --atomic origin refs/heads/main:refs/heads/main
   # <sha>:refs/tags/v<version>`), so a release now arrives as a single `push` to
   # `refs/heads/main` — we no longer trigger on the tag ref at all (see
   # `on.push`). This one branch-push run is therefore authoritative: it runs the
   # full build AND, when HEAD carries a release tag, the release/publish jobs.
   # `release_metadata` resolves that tag once so downstream jobs switch on
   # `is-release` and address the tag by name — `github.ref` is
   # `refs/heads/main` here, not the tag. A `workflow_dispatch` from a `v*` tag
   # ref (or from a tagged main HEAD) is also treated as a release.
   release_metadata:
      name: Resolve release metadata
      # This ~20 s git-tag probe gates the whole release chain; keep it on a
      # plain GitHub-hosted runner so nothing slower-to-schedule sits ahead of
      # it on the release critical path.
      runs-on: ubuntu-22.04
      outputs:
         is-release: ${{ steps.detect.outputs.is-release }}
         release-tag: ${{ steps.detect.outputs.release-tag }}
         # PR and non-main dispatch runs take the fast path: no Rust or native
         # compilation; native addons come from main's cache or npm.
         fast-path: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && inputs.full != true)) && 'true' || 'false' }}
         # Canary tags publish to npm's canary dist-tag (derived script-side), mark
         # the GitHub release prerelease, and skip the stable-only brew tap.
         channel: ${{ steps.detect.outputs.channel }}
         # Release freeze (ADR 0006, scripts/release-policy.ts). Every publish /
         # asset job branches on these; `false` is the default for every 1.5.x
         # tag and for any tag without an explicit owner override.
         release-version: ${{ steps.detect.outputs.release-version }}
         tag-allowed: ${{ steps.policy.outputs.tag-allowed }}
         publish-allowed: ${{ steps.policy.outputs.publish-allowed }}
         assets-allowed: ${{ steps.policy.outputs.assets-allowed }}
         release-channel: ${{ steps.policy.outputs.release-channel }}
         policy-reason: ${{ steps.policy.outputs.policy-reason }}
      steps:
         # Only a main-branch run needs tags fetched, so `git tag --points-at
         # HEAD` can see the freshly-pushed `v*`. A tag-ref dispatch reads the
         # tag straight from `github.ref_name`, and fetching `--tags` while
         # checkout uses an explicit tag refspec makes git refuse — so scope
         # fetch-tags to main refs.
         - uses: actions/checkout@v4
           with:
              fetch-tags: ${{ github.ref == 'refs/heads/main' }}
         - name: Detect release tag at HEAD
           id: detect
           shell: bash
           run: |
              is_release=false
              release_tag=""
              channel=stable
              case "${{ github.ref }}" in
                refs/tags/v[0-9]*)
                  release_tag="${{ github.ref_name }}"
                  ;;
                refs/heads/main)
                  if [ "${{ github.event_name }}" != "pull_request" ]; then
                    release_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1 || true)
                  fi
                  ;;
              esac
              if [ -n "$release_tag" ]; then
                echo "HEAD carries release tag $release_tag; this run builds and publishes the release."
                is_release=true
              fi
              if [[ "$release_tag" == *-canary.* ]]; then
                channel=canary
              fi
              {
                echo "is-release=$is_release"
                echo "release-tag=$release_tag"
                echo "release-version=${release_tag#v}"
                echo "channel=$channel"
              } >> "$GITHUB_OUTPUT"
         # Release freeze decision (ADR 0006). `decide` always exits 0 and
         # publishes its verdict as job outputs — a frozen version must still
         # build/package/test; only the asset-upload/npm-publish jobs are held.
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Evaluate release freeze policy
           id: policy
           env:
              ZETA_RELEASE_OVERRIDE_VERSION: ${{ inputs.release_override_version || vars.RELEASE_FREEZE_OVERRIDE_VERSION }}
              ZETA_RELEASE_OVERRIDE_REASON: ${{ inputs.release_override_reason || vars.RELEASE_FREEZE_OVERRIDE_REASON }}
           run: |
              set -euo pipefail
              version="${{ steps.detect.outputs.release-version }}"
              if [ -z "$version" ]; then
                echo "No release tag at HEAD: not a release run."
                bun scripts/release-policy.ts decide --version 0.0.0 --github-output
              else
                bun scripts/release-policy.ts decide --version "$version" --github-output
              fi
              grep -E '^(tag|publish|assets)-allowed=|release-channel=|policy-reason=' "$GITHUB_OUTPUT" | tail -n 5

   check:
      name: Lint, type check & web build
      # Runs in BOTH modes: the guard steps below are cheap and must gate a
      # release too. Only the workspace type check is skipped on a release run
      # (the source commit's push run already ran it, and it is the local
      # mandatory gate — see document/release.md). The test-type jobs
      # (rust_validate / the test_* buckets) still run on ordinary pushes/PRs only.
      needs: [release_metadata]
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         # Cheap traceability runs in BOTH modes. A release run skips
         # `ci:check:full` (its test fan-out is proven on the source commit), so
         # the ADR index, the ledger structure and the release-scope structure
         # must be checked here explicitly — these are file parses, not tests.
         - name: ADR, requirements and release-scope traceability
           run: |
              bun run check:adr
              bun run check:reqs
              bun scripts/release-scope.ts structural
         # The renderer is the product UI now: `zeta serve` ships this build and
         # the release packs it into `dist/web-app`. web-app is its own npm
         # project (not a root workspace member), so it installs and builds on
         # its own; `build` is `tsc -b && vite build`, so the renderer's types are
         # gated here (2026-11-06: the port's 97 errors were paid down).
         - name: Install web-app dependencies
           working-directory: web-app
           run: npm ci
         - name: Build web-app
           working-directory: web-app
           run: npm run build
         - name: Studio naming guard
           working-directory: web-app
           run: bun run check:naming
         # The runtime diagnostics read model decides whether "no managed
         # install" is a failure. A source runtime that is its own host must
         # not render as "Runtime not installed"; pin that here because the
         # renderer's unit tests are otherwise not part of any CI bucket.
         - name: Test the Studio diagnostics read model
           working-directory: web-app
           run: bun test src/studio/diagnosticsModel.test.ts src/studio/deck/capabilitySupport.test.ts
         - name: Web UI naming guard
           working-directory: web-ui
           run: bun run check:naming
         # The diagram renderer is 3 MB of the bundle and must stay behind its
         # `import()`. Read the built output, so a chunking change cannot
         # silently modulepreload it again (see web-app/vite.config.ts).
         - name: First-load guard (diagram renderer stays lazy)
           working-directory: web-app
           run: bun run check:first-load
         - name: Verify Rust license compliance (cargo-deny 0.20.2)
           run: |
              # Prebuilt release binary checked against digests pinned here:
              # `cargo install` compiled cargo-deny from source on every run
              # (~135 s), and a .sha256 fetched from the same mutable release
              # would prove transport integrity only. Bump ver and both
              # digests together.
              ver=0.20.2
              case "$(uname -m)" in
                x86_64) arch=x86_64 sha=9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f ;;
                aarch64|arm64) arch=aarch64 sha=995c82be0defc7a025cae49a2aa2644ce8245c9a3318fc4103907c6a285e8c7d ;;
                *) echo "::error::unsupported arch $(uname -m)"; exit 1 ;;
              esac
              name="cargo-deny-$ver-$arch-unknown-linux-musl"
              # vmon's omp-ci template keeps the binary a previous run of this
              # step installed. GitHub release assets go through outages;
              # crates.io keeps the job independent of them at the cost of a
              # source build.
              if [ "$(cargo-deny --version 2>/dev/null)" = "cargo-deny $ver" ]; then
                echo "cargo-deny $ver already installed"
              elif curl -fsSL --retry 5 --retry-max-time 60 -o "$RUNNER_TEMP/$name.tar.gz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/$ver/$name.tar.gz"; then
                echo "$sha  $RUNNER_TEMP/$name.tar.gz" | sha256sum -c -
                tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
                mkdir -p "$HOME/.cargo/bin"
                install -m 0755 "$RUNNER_TEMP/$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
              else
                echo "::warning::cargo-deny release download failed; building $ver from crates.io"
                cargo install --locked --force cargo-deny --version "$ver"
              fi
              # `--offline` needs every workspace crate already in the registry
              # cache. Every job runs on a fresh GitHub-hosted runner (see
              # runs-on above) with no prior cargo work, so nothing populates
              # the index for our own graph and resolution fails. Fetch first.
              cargo fetch --locked
              cargo deny --locked --offline check licenses sources
         - name: Type check workspace
           # Duplicate of the source commit's push run (and of the local
           # pre-commit gate): skip on a release run, keep the guards below.
           if: needs.release_metadata.outputs.is-release != 'true'
           run: bun run ci:check:full
         - name: Brand residue guard
           run: bun scripts/brand/brand-check.ts
         - name: Tern/OMP agent compatibility guard
           run: bun scripts/check-no-upstream-agent-compat.ts
         - name: Shared-infra ledger guard
           run: bun scripts/check-shared-infra.ts
         - name: Upstream default guard
           run: bun scripts/check-no-upstream-defaults.ts
         - name: Docs/host parity guard
           run: bun scripts/check-doc-host-parity.ts
         - name: Zeta-only sentinel guard
           run: bun scripts/check-zeta-sentinels.ts
         - name: Check CI surface
           run: bun scripts/check-ci-surface.ts
         - name: Release asset-name guard
           run: bun scripts/check-release-asset-names.ts
         - name: Package linkage guard
           run: bun scripts/check-package-linkage.ts
         - name: Service port guard
           run: bun scripts/check-service-ports.ts
         - name: Dev isolation guard
           run: bun scripts/check-dev-isolation.ts
         - name: Unit-test the dev isolation guard
           run: bun test scripts/dev-isolation.test.ts
         - name: Scope import guard
           run: bun scripts/check-scope-imports.ts
         - name: Licence map guard
           run: bun scripts/check-license-map.ts
         # Installing zetawork must install zetacode and zetaide: the launcher
         # pins them as same-line companions, the release build stages all
         # three beside each other, and the archives upload all three. A pin or
         # a packaging leg that stops carrying a companion leaves users with a
         # workbench and two missing commands — every manifest still parses.
         - name: Workbench bundle guard
           run: bun scripts/check-workbench-bundles.ts
         - name: Windows icon guard
           run: bun scripts/check-windows-icons.ts
         # The product mark is one drawing: every raster, favicon and app icon
         # under assets/, web-app/public/ and web-ui/public/icons/ is derived
         # from the SVGs. This guards self-containment, sizes, the declared
         # 16px fallback, and that the archived/legacy marks stay inert.
         - name: Logo asset guard
           run: bun scripts/check-logo-assets.ts
         # Both language-server registries (the coding-agent's and termide's) are
         # generated from `lsp/servers.json`. A hand edit to a generated file, or
         # a canonical change that was never regenerated, desyncs the two editors.
         - name: LSP server registry freshness guard
           run: bun scripts/check-lsp-servers.ts
         # The Gitea mirror is the one workflow a merge can silently desync:
         # `.gitea/workflows/local-ci.yml` must keep the same command entry
         # points as its ci.yml counterpart. Running it here is what keeps the
         # mirror honest on the GitHub side too (the local-ci `check` job runs
         # the same guard); the mirror itself never runs GitHub workflows.
         - name: Check the Gitea mirror parity
           run: bun scripts/check-local-ci-parity.ts
         # i18n: the catalogue is three files that must stay key-equal (messages
         # interface == en == zh, no blank zh value) — `packages/coding-agent/
         # src/i18n/messages.test.ts` asserts the same property, but it lives
         # under `src/` and was collected by no test bucket, so this step is the
         # only signal a catalogue edit got on a PR that did not touch anything
         # else. The description guard is its counterpart: a translated key is
         # worthless if no call site reads it (26 hardcoded `acpDescription`
         # literals shipped next to 21 unused `cmd*Acp` keys).
         - name: i18n catalogue consistency guard
           run: bun scripts/check-i18n-consistency.ts
         - name: i18n command-description guard
           run: bun scripts/check-i18n-commands.ts
         # Same reason as the package.json merge guard below: a guard whose
         # fixtures are never executed is a comment. These pin the failure modes
         # (dropped key, blank zh value, static description, broken scan scope)
         # against synthetic catalogue files.
         - name: Unit-test the i18n guards
           run: bun test scripts/check-i18n-consistency.test.ts scripts/check-i18n-commands.test.ts
         # The desktop shell mirrors the CLI's serve-discovery decision module
         # (it has no workspace dependency), so the two decision matrices must
         # stay equal.
         - name: Serve-discovery parity guard
           run: bun scripts/check-serve-discovery-parity.ts
         # robomp's worker spawns the coding-agent CLI by name, so the name it
         # resolves must be a name the image actually puts on PATH. Both sides
         # are parsed from the real files (Dockerfile shims vs
         # config.py/compose/.env.example); the image ships exactly one CLI shim
         # and nothing else on PATH resolves to the CLI.
         - name: robomp container CLI contract guard
           run: bun scripts/check-robomp-cli-contract.ts
         # Audits the standing upstream lineage on every push, so a squash /
         # force-push / skipped tag becomes visible before anyone attempts a
         # merge. The pre-merge form (--tag) runs on sync/omp-release/*.
         #
         # The guard compares HEAD against the last integrated upstream tag, so
         # it needs that tag in history. The default PR checkout is shallow and
         # carries no upstream remote, which made the guard fail with
         # "v18.8.8 does not resolve locally" on every run (run 38113627265).
         # Unshallow and fetch the ledger's baseline tag before running it.
         - name: Upstream merge lineage guard
           run: |
              set -euo pipefail
              # --force: a re-cut tag (the v1.3.0 realignment) makes the runner's own
              # tag differ from origin's, and a plain --tags fetch refuses with
              # `would clobber existing tag` before the lineage check can even run.
              git fetch --force --unshallow --tags origin 2>/dev/null || git fetch --force --tags origin
              git remote add omp-upstream https://github.com/can1357/oh-my-pi.git 2>/dev/null || true
              baseline=$(sed -n 's/.*\*\*Integrated through\*\*: *`\(v[0-9.]*\)`.*/\1/p' document/upstream-sync.md | head -n1)
              if [ -n "$baseline" ]; then
                git fetch --no-filter omp-upstream tag "$baseline"
              fi
              bun scripts/check-merge-lineage.ts
         # `.gitattributes` binds every manifest to the `merge.zeta-package`
         # driver (scripts/merge-package-json.ts). A three-way merge in the
         # driver's own rules is not enough on its own: the guard is what proves
         # the driver ran and kept the branch side, because a driver that was
         # never registered (fresh worktree, new clone, runner) degrades to a
         # conflict, and a driver that erases leaves the merge *green* — that is
         # how the 2026-10-15 v18.10.0 sync merge lost `plugins/*`, the six
         # Zeta-only scripts, `devDependencies.figlet`, the exact catalog pins
         # and the `sdk/python/zeta-rpc` targets, reverted `packageManager` to
         # `bun@>=1.4`, and brought back the `@typescript/native-preview` pin
         # that `chore(toolchain): TypeScript 7 stable tsc + bun 1.4.3` removed.
         # The scan needs this branch's own merge commits, hence the unshallow.
         - name: package.json merge-drop guard
           run: |
              set -euo pipefail
              git fetch --unshallow origin 2>/dev/null || true
              bun scripts/check-package-json-merge.ts
         - name: Unit-test the package.json merge guard
           run: bun test scripts/check-package-json-merge.test.ts
         # The driver's own tests carry the incident's real manifests
         # (`scripts/__fixtures__/package-json-merge/`), replay the merge through
         # the real script in a scratch repo, and are also the only thing that
         # catches a brand sweep rewriting the upstream-scope fixtures (merge
         # dab5fa80ac4 did exactly that and left `merge-package-json.test.ts` red
         # on main for days: no CI bucket ran it, `test:scripts` is not wired
         # into a job).
         - name: Unit-test the package.json merge driver
           run: bun test scripts/merge-package-json.test.ts
         # The member audit is only worth its exit code if it can actually see a
         # dropped member: it shipped comparing two empty member sets and printed
         # "0 member(s) dropped" + exit 0 for every input, including the v18.10.0
         # sync merge (568 members gone across 279 files in the same comparison).
         # The fixtures are scratch repositories — real commits, real `git grep`,
         # no network and no toolchain — so this stays a seconds-long gate.
         - name: Unit-test the merge member-loss auditor
           run: bun test scripts/audit-merge-members.test.ts
         # The test/fixture audit has the same failure mode as the member audit:
         # an empty set of upstream paths would report "0 missing" for every
         # merge. Its fixtures replay real tags through `git merge-tree`.
         - name: Unit-test the upstream test/fixture auditor
           run: bun test scripts/audit-merge-tests.test.ts
         # Same reasoning as the three unit-test steps above, applied to the gate
         # itself: an uncollected test rots — that is exactly what this PR found
         # in the two orphan suites below. The gate's regression pins the
         # one-page summary, the non-zero exit on failure, the brand scan's
         # report-only verdict (it exits 0 either way) and `--gates-only`
         # dropping the test phase, and it runs the real CLI twice (`--dry-run`;
         # an audit that fails on an unresolvable --base).
         - name: Unit-test the merge gate
           run: bun test scripts/merge-gate.test.ts
         # The release chain's own contract: Cargo.lock rewrite for every
         # main/ workspace member, the shipped-vs-pinned native leaf sets, the
         # updater's names against the shipped CLI assets, and the
         # upload/checksums/preflight asset surfaces. Static and hermetic (reads
         # manifests, the lock and ci.yml), so it belongs beside the other gate
         # unit tests rather than a native-artifact bucket.
         - name: Unit-test the release chain
           run: bun test scripts/release-chain.test.ts
         # The release freeze (ADR 0006): the policy unit tests plus a static
         # parse of ci.yml / the standalone publish workflows. Fails if a
         # 1.5.x tag can upload assets or publish npm by default.
         - name: Unit-test the release freeze policy
           run: bun test scripts/release-freeze.test.ts
         # The ADR index guard is structural: monotonic gaps pass, while
         # duplicates, missing index rows, illegal IDs and empty placeholders fail.
         - name: Unit-test the ADR index guard
           run: bun test scripts/check-adr-index.test.ts
         # The external package-repository contract: identity/asset/migration
         # consistency, the release asset upload, and the "no automatic
         # in-place upgrade across different installer identities" rule.
         - name: Unit-test the package linkage contract
           run: bun test scripts/check-package-linkage.test.ts
         # Orphan suite: `plugins/official/pi-messenger/tests` is a **vitest**
         # suite outside the bun workspace — the root `plugins/*` glob stops at
         # `plugins/official`, so `bun install` never installed its deps and no
         # bucket in `ci-test-ts.ts` (which walks `packages/*`) ever ran it.
         # Only `test/plugins/pi-messenger-activation.test.ts`'s "is it
         # registered" assertion touched the plugin at all. It therefore
         # installs its own dependencies here: `package.json` declares
         # `vitest ^2.1.8` and the package's `.gitignore` already ignores
         # `node_modules/` + `package-lock.json`, a standalone-vitest shape no
         # workspace bucket can host. It belongs in this job because it is
         # self-contained: its native dependency comes from npm's published
         # per-platform leaf packages (`@linxiraos/pi-natives-linux-x64`), not
         # from the addon artifact the `test_*` buckets download — the `check`
         # job deliberately has none.
         #
         # `continue-on-error` IS DELIBERATE AND TEMPORARY. Wiring the suite in
         # for the first time on 2026-10-16 found it already rotten: **7 of 438
         # tests in 6 of 49 files fail on ubuntu** (agent-message-renderer,
         # status-heartbeat ×2, teamagent-command, typebox-compat,
         # agent-end-autonomous ×2) — none of them caused by this change, all of
         # them invisible until now because no job collected the suite. The step
         # runs (and annotates) on every push so the rot cannot grow silently;
         # it does NOT gate until a follow-up PR fixes those 7 and drops this
         # flag. Do not "solve" it by deleting the step.
         - name: Test the pi-messenger plugin (vitest; known-red, annotate-only)
           working-directory: plugins/official/pi-messenger
           continue-on-error: true
           run: npm install --no-audit --no-fund && npx vitest run
   # Standalone web-ui build matrix: npm-only project — no bun-install, no
   # native addons, no Rust. Catches platform-specific breakage in the Next
   # build that the single-Linux `check` job cannot see.
   #
   # windows-2022 (restored 2026-10-20): the leg was cut on 2026-09-22 when
   # `next build` hit upstream's compile-phase EPERM scandir of the runner's
   # junctioned 'C:\Users\...\Application Data' (vercel/next.js#40760 family).
   # Restoring it was worth it: on its first real run (39356821804) everything
   # except `Build` passed on Windows — npm ci, tsc, lint, the colour guard and
   # all 354 `node --test` cases — and the run's failures were two genuine
   # cross-platform bugs of ours (ZETA_WEB_PLUGIN_ROOTS split on the drive
   # colon, POSIX paths parented by the platform instead of their own syntax;
   # fixed in f6a9045e9ab). `Build` is the only step upstream still blocks: it
   # dies with the same EPERM in Next's compile-phase glob *with*
   # outputFileTracingRoot pinned to web-ui (b33e55684b6), so that step is
   # Linux-only under a comment naming the defect. Re-enable it when the
   # upstream issue closes; do not delete the rest of the leg again — the
   # Windows consumer is real and this leg is its only PR-time signal.
   # Cheap web/desktop contracts — a *test* job, so it carries no release gate
   # and no gating on `is-release`: it must run in both modes. It exists because
   # The Electron desktop's build+smoke legs retired with the 1.3.0 release
   # surface (user ruling 2026-10-19); the desktop's
   # own contract suite — and anything that exercises the npm-installed CLI's Web
   # UI resolution — had no PR-time signal at all. v1.2.1 shipped through that
   # hole: the npm fallback asked `npx` for the unscoped `zeta-web` (the published
   # package is `@linxiraos/zeta-web`), so every launch 404'd, `serve` kept
   # listening on 43141 with a dead Web UI child, and the shell adopted that
   # corpse over and over.
   #
   # Nothing here publishes or packs: the job is test-only, deliberately
   # separate from the publish chain, and it runs in both CI modes.
   web_desktop_tests:
      name: Test web/desktop contracts
      # `bun test` pulls coding-agent modules in, whose import chain reaches the
      # native addon (unlike the desktop's own node suite): same artifact wiring
      # as the other coding-agent buckets. No `is-release` gate — this is a test
      # job, not a publish job.
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         # Node 24 = what the desktop packaging jobs use; `node --test` strips
         # the TypeScript the contract suites import from desktop/src/*.ts.
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              cache: npm
              cache-dependency-path: desktop/package-lock.json
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Install desktop dependencies
           working-directory: desktop
           run: npm ci
         # `npm test` = `tsc -p tsconfig.json && node --test scripts/*.test.mjs`:
         # the type check plus the platform/discovery/readiness contracts.
         - name: Test desktop contract suite
           working-directory: desktop
           run: npm test
         - name: Test the Web UI launcher resolution
           run: bun test packages/coding-agent/test/web-ui-launcher.test.ts
         # The port-scoped reuse/refuse decision the same launcher feeds: an
         # instance holding the port whose Web UI page does not answer must be
         # refused, not reused.
         - name: Test the serve reuse decision
           run: bun test packages/coding-agent/test/serve-registry.test.ts

   # MODULE.bazel.lock caches the crate_universe (@crates) extension result,
   # keyed by Cargo.toml/Cargo.lock/member-manifest hashes. While current, a
   # fresh bazel server skips the extension entirely; once stale, every bazel
   # job here re-runs `cargo-bazel splice` (~240 s each, CI run 36255186857).
   # Stale is slow, never wrong, so this job only makes drift visible — PRs
   # that touch Cargo files get told to run `bun run gen:bazel-lock`. The
   # check compares the recorded input hashes AND the crate coverage the
   # recorded result renders (the hashes alone cannot see a result that was
   # refreshed by hand while its crates stayed stale); on failure the job
   # evaluates the extension once and uploads the refreshed lockfile, so a
   # contributor without bazelisk can commit it as-is.
   bazel_lock:
      # No `if`: this job runs in BOTH modes — ordinary CI drift visibility and
      # the release state, where it is a release_gate dependency (a stale lock
      # must block publishing, not slip through a skipped-test release).
      name: Check MODULE.bazel.lock freshness
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         # First, and unconditionally: an unexpected result here is a bug in
         # the guard itself, not lock drift, and must not be masked by the
         # `if: failure()` refresh below.
         - name: Test the crate-coverage guard
           run: bun test scripts/bazel-lock-drift.test.ts
         - name: Check crate_universe entry
           run: bun scripts/gen-bazel-lock.ts --check
         - name: Refresh MODULE.bazel.lock
           if: failure()
           run: bun scripts/gen-bazel-lock.ts
         - name: Upload refreshed MODULE.bazel.lock
           if: failure()
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: MODULE.bazel.lock
              path: MODULE.bazel.lock

   # Rust validation (tests, clippy, rustfmt) runs on non-PR events only.
   # Native-changing PRs are rare enough that they do not warrant PR-side
   # Rust validation or a PR-side addon build (see native_addons): Rust is
   # validated post-merge on main and again at release. A skipped required
   # check still satisfies branch protection.
   rust_validate:
      name: Validate Rust workspace (bazel)
      needs: [release_metadata]
      if: needs.release_metadata.outputs.is-release != 'true' && needs.release_metadata.outputs.fast-path != 'true'
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - id: cache
           uses: ./.github/actions/bazel-cache
         - name: Rust tests
           # The ulimit guard runs in the step that launches the bazel server
           # (limits are per-process and the server persists across steps).
           run: |
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" test //crates/...
         # Clippy scope mirrors `cargo clippy --workspace` (libraries only, no
         # test targets) plus the strict/default split: crates with
         # `[lints] workspace = true` get the workspace policy.
         # pi-builtins allows every clippy group in its own manifest (ported
         # uutils/jaq code) but is still held to zero rustc warnings;
         # Cargo honors that via `[lints]`, Bazel via the clippy-ported config.
         - name: Clippy (workspace lint policy on opted-in crates)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library|rust_binary', //crates/pi-ast/... + //crates/pi-diff/... + //crates/pi-edit/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-vcs/... + //crates/pi-voice/... + //crates/pi-walker/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-strict --
         - name: Clippy (default lints elsewhere)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/... - (//crates/pi-ast/... + //crates/pi-diff/... + //crates/pi-edit/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-vcs/... + //crates/pi-voice/... + //crates/pi-walker/...) - //crates/pi-builtins/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy --
         - name: Clippy (manifest allows on ported pi-builtins)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-builtins/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-ported --
         - name: Rustfmt
           run: bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=rustfmt //crates/...

   # Provides the linux-x64 addon pair every downstream TS job installs.
   #
   # PRs never build. They restore the pair main built for the same native
   # sources from actions/cache (key = hash of every native build input:
   # toolchain and build settings plus crates/** and BUILD.bazel). With no
   # exact entry (the PR changes native inputs, or main has not built this
   # state yet) they take main's newest entry, and with no entry at all the
   # latest npm release. The workspace loader skips its version sentinel for
   # workspace loads, so any of these load under a newer checkout. Testing
   # against main's build instead of the last release keeps merged-but-
   # unreleased native fixes from failing every PR that did not touch Rust
   # (a merged grep fix plus its TS test failed 75 PR runs against the
   # 18.3.1 addon). Only main saves; see the save step for why.
   #
   # Main builds only the pair here so the TS fan-out starts as soon as it
   # links; native_addons_cross builds every other target in parallel. Job
   # name says "bazel" for continuity with required checks.
   native_addons:
      name: Build native addons (bazel)
      needs: [release_metadata]
      runs-on: ubuntu-22.04
      # actions: write lets main prune superseded addon cache entries.
      permissions:
         contents: read
         actions: write
      outputs:
         # "<artifact-relative path>=<sha256>" pairs; in-cluster consumers
         # restore these from the shared stash (see native-artifacts).
         stash: ${{ steps.stage.outputs.stash }}
      steps:
         - uses: actions/checkout@v4
         - name: Compute native addon cache key
           id: natives-key
           shell: bash
           env:
              # Must stay identical on every event: PRs look up the entry main
              # saved for the same inputs.
              NATIVE_INPUTS_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
           run: |
              echo "prefix=natives-linux-x64-v1-" >> "$GITHUB_OUTPUT"
              echo "key=natives-linux-x64-v1-$NATIVE_INPUTS_HASH" >> "$GITHUB_OUTPUT"

         # ---- PR path: main-built addons from actions/cache, else npm ----
         # `ci-natives` is a plain workspace-relative path on purpose: the
         # cache version hashes the literal path list, so the save and restore
         # sides must spell it identically, and upload-artifact skips
         # dot-directories by default.
         - name: Restore main-built native addons
           id: natives-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}
              restore-keys: |
                 ${{ steps.natives-key.outputs.prefix }}
         - name: Fetch release native addons (npm)
           if: env.FAST_PATH == 'true' && steps.natives-cache.outputs.cache-matched-key == ''
           shell: bash
           run: |
              set -euo pipefail
              tarball="$(npm view @linxiraos/pi-natives-linux-x64@latest dist.tarball)"
              echo "Fetching $tarball"
              curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
              mkdir -p ci-natives/natives-linux-x64-baseline ci-natives/natives-linux-x64-modern
              cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" ci-natives/natives-linux-x64-baseline/
              cp "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" ci-natives/natives-linux-x64-modern/
         # Make the addon source visible whenever it is not source-matched,
         # instead of leaving a reviewer to wonder which addons the tests ran.
         - name: Report native addon source
           if: env.FAST_PATH == 'true' || needs.release_metadata.outputs.is-release == 'true'
           shell: bash
           env:
              EXACT: ${{ steps.natives-cache.outputs.cache-hit }}
              MATCHED: ${{ steps.natives-cache.outputs.cache-matched-key }}
           run: |
              if [ "$EXACT" = true ]; then
                echo "Using main's addons for this exact native source state ($MATCHED)."
              elif [ -n "$MATCHED" ]; then
                echo "::notice title=Native addons not source-matched::No main build matches this PR's native sources; testing against main's newest addon build ($MATCHED). Native changes are validated post-merge on main and at release."
              else
                echo "::notice title=Native addons from npm::No main-built addon cache entry is available; testing against the latest npm release addons."
              fi

         # ---- main path: bazel build of the linux-x64 pair ----
         - id: cache
           if: env.FAST_PATH != 'true' && steps.natives-cache.outputs.cache-hit != 'true'
           uses: ./.github/actions/bazel-cache
         - name: Build linux-x64 native addons
           if: env.FAST_PATH != 'true' && steps.natives-cache.outputs.cache-hit != 'true'
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              # The addon cdylib links each peak at several GiB of rustc RSS;
              # building several addons in one invocation runs them
              # concurrently, which OOMs the runner and takes the bazel
              # server with it (exit 37 "Server terminated abruptly", runs
              # 30556752623 / 30557524371). Build one addon per invocation —
              # analysis and cached actions are shared through the persistent
              # server, so only the heavy links serialize.
              : > "$RUNNER_TEMP/bazel-build.log"
              # A non-exact cache restore leaves the previous source state's
              # addons here, possibly read-only. This build replaces them;
              # drop the stale tree before copying so the old entry cannot
              # fail the stage step with EACCES.
              chmod -R u+w ci-natives 2>/dev/null || true
              rm -rf ci-natives
              for target in $NATIVES_X64_TARGETS; do
                bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build "//:$target" 2>&1 | tee -a "$RUNNER_TEMP/bazel-build.log"
              done
              for target in $NATIVES_X64_TARGETS; do
                mkdir -p "ci-natives/$target"
                cp -L bazel-bin/"$target"/*.node "ci-natives/$target/"
              done
         # Cache-hit visibility: a supposedly warm build that executes
         # thousands of actions is the failure mode that made CI slow — make
         # it visible in the run summary instead of discovering it weeks in.
         - name: Report bazel cache stats
           if: env.FAST_PATH != 'true' && steps.natives-cache.outputs.cache-hit != 'true'
           shell: bash
           run: |
              # Bazel runs with --color=yes (config=ci); strip ANSI before
              # matching — escapes split "INFO:" from the process count in
              # the raw log.
              summary=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/bazel-build.log" | grep -E '[0-9]+ processes:' | tail -1 || true)
              echo "::notice title=Bazel build summary::${summary:-no process summary found}"

         # ---- both paths ----
         # The product loads these addons on Bun, so the runtime is pinned
         # here (package.json `packageManager`) rather than inherited from the
         # runner image — and every natives step below runs on Bun, never
         # silently falling back to node.
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         # A corrupt download or cache entry must fail here, not as a
         # confusing dlopen error in every downstream test shard.
         - name: Smoke native addons
           shell: bash
           run: |
              set -euo pipefail
              # NOTE: `bun -e 'require("./x.node")'` swallows dlopen failures
              # (exit 0 on a bogus addon); a script file enforces them.
              # Verified against a corrupt .node fixture.
              cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
              for (const f of process.argv.slice(2)) {
               const m = require(f);
               if (!m || Object.keys(m).length === 0) {
               	console.error(`addon failed to load: ${f}`);
               	process.exit(1);
               }
              }
              EOF
              bun "$RUNNER_TEMP/smoke-addons.js" \
                "$PWD/ci-natives/natives-linux-x64-baseline/pi_natives.linux-x64-baseline.node" \
                "$PWD/ci-natives/natives-linux-x64-modern/pi_natives.linux-x64-modern.node"
         # The smoke above only proves dlopen. Bun is where the product runs
         # these addons, and napi-rs treats an alternate runtime's Node-API
         # implementation as best-effort (its own Bun CI step is
         # continue-on-error), so "the addons work on Bun" is asserted
         # directly here: real native operations, no skips, blocking. A real
         # Bun gap found here is a release blocker, never a rerun.
         - name: Bun natives regression (real operations)
           run: |
              bun packages/natives/scripts/bun-runtime-smoke.ts \
                "$PWD/ci-natives/natives-linux-x64-baseline/pi_natives.linux-x64-baseline.node" \
                "$PWD/ci-natives/natives-linux-x64-modern/pi_natives.linux-x64-modern.node"
         # Test jobs download ~120 MB of artifact over the network (44-68 s
         # per job, on the critical path). On the optional self-hosted infra a
         # shared repo cache is mounted at /opt/bazel-repo-cache (the xwin
         # cache already lives there), so stash the pair content-addressed
         # beside it; the native-artifacts action restores and re-verifies it
         # and falls back to the artifact on any miss. GitHub-hosted runners
         # skip the stash entirely and download the artifact. Best-effort: a
         # stash failure only costs consumers the download.
         - name: Stage native addons for consumers
           id: stage
           shell: bash
           run: |
              set -euo pipefail
              stash=""
              for f in ci-natives/natives-linux-x64-*/*.node; do
                sha="$(sha256sum "$f" | cut -d' ' -f1)"
                stash="$stash ${f#ci-natives/}=$sha"
              done
              echo "stash=${stash# }" >> "$GITHUB_OUTPUT"
              stash_dir=/opt/bazel-repo-cache/ci-natives
              if [ -z "${BAZEL_REMOTE_USER:-}" ] || [ ! -w /opt/bazel-repo-cache ]; then
                echo "No in-cluster stash on this runner; consumers download the artifact."
                exit 0
              fi
              if ! mkdir -p "$stash_dir"; then
                echo "::warning title=Native addon stash::cannot create $stash_dir; consumers will download the artifact"
                exit 0
              fi
              # Consumers of a run need its entries for minutes; two days
              # covers re-runs while bounding the shared-cache footprint.
              find "$stash_dir" -type f -mmin +2880 -delete 2>/dev/null || true
              for entry in ${stash# }; do
                rel="${entry%%=*}"
                sha="${entry##*=}"
                dest="$stash_dir/$sha.node"
                if [ -f "$dest" ]; then
                  touch "$dest"
                  continue
                fi
                tmp="$stash_dir/.$sha.$$.tmp"
                if cp "ci-natives/$rel" "$tmp" && mv -f "$tmp" "$dest"; then
                  echo "stashed $rel -> $dest"
                else
                  rm -f "$tmp"
                  echo "::warning title=Native addon stash::could not stash $rel; consumers will download the artifact"
                fi
              done
         # Only main saves: an entry saved on any other ref is readable by
         # that ref alone yet counts against the shared 10 GB repo quota,
         # whose LRU eviction has already cost the darwin release archives.
         # Probe first so an existing entry is not re-uploaded, then keep
         # only the newest two entries so the footprint stays ~100 MB.
         # The three steps below run only on main (never exercised by PR or
         # branch runs) and are pure optimization for later PRs: a failure
         # must never fail native_addons and with it every test job.
         - name: Probe native addon cache entry
           id: natives-cache-probe
           if: env.FAST_PATH != 'true' && needs.release_metadata.outputs.is-release != 'true' && github.ref == 'refs/heads/main'
           continue-on-error: true
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}
              lookup-only: true
         - name: Save native addon cache entry
           if: env.FAST_PATH != 'true' && needs.release_metadata.outputs.is-release != 'true' && github.ref == 'refs/heads/main' && steps.natives-cache-probe.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives
              key: ${{ steps.natives-key.outputs.key }}
         - name: Prune superseded native addon cache entries
           if: env.FAST_PATH != 'true' && needs.release_metadata.outputs.is-release != 'true' && github.ref == 'refs/heads/main' && steps.natives-cache-probe.outputs.cache-hit != 'true'
           continue-on-error: true
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
              PREFIX: ${{ steps.natives-key.outputs.prefix }}
           run: |
              # Best-effort: a failed prune leaves eviction to GitHub's LRU.
              gh cache list --repo "$GITHUB_REPOSITORY" --ref refs/heads/main --key "$PREFIX" \
                  --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' \
                | while read -r id; do
                    gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true
                  done || true

         - name: Upload linux-x64 native addon artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: natives-linux-x64
              path: ci-natives/natives-linux-x64-*/*.node
              if-no-files-found: error
              retention-days: 1

   # The remaining targets (darwin, arm64, musl and win32 cross builds). Only
   # release jobs consume them, so they build beside the TS fan-out instead of
   # ahead of it: serially after the pair they held every test job back ~10
   # min on native-changing main pushes. Non-PR only, like rust_validate.
   native_addons_cross:
      name: Build native addons (bazel, cross targets)
      needs: [release_metadata]
      if: needs.release_metadata.outputs.fast-path != 'true'
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - name: Compute cross addon cache key
           id: cross-key
           shell: bash
           env:
              NATIVE_INPUTS_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'MODULE.bazel', 'MODULE.bazel.lock', 'rust-toolchain.toml', 'rustfmt.toml', '.bazelrc', '.bazelignore', '.bazelversion', 'bazel/**', 'crates/**', 'BUILD.bazel') }}
           run: |
              echo "prefix=natives-cross-v1-" >> "$GITHUB_OUTPUT"
              echo "key=natives-cross-v1-$NATIVE_INPUTS_HASH" >> "$GITHUB_OUTPUT"
         - name: Restore cross addon cache
           id: cross-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives-cross
              key: ${{ steps.cross-key.outputs.key }}
              restore-keys: |
                 ${{ steps.cross-key.outputs.prefix }}
         - id: cache
           uses: ./.github/actions/bazel-cache
         - name: Build cross-target native addons
           if: steps.cross-cache.outputs.cache-hit != 'true'
           run: |
              set -eo pipefail
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              # One addon per invocation, for the OOM reason in native_addons.
              : > "$RUNNER_TEMP/bazel-build.log"
              for target in $NATIVES_CROSS_TARGETS; do
                bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build "//:$target" 2>&1 | tee -a "$RUNNER_TEMP/bazel-build.log"
              done
         - name: Stage cross addons for cache and artifact
           if: steps.cross-cache.outputs.cache-hit != 'true'
           shell: bash
           run: |
              set -euo pipefail
              # Same stale, read-only cache entry as native_addons: the build
              # above replaced the source state, so do not copy over it.
              chmod -R u+w ci-natives-cross 2>/dev/null || true
              rm -rf ci-natives-cross
              for target in $NATIVES_CROSS_TARGETS; do
                mkdir -p "ci-natives-cross/$target"
                cp -L bazel-bin/"$target"/*.node "ci-natives-cross/$target/"
              done
         - name: Save cross addon cache
           if: github.ref == 'refs/heads/main' && needs.release_metadata.outputs.is-release != 'true' && steps.cross-cache.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ci-natives-cross
              key: ${{ steps.cross-key.outputs.key }}
         # The two jobs' target lists must together cover //:natives-all
         # exactly; a target added to the filegroup but to neither list would
         # otherwise silently never build or ship. cquery, not query: the rc's
         # --config=ci is defined for build only, which cquery inherits and
         # query rejects; this also reuses the warm server.
         - name: Check addon target lists cover natives-all
           run: |
              set -euo pipefail
              read -r -a listed <<< "$NATIVES_X64_TARGETS $NATIVES_CROSS_TARGETS"
              expected="$(printf '%s\n' "${listed[@]}" | sort)"
              actual="$(bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" cquery 'labels(srcs, //:natives-all)' 2>"$RUNNER_TEMP/query.err" | sed -E 's/ \(.*\)$//; s/.*://' | sort)" || {
                cat "$RUNNER_TEMP/query.err"
                exit 1
              }
              if [ "$expected" != "$actual" ]; then
                echo "::error title=Native addon target lists::NATIVES_X64_TARGETS + NATIVES_CROSS_TARGETS must equal //:natives-all srcs"
                diff <(echo "$expected") <(echo "$actual") || true
                exit 1
              fi
         # 2026-10-08 裁定: darwin-arm64 addon 不再构建,Apple FM 桥验证随之挂起;
         # 恢复 darwin 目标时连同本段一起取消注释。
         # - name: Verify Apple Foundation Models bridge
         # run: |
         # set -euo pipefail
         # addon=bazel-bin/natives-darwin-arm64/pi_natives.darwin-arm64.node
         # # The bridge is embedded as a separate dylib (module OmpAppleFm),
         # # never linked: a linked Swift runtime crashes the addon on load
         # # on older macOS.
         # grep -aqF OmpAppleFm "$addon" ||
         # { echo "::error::Darwin arm64 addon was built without the Apple Foundation Models bridge"; exit 1; }
         # dylibs="$(llvm-objdump --macho --dylibs-used "$addon")"
         # if grep -E 'libswift|FoundationModels' <<< "$dylibs"; then
         # echo "::error::Darwin arm64 addon links the Swift runtime or FoundationModels directly"; exit 1
         # fi
         - name: Report bazel cache stats
           if: steps.cross-cache.outputs.cache-hit != 'true'
           shell: bash
           run: |
              summary=$(sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/bazel-build.log" | grep -E '[0-9]+ processes:' | tail -1 || true)
              echo "::notice title=Bazel build summary::${summary:-no process summary found}"
         # Everything except the linux-x64 pair, which native_addons ships as
         # its own small `natives-linux-x64` artifact.
         - name: Upload remaining native addon artifacts
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: native-addons
              path: |
                 ci-natives-cross/natives-*/*.node
              if-no-files-found: error
              retention-days: 1

   test_coding_agent_native:
      name: "Test coding-agent native/unit (TS) ${{ matrix.shard }}"
      needs: [release_metadata, native_addons]
      if: ${{ needs.release_metadata.outputs.is-release != 'true' && !cancelled() && needs.native_addons.result == 'success' }}
      runs-on: ubuntu-22.04
      timeout-minutes: 25
      # The longest PR job, so it runs as three shards on hosted PR runners
      # (two left the slower shard ~25 s behind every other job); main keeps
      # one. Declared first among the test jobs so the longest bucket is not
      # the one left queued last (probe run 36238796966 queued it 1.9 min
      # behind the shorter buckets).
      # No required check keys on this job name (branch protection and
      # rulesets are off for main/omp2), so the per-shard names are safe.
      # KNOWN FLAKE (annotate-only): mcp/transports/stdio.test.ts
      # "still reaps a SIGTERM-trapping grandchild…" — processExists(grandchildPid)
      # races the 20 ms pid-poll loop under shard load; pre-existing on main
      # (passes on reruns, with no code path in common). Rerun the shard
      # before investigating.
      # Same class (2026-10-17): launch/broker-endpoint-loss — see the
      # concurrency note on the test step. The browser-relay suites that used to
      # flake here now live in `test_coding_agent_browser` (nightly/release).
      strategy:
         fail-fast: false
         matrix:
            shard: ${{ fromJSON((github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && inputs.full != true)) && '["1/3","2/3","3/3"]' || '["1/1"]') }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent native/unit bucket
           # 2, not 4: this bucket still carries timing-sensitive tests
           # (broker-endpoint-loss, mcp stdio grandchild), and four chunks on a
           # 4-core runner saturate it — the flakes simply trade places run to
           # run (2026-10-17: three consecutive main reds). The browser suites
           # moved to `test_coding_agent_browser`.
           # The UI/TUI job already runs at 2 for the same reason.
           env:
              OMP_TEST_CONCURRENCY: "2"
              OMP_TEST_SHARD: ${{ matrix.shard }}
           run: bun run ci:test:coding-agent:native

   test_workspace:
      name: Test TS workspace fast
      needs: [release_metadata, native_addons]
      if: ${{ needs.release_metadata.outputs.is-release != 'true' && !cancelled() && needs.native_addons.result == 'success' }}
      runs-on: ubuntu-22.04
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Install project-local TUI debug tool dependencies
           run: bun install --cwd .zeta/tools --frozen-lockfile
         - name: Test workspace packages and repo scripts (TS)
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: |
              bun run ci:test:ts:workspace
              # Not `test:scripts`: scripts/musl-release.test.ts fails on main
              # (its install.sh smoke-check executes a fake binary), so running
              # the whole group here would red this job on an unrelated break.
              bun test scripts/ci-test-ts.test.ts scripts/release.test.ts scripts/run-rs-task.test.ts
         # REQ-065 memory guardrails. The consumer retained-byte tests are the
         # real gate; the bounded soak is report-only until a threshold is
         # measured on this runner, so it asserts no RSS budget.
         - name: Test memory retention caps
           run: bun test packages/tui/test/render-cache-consumer-bounds.test.ts packages/tui/test/render-cache-pressure-restore.test.ts
         - name: Run bounded memory soak (report-only)
           run: bun scripts/memory-soak.ts --seconds=180 --sample-ms=500 --commit-ms=5000 --out=temp/memory-soak.json
         - name: Upload memory soak report
           if: always()
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: memory-soak
              path: temp/memory-soak.json
              if-no-files-found: warn
              retention-days: 7
         # Orphan suite: `packages/stats` is a workspace package that sits in no
         # `ci-test-ts.ts` bucket (neither `fastWorkspacePackages` nor
         # `nativeAndIntegrationPackages`), so neither CI nor the local
         # `bun run test:ts` ever ran its 214 tests. It runs *here*, not in
         # `check`, because its suites import `@linxiraos/pi-utils` →
         # `@linxiraos/pi-natives`, whose loader throws at import time unless a
         # Linux addon is present in `packages/natives/native/` — and the
         # `packages/natives` workspace package declares no per-platform
         # optional dependency, so only the steps above (native-artifacts) can
         # supply it. In `check` this suite is a guaranteed red.
         #
         # `continue-on-error` IS DELIBERATE AND TEMPORARY. First collection
         # (2026-10-16) found **69 of 214 tests failing across 37 files**: one
         # file no longer compiles against `src/db.ts`
         # (`pruneOrphanSessionsInDb` was removed/renamed) and the sync,
         # rollup, tool-stats and frustration-dashboard assertions drifted
         # while nothing ran them. The step runs and annotates on every push so
         # the drift cannot grow silently; it does NOT gate until a follow-up PR
         # fixes those 69 and drops this flag. Do not "solve" it by deleting the
         # step.
         - name: Test the stats package (bun test; known-red, annotate-only)
           continue-on-error: true
           run: bun test packages/stats/test

   test_coding_agent_singleton:
      name: Test coding-agent singleton/global-state (TS)
      needs: [release_metadata, native_addons]
      if: ${{ needs.release_metadata.outputs.is-release != 'true' && !cancelled() && needs.native_addons.result == 'success' }}
      runs-on: ubuntu-22.04
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent singleton/global-state bucket
           # Keep global Settings/env/fake-timer tests serial; native addon
           # artifacts are still available like every other coding-agent bucket.
           run: bun run ci:test:coding-agent:singleton

   test_ts_native:
      name: Test TS native/integration packages
      needs: [release_metadata, native_addons]
      if: ${{ needs.release_metadata.outputs.is-release != 'true' && !cancelled() && needs.native_addons.result == 'success' }}
      runs-on: ubuntu-22.04
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test native/TUI/browser-ish packages (TS)
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: bun run ci:test:ts:native

   test_coding_agent_ui:
      name: Test coding-agent UI/TUI (TS)
      needs: [release_metadata, native_addons]
      if: ${{ needs.release_metadata.outputs.is-release != 'true' && !cancelled() && needs.native_addons.result == 'success' }}
      runs-on: ubuntu-22.04
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent UI/TUI bucket
           env:
              OMP_TEST_CONCURRENCY: "2"
           run: bun run ci:test:coding-agent:ui

   test_coding_agent_runtime:
      name: Test coding-agent runtime/session (TS)
      needs: [release_metadata, native_addons]
      if: ${{ needs.release_metadata.outputs.is-release != 'true' && !cancelled() && needs.native_addons.result == 'success' }}
      runs-on: ubuntu-22.04
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent runtime bucket
           # Runtime/session tests import native-backed barrels too; keep this
           # separate for concurrency, not as a native-free guardrail.
           env:
              OMP_TEST_CONCURRENCY: "4"
           run: bun run ci:test:coding-agent:runtime

   test_coding_agent_browser:
      name: Test coding-agent browser/Chromium (TS)
      needs: [release_metadata, native_addons]
      # Scheduling gate: nightly cron, an explicit `browser_tests` dispatch, or a
      # release-state run. Ordinary push/PR skips it — these suites launch a
      # real browser (or drive a CDP endpoint) and were the slow/timing-sensitive
      # tail of the per-push native bucket. Local full runs still cover them
      # (`coding-agent-heavy` includes the bucket).
      if: ${{ !cancelled() && needs.native_addons.result == 'success' &&
         (needs.release_metadata.outputs.is-release == 'true' || github.event_name == 'schedule' || inputs.browser_tests == true) }}
      runs-on: ubuntu-22.04
      timeout-minutes: 35
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Test coding-agent browser/Chromium bucket
           # Each file starts its own browser; two chunks keep the runner from
           # hosting several Chromium instances at once.
           env:
              OMP_TEST_CONCURRENCY: "2"
           run: bun run ci:test:coding-agent:browser

   test_smoke:
      name: Test CLI smoke (TS)
      runs-on: ubuntu-22.04
      needs: [release_metadata, native_addons]
      if: ${{ needs.release_metadata.outputs.is-release != 'true' && !cancelled() && needs.native_addons.result == 'success' }}
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: CLI smoke test
           run: bun run ci:test:smoke

   install_methods:
      name: Install method smoke tests
      runs-on: ubuntu-22.04
      needs: [native_addons]
      if: ${{ !cancelled() && needs.native_addons.result == 'success' }}
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
              stash: ${{ needs.native_addons.outputs.stash }}
         - name: Install method smoke tests
           env:
              OMP_INSTALL_TEST_SKIP_NATIVE_BUILD: "1"
           run: bun run ci:test:install-methods

   # Aggregates the release-state prerequisites so publish-side release jobs
   # gate on one result. In the release state the test-type jobs above are
   # skipped (their greenness is a precondition enforced by scripts/release-v2.ts
   # verifying the release SOURCE commit's push run before tagging), so this gate
   # needs the jobs that actually run on a release — including `check`, whose
   # guard steps must gate publishing. Skipped jobs would not appear in
   # needs.*.result at all, and the guard below counts only failure/cancelled.
   # Binary BUILDS deliberately do not wait for this gate — they run in parallel
   # and only publishing is held back.
   release_gate:
      name: Release validation gate
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         !contains(needs.*.result, 'failure') &&
         !contains(needs.*.result, 'cancelled') }}
      needs: [release_metadata, check, bazel_lock, native_addons, native_addons_cross, install_methods, test_coding_agent_browser]
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         # Mechanical release scope (REQ-021): a public tag needs every shipped
         # REQ VERIFIED/RELEASED with independent evidence, every deferred row
         # approved with a re-entry trigger, and its contract ADRs Accepted and
         # indexed. 1.5.x internal tags run the structural pass only (the script
         # consults the freeze policy); nothing here publishes.
         - name: Release scope and traceability
           env:
              # Same owner override the metadata job evaluated: without it the
              # script treats a public tag as frozen and skips the scope rules.
              ZETA_RELEASE_OVERRIDE_VERSION: ${{ inputs.release_override_version || vars.RELEASE_FREEZE_OVERRIDE_VERSION }}
              ZETA_RELEASE_OVERRIDE_REASON: ${{ inputs.release_override_reason || vars.RELEASE_FREEZE_OVERRIDE_REASON }}
           run: bun scripts/release-scope.ts check --version "${{ needs.release_metadata.outputs.release-version }}"
         # Generated-config drift gate: bazel/clippy.bazelrc is maintained by
         # scripts/release.ts (like the lockfiles); a stale file only blocks
         # publishing, never ordinary CI.
         - name: Check generated clippy config
           run: bun scripts/gen-clippy-bazelrc.ts --check
         # `test_coding_agent_browser` is release-state-only (skipped on push/PR),
         # so unlike the other buckets its result is not already covered by the
         # green push run `scripts/release-v2.ts` verified before tagging. A
         # skipped prerequisite never appears as a failure, and the gate's `if`
         # only rejects failure/cancelled — assert `success` explicitly so a
         # skipped browser bucket fails the gate instead of silently shipping.
         - name: Assert the browser bucket ran
           if: ${{ needs.test_coding_agent_browser.result != 'success' }}
           run: |
              echo "::error::test_coding_agent_browser result is '${{ needs.test_coding_agent_browser.result }}', not 'success' — the release gate requires the browser/Chromium bucket"
              exit 1
         - run: echo "release validation green"

   # Builds (does not publish) the Linux-hosted release binaries in parallel
   # with the test fan-out; the needs are the native_addons jobs, whose
   # artifacts supply their addons. Publishing (npm leaves, GitHub release,
   # core npm) is gated on release_gate downstream.
   release_binary:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ !cancelled() &&
         (needs.release_metadata.outputs.is-release == 'true' || inputs.build_desktop_archives || inputs.desktop_app) &&
         needs.native_addons.result == 'success' &&
         needs.native_addons_cross.result == 'success' }}
      needs: [release_metadata, native_addons, native_addons_cross]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    target_id: linux-x64,
                    binary_path: packages/coding-agent/binaries/zeta-cli-linux-x64,
                    native_targets: linux-x64-baseline linux-x64-modern,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    libc: musl,
                    target_id: linux-musl-x64,
                    binary_path: packages/coding-agent/binaries/zeta-cli-linux-musl-x64,
                    native_targets: linux-musl-x64-baseline,
                 }
               - {
                    os: windows-2022,
                    platform: win32,
                    target_id: win32-x64,
                    binary_path: packages/coding-agent/binaries/zeta-cli-windows-x64.exe,
                    native_targets: win32-x64-baseline,
                 }
      # The Windows leg must build on a Windows runner: Bun only honors
      # `windows.icon` when compiling on Windows (`--windows-icon` reports the
      # same restriction), so a Linux cross-build produces a Bun-face PE and
      # the icon guard rightly rejects it. Linux/musl stay on one hosted Linux
      # runner. Every include entry defines `os`; a partially defined matrix key
      # makes GitHub drop the whole matrix (damage class 14 in AGENTS.md).
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - run: bun install --frozen-lockfile
         - name: Install prebuilt native addon(s)
           uses: ./.github/actions/native-artifacts
           with:
              targets: ${{ matrix.native_targets }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
              # compile-binary embeds the commit and the smoke check below reads
              # it back from the artifact itself (REQ-036).
              ZETA_EXPECTED_COMMIT: ${{ github.sha }}
           run: bun run ci:release:build-binaries
         # Windows binary is cross-built on Linux, so we have no Windows runner
         # to smoke it on. Cross-build correctness is verified via the bun
         # `--compile --target=bun-windows-x64-*` cross-compile. Musl binaries
         # need the musl loader, which glibc runners lack — they are smoked in
         # the Alpine container step below instead.
         - name: Verify Windows icon resources
           if: matrix.platform == 'win32'
           run: bun scripts/check-windows-icons.ts --binaries "${{ matrix.binary_path }}"
         - name: Smoke release binary
           if: matrix.platform != 'win32' && matrix.libc != 'musl'
           env:
              GITHUB_SHA: ${{ github.sha }}
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
              # Execute the artifact and read its embedded build commit (REQ-036).
              bun scripts/check-release-artifact.ts --path "${{ matrix.binary_path }}" --expect-commit "$GITHUB_SHA"
         - name: Verify Windows artifact build commit
           if: matrix.platform == 'win32'
           shell: bash
           env:
              GITHUB_SHA: ${{ github.sha }}
           run: bun scripts/check-release-artifact.ts --path "${{ matrix.binary_path }}" --expect-commit "$GITHUB_SHA"
         - name: Smoke musl release binary on Alpine
           if: matrix.libc == 'musl'
           env:
              GITHUB_SHA: ${{ github.sha }}
           run: |
              binary="$(realpath "${{ matrix.binary_path }}")"
              # Bun's musl-target binaries link libstdc++/libgcc dynamically;
              # Alpine users install them alongside the binary (same as bun itself).
              docker run --rm -e GITHUB_SHA -v "$binary:/usr/local/bin/zetacode:ro" alpine:3.22 sh -ec '
                apk add --no-cache libstdc++ libgcc >/dev/null
                runtime_dir="$(mktemp -d)"
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" zetacode --version
                out=$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" zetacode --smoke-test)
                echo "$out"
                echo "$out" | grep -qx "build-commit: $GITHUB_SHA" || {
                  echo "::error::musl artifact build commit does not match $GITHUB_SHA (REQ-036)"; exit 1;
                }
              '
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: zeta-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}
         # Main-only save, after the build so it is off the leg's critical
         # path: caches saved on a tag or branch are readable only by that ref
         # yet count against the shared 10 GB quota (see bazel-cache).
         - name: Save bun store
           if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
           continue-on-error: true
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

   # Bare native binary of zetaide (the vendored termide workspace), published
   # as a release asset for distribution repackaging: the asset file name is
   # the target id and the Linxira pacman PKGBUILDs fetch it verbatim from
   # releases/download/v<pkgver>/. Same artifact family as release_binary
   # (zeta-binary-* names merged into the same release staging dir) so every
   # asset enters SHA256SUMS.txt. No native-addon dependency — this product
   # embeds no node addons — so this job runs purely in parallel with the test
   # fan-out. The cargo legs compile under the workspace's own
   # rust-toolchain.toml pin (currently 1.97.1, read at run time — the
   # same toolchain main_tests / termide_tests gate with). Windows assets cross-compile on the Linux
   # runner like the zeta-cli-* win32-x64 leg: cargo via the GNU target (the
   # same "Win GNU target" method the committed npm leaf binaries are
   # rebuilt with, no Windows runner needed).
   #
   # zetawork is paused (2026-11-05 ruling): its `zeta-work-*` TUI and
   # `zetawork-gui-*` desktop legs are not built or shipped here any more, and
   # scripts/ci-release-build-binaries.ts no longer declares them, so a stale
   # `RELEASE_TARGETS` value naming one fails as an unknown target.
   release_product_binaries:
      name: "Release product binary: ${{ matrix.target_id }}"
      # `build_desktop_archives` is the paused archives dry run: it still wants
      # the zetaide legs the desktop packaging carries as a companion.
      if: ${{ !cancelled() &&
         (needs.release_metadata.outputs.is-release == 'true' || inputs.build_desktop_archives) }}
      needs: [release_metadata]
      strategy:
         fail-fast: false
         matrix:
            include:
               - { os: ubuntu-22.04, platform: linux, target_id: zeta-ide-linux-x64, artifact: zeta-ide-linux-x64 }
               - { os: ubuntu-22.04, platform: win32, target_id: zeta-ide-win-x64, artifact: zeta-ide-win-x64.exe }
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         # The build script statically imports the coding-agent compile
         # helper, so the workspace install runs even though these legs
         # never bundle the CLI.
         - uses: ./.github/actions/bun-install
         - name: Install mingw-w64 cross toolchain
           if: matrix.platform == 'win32'
           run: |
              sudo apt-get update
              # mingw-w64: GNU cross toolchain (linker + cc auto-detection);
              # nasm: aws-lc-sys (pulled in by russh through the vendored
              # termide crates) assembles its windows-gnu crypto sources.
              sudo apt-get install -y --no-install-recommends mingw-w64 nasm
         # The workspace pins are the source of truth: both `main/` and
         # `termide/` ship a rust-toolchain.toml, and cargo obeys it no matter
         # which toolchain the action made default. Hardcoding a version here
         # (1.91.1, before the pin moved to 1.97.1) installed the wrong
         # toolchain and the cross leg died with `can't find crate for core`
         # because the pinned one had no windows-gnu target.
         - name: Resolve Rust toolchain pin
           id: rust-pin
           run: |
              channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' main/rust-toolchain.toml | head -1)"
              termide_channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' termide/rust-toolchain.toml | head -1)"
              if [ -z "$channel" ] || [ "$channel" != "$termide_channel" ]; then
                 echo "::error::main/ ($channel) and termide/ ($termide_channel) toolchain pins must exist and match"
                 exit 1
              fi
              echo "channel=$channel" >> "$GITHUB_OUTPUT"
         - uses: dtolnay/rust-toolchain@master
           with:
              toolchain: ${{ steps.rust-pin.outputs.channel }}
              components: rustfmt, clippy
              targets: ${{ matrix.platform == 'win32' && 'x86_64-pc-windows-gnu' || 'x86_64-unknown-linux-gnu' }}
         - uses: Swatinem/rust-cache@v2
           with:
              workspaces: ${{ startsWith(matrix.target_id, 'zeta-ide-') && 'termide' || 'main' }}
         - name: Build release product binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
              # GNU cross linker for the cargo win32 legs; unset (empty) on
              # native Linux legs where cargo uses the default host linker.
              CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: ${{ matrix.platform == 'win32' && 'x86_64-w64-mingw32-gcc' || '' }}
           run: bun run ci:release:build-binaries
         # zetaide: --version short-circuits before any terminal setup
         # (termide flag parse), so a bare runner probe is safe. Windows
         # assets are cross-built — nothing on the Linux runner can exec them
         # (same policy as the zeta-cli-* win32-x64 leg).
         - name: Verify Windows icon resources
           if: matrix.platform == 'win32'
           run: bun scripts/check-windows-icons.ts --binaries "packages/coding-agent/binaries/${{ matrix.artifact }}"
         - name: Smoke release product binary
           if: matrix.platform == 'linux'
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "packages/coding-agent/binaries/${{ matrix.artifact }}" --version
         - name: Upload release product binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: zeta-binary-${{ matrix.target_id }}
              path: packages/coding-agent/binaries/${{ matrix.target_id }}*
              if-no-files-found: error

   # PAUSED (user ruling 2026-11-05: zetawork suspended, roadmap P0). This job
   # is dispatch-only now — a release never runs it and release_github no
   # longer waits on it, so the installer/AppImage/Arch archives are not
   # release assets. The definition stays for the manual revival path: it
   # packages the GUI + TUI + companions from `zeta-binary-*` artifacts, which
   # a dispatch has to stage itself (the release matrix no longer builds the
   # zetawork legs). See document/release.md.
   release_desktop_archives:
      name: Package zetawork desktop installer & archives (paused)
      # Needs the CLI leg too: the installer and both Linux packages carry
      # `zetacode` (zeta-binary-linux-x64 / zeta-binary-win32-x64) beside the
      # GUI, alongside zetaide (zeta-binary-zeta-ide-{linux,win}-x64) and the
      # TUI (zeta-binary-zeta-work-{linux,win}-x64).
      if: ${{ always() && !cancelled() &&
         inputs.build_desktop_archives &&
         needs.release_binary.result == 'success' &&
         needs.release_product_binaries.result == 'success' }}
      needs: [release_metadata, release_binary, release_product_binaries]
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: zeta-binary-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         # mksquashfs for appimagetool; docker is preinstalled on the runner and
         # the Arch package is built inside archlinux/base-devel. NSIS builds
         # the per-user Windows installer (`makensis`).
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
         - name: Install AppImage and NSIS tooling
           run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools zsync nsis
         # Every product artifact carries the browser UI: `zetacode serve`
         # hosts it from `<exe dir>/web-ui`, and the shipped binary is its Bun
         # runtime (`BUN_BE_BUN=1`), so no Node is needed on the user machine.
         - name: Build the Web UI (standalone)
           working-directory: web-ui
           env:
              NEXT_OUTPUT_STANDALONE: "1"
              NEXT_TELEMETRY_DISABLED: "1"
           run: |
              npm ci
              npm run build
         - name: Package the Windows portable product (full payload zip)
           run: |
              bun scripts/package-desktop-archives.ts windows \
                --version "${{ needs.release_metadata.outputs.release-tag }}" \
                --exe packages/coding-agent/binaries/zetawork-gui-win-x64.exe \
                --tui packages/coding-agent/binaries/zeta-work-win-x64.exe \
                --agent packages/coding-agent/binaries/zeta-cli-windows-x64.exe \
                --ide packages/coding-agent/binaries/zeta-ide-win-x64.exe \
                --dll packages/coding-agent/binaries/zetawork-gui-win-x64.dll \
                --webui web-ui \
                --out packages/coding-agent/binaries
         - name: Package the Windows installer (NSIS, with companions)
           run: |
              bun scripts/package-desktop-archives.ts windows-installer \
                --version "${{ needs.release_metadata.outputs.release-tag }}" \
                --gui packages/coding-agent/binaries/zetawork-gui-win-x64.exe \
                --tui packages/coding-agent/binaries/zeta-work-win-x64.exe \
                --agent packages/coding-agent/binaries/zeta-cli-windows-x64.exe \
                --ide packages/coding-agent/binaries/zeta-ide-win-x64.exe \
                --dll packages/coding-agent/binaries/zetawork-gui-win-x64.dll \
                --webui web-ui \
                --out packages/coding-agent/binaries
         - name: Package the Linux desktop app
           run: |
              bun scripts/package-desktop-archives.ts linux \
                --version "${{ needs.release_metadata.outputs.release-tag }}" \
                --gui packages/coding-agent/binaries/zetawork-gui-linux-x64 \
                --tui packages/coding-agent/binaries/zeta-work-linux-x64 \
                --agent packages/coding-agent/binaries/zeta-cli-linux-x64 \
                --ide packages/coding-agent/binaries/zeta-ide-linux-x64 \
                --webui web-ui \
                --out packages/coding-agent/binaries
         - name: Upload desktop installer & archives
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: zeta-binary-zetawork-archives
              path: |
                 packages/coding-agent/binaries/linxira-zeta-*-setup-x64.exe
                 packages/coding-agent/binaries/linxira-zeta-*-windows-x64.zip
                 packages/coding-agent/binaries/linxira-zeta-*.AppImage
                 packages/coding-agent/binaries/linxira-zeta-*.pkg.tar.zst
              if-no-files-found: error

   release_desktop:
      name: Package Work Studio desktop (Electron + browser editions)
      if: ${{ (needs.release_metadata.outputs.is-release == 'true' || inputs.desktop_app) && !cancelled() &&
         needs.release_binary.result == 'success' }}
      needs: [release_metadata, release_binary]
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: ubuntu-22.04
                 platform: linux
                 suffix: linux-x64
                 native_target: linux-x64-baseline
               - os: windows-latest
                 platform: win32
                 suffix: win32-x64
                 native_target: win32-x64-baseline
      runs-on: ${{ matrix.os }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
         - id: version
           name: Read the product version
           shell: bash
           run: |
              version=$(node -p "require('./desktop/package.json').version")
              echo "value=$version" >> "$GITHUB_OUTPUT"
         - run: bun install --frozen-lockfile
         - name: Install prebuilt native addons
           uses: ./.github/actions/native-artifacts
           with:
              targets: ${{ matrix.native_target }}
         - name: Download the release CLI binary
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: zeta-binary-${{ matrix.suffix }}
              path: temp/desktop/binary
         - name: Install desktop dependencies
           working-directory: desktop
           run: npm ci
         # The Electron edition embeds Chromium + the compiled kernel + the
         # Work Studio renderer. The shell reuses the release CLI artifact, so
         # this job never recompiles the Rust/Bun binary.
         - name: Package the Electron edition
           working-directory: desktop
           env:
              ZETA_SERVICE_BINARY: ${{ github.workspace }}/temp/desktop/binary/zeta-cli-${{ matrix.platform == 'win32' && 'windows-x64.exe' || 'linux-x64' }}
           run: npm run dist
         - name: Package the browser edition (no bundled engine)
           shell: bash
           run: |
              bun scripts/package-workstudio-browser.ts                 --version "${{ steps.version.outputs.value }}"                 --platform ${{ matrix.platform }}                 --runtime temp/desktop/staging/zeta                 --out temp/desktop/release
         - name: Upload desktop artifacts
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: zeta-desktop-${{ matrix.suffix }}
              path: |
                 temp/desktop/release/zeta-desktop-*.exe
                 temp/desktop/release/zeta-desktop-*.zip
                 temp/desktop/release/zeta-desktop-*.AppImage
                 temp/desktop/release/zeta-desktop-*.deb
                 temp/desktop/release/zeta-desktop-*.tar.gz
                 temp/desktop/release/linxira-zeta-*-workstudio-browser-*
              if-no-files-found: error

   # Desktop shells (Electron embedding the standalone web-ui + a compiled
   # zeta runtime). They run on every CI event like the test fan-out: PR-side
   # they prove the pipeline compiles and smokes; at release the artifacts
   # feed release_github as installer assets. Linux/Windows reuse the
   # native_addons artifact; macOS builds its own addon (no cross-hosted

   # Publishes the six @linxiraos/pi-natives-<tag> leaf packages once
   # validation passes and every binary built. Runs on one linux runner: leaf
   # publishing is platform-agnostic file packaging (gen-npm-packages reads
   # packages/natives/native), so no per-platform runners are needed.
   release_native_leaves:
      name: Publish native leaf packages
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_metadata.outputs.publish-allowed == 'true' &&
         needs.release_gate.result == 'success' &&
         needs.release_binary.result == 'success' &&
         !inputs.skip_npm }}
      needs: [release_metadata, release_gate, release_binary]
      runs-on: ubuntu-22.04
      # id-token is the only publish credential: npm tokens were removed
      # 2026-10-19 (trusted publishing only; a package needs a validated
      # trusted-publisher entry before this job can publish it).
      permissions:
         id-token: write
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         # npm runs under Bun when invoked by the release script; npm 12
         # requires a newer emulated Node version than Bun 1.3 provides.
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - run: bun install --frozen-lockfile
         # Main-only save: caches saved on a tag or branch are readable only by
         # that ref yet count against the shared 10 GB repo cache quota.
         - name: Save bun store
           if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         # Every shipped leaf's addon from the native_addons artifacts (gnu
         # targets only — musl reuses the linux filenames and has no leaf
         # package). The composite action fetches `natives-linux-x64` for the
         # linux pair and `native-addons` for win32-x64-baseline; installing the
         # targets here is the only download — a second raw
         # `download-artifact pattern: native-addons-*` step matched nothing
         # (the artifact is named `native-addons`, no suffix) and was dead.
         - name: Install native addons for the shipped leaves
           uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern win32-x64-baseline
         - name: Publish native leaf packages
           env:
              # A retried publish must not reuse the exact tarball bytes: npm's
              # transparency log rejects a second entry for the same tarball
              # (TLOG_CREATE_ENTRY_ERROR 409), while the registry never received
              # the first. The run/attempt pair makes every attempt distinct.
              ZETA_PUBLISH_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
           run: |
              set -euo pipefail
              # The shipped set (SHIPPED_LEAF_TAGS in
              # packages/natives/scripts/gen-npm-packages.ts): a leaf the core
              # manifest does not pin must not be published, or npm holds an
              # orphan that no install resolves.
              for tag in linux-x64 win32-x64; do
                bun run ci:release:publish-native-leaf "$tag"
              done

   release_github:
      name: Publish GitHub release
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_metadata.outputs.assets-allowed == 'true' &&
         needs.release_gate.result == 'success' &&
         needs.release_binary.result == 'success' &&
         needs.release_product_binaries.result == 'success' }}
      # zetawork is paused (2026-11-05 ruling): this job now uploads only what
      # the release builds — CLI binaries, zetaide, the relay extension, the
      # example-plugin zip and the root texts. The TUI and the desktop archives
      # left the release surface with it, so release_desktop_archives is no
      # longer a dependency (that job is dispatch-only).
      needs: [release_metadata, release_gate, release_binary, release_product_binaries, release_desktop]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - name: Generate release notes from CHANGELOGs
           env:
              # `gh release list` (used to find the latest published GitHub
              # Release tag below the target so silent-tag changelog sections
              # roll forward — #2596) requires GH_TOKEN in Actions. Without
              # it gh exits non-zero and the script would degrade to legacy
              # single-version notes, defeating the recovery.
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              ZETA_RELEASE_OVERRIDE_VERSION: ${{ inputs.release_override_version || vars.RELEASE_FREEZE_OVERRIDE_VERSION }}
              ZETA_RELEASE_OVERRIDE_REASON: ${{ inputs.release_override_reason || vars.RELEASE_FREEZE_OVERRIDE_REASON }}
              ZETA_RELEASE_SCOPE_PUBLIC: ${{ needs.release_metadata.outputs.assets-allowed }}
           run: bun scripts/ci-release-notes.ts ${{ needs.release_metadata.outputs.release-tag }}
         - name: Verify release notes cite the release scope
           env:
              ZETA_RELEASE_OVERRIDE_VERSION: ${{ inputs.release_override_version || vars.RELEASE_FREEZE_OVERRIDE_VERSION }}
              ZETA_RELEASE_OVERRIDE_REASON: ${{ inputs.release_override_reason || vars.RELEASE_FREEZE_OVERRIDE_REASON }}
              ZETA_RELEASE_SCOPE_PUBLIC: ${{ needs.release_metadata.outputs.assets-allowed }}
           run: >
              bun scripts/release-scope.ts check
              --version "${{ needs.release_metadata.outputs.release-version }}"
              --notes release-notes.md
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: zeta-binary-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         - name: Download desktop artifacts
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: zeta-desktop-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         # Dependency-free build (bun APIs + zip only), so no `bun install`
         # is needed on this runner.
         - name: Build browser relay artifacts
           run: bun run --cwd packages/browser-relay build
         # The example plugin ships as a *runnable environment*, not a source
         # tarball: the script stages the directory, `git init`s it with one
         # pinned-commit, and zips it. Bun APIs only (no install needed), same
         # as the relay build above.
         - name: Build example plugin zip
           run: bun scripts/build-example-plugin-zip.ts
         # Preflight: every release asset must exist before checksums hash it.
         # A stale asset-name reference (e.g. the v1.1.9 run where ci.yml still
         # pointed at omp-browser-relay-extension.zip after the build script
         # renamed it) fails here with a clear list instead of mid-checksums.
         - name: Preflight release assets
           run: |
              missing=0
              for asset in \
                packages/browser-relay/dist/zeta-browser-relay-extension.zip \
                LICENSE \
                THIRD-PARTY-NOTICES.txt; do
                if [ ! -f "$asset" ]; then
                  echo "::error::Missing release asset: $asset"
                  missing=1
                fi
              done
              count=$(ls packages/coding-agent/binaries/zeta-cli-* 2>/dev/null | wc -l)
              if [ "$count" -lt 3 ]; then
                # Release matrix is trimmed to linux-x64, linux-musl-x64 and
                # win32-x64 while macOS/ARM desktop publishing is paused.
                echo "::error::Expected at least 3 zeta-cli-* binaries, found $count"
                missing=1
              fi
              product_count=$(ls packages/coding-agent/binaries/zeta-ide-* 2>/dev/null | wc -l)
              if [ "$product_count" -lt 2 ]; then
                # Product matrix: zetaide linux+win only (release_product_binaries).
                echo "::error::Expected at least 2 zeta-ide-* product binaries, found $product_count"
                missing=1
              fi
              desktop_count=$(ls packages/coding-agent/binaries/zeta-desktop-* 2>/dev/null | wc -l)
              if [ "$desktop_count" -lt 4 ]; then
                echo "::error::Expected the Electron desktop installers/archives, found $desktop_count"
                missing=1
              fi
              lite_count=$(ls packages/coding-agent/binaries/linxira-zeta-*-workstudio-browser-* 2>/dev/null | wc -l)
              if [ "$lite_count" -lt 2 ]; then
                echo "::error::Expected the browser-edition archives (win + linux), found $lite_count"
                missing=1
              fi
              plugin_zips=$(ls plugins/dist/zeta-plugin-example-*.zip 2>/dev/null | wc -l)
              if [ "$plugin_zips" -lt 1 ]; then
                # The example-plugin environment (zeta-plugin-example-<version>.zip)
                # is the distributable teaching asset; a rename in
                # scripts/build-example-plugin-zip.ts must fail here, not after
                # checksums have hashed it.
                echo "::error::Expected at least 1 plugins/dist/zeta-plugin-example-*.zip, found $plugin_zips"
                missing=1
              fi
              exit $missing
         # Generated after every other release asset is in place and before
         # the release is created, so SHA256SUMS.txt itself ships as an asset
         # and covers every other file uploaded alongside it.
         - name: Generate checksums
           run: |
              bun run ci:release:checksums SHA256SUMS.txt \
                packages/coding-agent/binaries/zeta-cli-* \
                packages/coding-agent/binaries/zeta-ide-* \
                packages/coding-agent/binaries/zeta-desktop-* \
                packages/coding-agent/binaries/linxira-zeta-*-workstudio-browser-* \
                packages/browser-relay/dist/zeta-browser-relay-extension.zip \
                plugins/dist/zeta-plugin-example-*.zip \
                packaging/package-linkage.json \
                LICENSE \
                THIRD-PARTY-NOTICES.txt
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
              tag_name: ${{ needs.release_metadata.outputs.release-tag }}
              prerelease: ${{ needs.release_metadata.outputs.channel == 'canary' }}
              files: |
                 packages/coding-agent/binaries/zeta-cli-*
                 packages/coding-agent/binaries/zeta-ide-*
                 packages/coding-agent/binaries/zeta-desktop-*
                 packages/coding-agent/binaries/linxira-zeta-*-workstudio-browser-*
                 packages/browser-relay/dist/zeta-browser-relay-extension.zip
                 plugins/dist/zeta-plugin-example-*.zip
                 packaging/package-linkage.json
                 LICENSE
                 THIRD-PARTY-NOTICES.txt
                 SHA256SUMS.txt
              body_path: release-notes.md
              generate_release_notes: true

   # Proves the Linux upgrade path with the real published packages. Both
   # pacman transactions run in disposable roots
   # (scripts/packaging/verify-linux-upgrade.sh): zwork-era linxira-zeta ->
   # current linxira-zeta in place, and the retired linxira-zetawork replaced
   # through the published Replaces/Conflicts. ~/.zeta is seeded and compared
   # byte-for-byte, and the bundled kernel must report the upgraded version.
   #
   # The [linxira-zeta] rebuild is asynchronous in Linxira-OS/packages, so this
   # job runs after the release is published and is advisory: a lagging package
   # repository must not fail a release, but a broken upgrade must be visible.
   verify_linux_upgrade:
      name: Verify Linux upgrade (zwork -> Zeta)
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github.result == 'success' }}
      needs: [release_metadata, release_github]
      runs-on: ubuntu-22.04
      continue-on-error: true
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - name: Install libarchive tools
           run: sudo apt-get update && sudo apt-get install -y libarchive-tools
         - name: Download the zwork-era package and the current repository package
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              set -euo pipefail
              mkdir -p temp/upgrade
              gh release download v1.4.10 --repo Linxira-OS/linxira-zeta \
                --pattern 'linxira-zeta-1.4.10-1-x86_64.pkg.tar.zst' --dir temp/upgrade --clobber
              gh release download zeta-repo --repo Linxira-OS/packages \
                --pattern 'linxira-zeta.db.tar.zst' --dir temp/upgrade --clobber
              gh release download zeta-repo --repo Linxira-OS/packages \
                --pattern 'linxira-zeta-*.pkg.tar.zst' --dir temp/upgrade --clobber
              old=$(ls temp/upgrade/linxira-zeta-1.4.10-*.pkg.tar.zst)
              # The desktop package is the only linxira-zeta-<version>-<rel>-x86_64
              # asset; c-bin/ide sort differently and are excluded by the regex.
              new=$(ls temp/upgrade/linxira-zeta-*.pkg.tar.zst |
                grep -E '/linxira-zeta-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-x86_64\.pkg\.tar\.zst$' |
                grep -v '/linxira-zeta-1\.4\.10-' | sort -V | tail -n1)
              old_ver=$(bsdtar -xOf "$old" .PKGINFO | sed -n 's/^pkgver = //p')
              new_ver=$(bsdtar -xOf "$new" .PKGINFO | sed -n 's/^pkgver = //p')
              # The manifest version must describe what the signed index says it does.
              db_sha=$(bsdtar -xOf temp/upgrade/linxira-zeta.db.tar.zst | awk '
                /^%NAME%$/ { getline; name = $0; next }
                /^%SHA256SUM%$/ { getline; if (name == "linxira-zeta") { print; exit } }')
              actual_sha=$(sha256sum "$new" | awk '{print $1}')
              if [ "$db_sha" != "$actual_sha" ]; then
                echo "::error::package sha256 $actual_sha does not match the signed index $db_sha"
                exit 1
              fi
              release_ver="${{ needs.release_metadata.outputs.release-tag }}"
              release_ver=${release_ver#v}
              echo "old=$old_ver new=$new_ver release=$release_ver"
              if [ "${new_ver%-*}" != "$release_ver" ]; then
                echo "::warning::[linxira-zeta] serves $new_ver while the release tag is $release_ver; the packages workflow has not rebuilt yet"
              fi
              {
                echo "OLD_PKG=$old"
                echo "NEW_PKG=$new"
                echo "OLD_VER=$old_ver"
                echo "NEW_VER=$new_ver"
              } >> "$GITHUB_ENV"
         - name: Upgrade in disposable pacman roots
           run: |
              docker run --rm -v "$PWD:/workspace" -w /workspace \
                -e OLD_PKG -e NEW_PKG -e OLD_VER -e NEW_VER \
                archlinux:base bash -euxo pipefail -c '
                  bash scripts/packaging/verify-linux-upgrade.sh \
                    --old "$OLD_PKG" --new "$NEW_PKG" \
                    --expect-old "$OLD_VER" --expect-new "$NEW_VER"
                '

   release_npm:
      name: Publish to npm
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_metadata.outputs.publish-allowed == 'true' &&
         needs.release_binary.result == 'success' &&
         needs.release_native_leaves.result == 'success' &&
         !inputs.skip_npm }}
      # release_native_leaves must finish first: the core package lists the
      # leaf packages as lockstep-versioned optionalDependencies, so installs
      # resolve them the moment the core version is live.
      needs: [release_metadata, release_binary, release_native_leaves]
      runs-on: ubuntu-22.04
      # `id-token: write` lets npm mint the GitHub OIDC token it exchanges for a
      # short-lived publish token (trusted publishing + provenance). There is no
      # token fallback any more (2026-10-19 rule): an unconfigured package fails
      # the publish, and a new package is bootstrapped by publishing it by hand
      # once, then adding the trusted-publisher entry in the npm UI.
      permissions:
         id-token: write
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         # npm runs under Bun when invoked by the release script; npm 12
         # requires a newer emulated Node version than Bun 1.3 provides.
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Restore bun store
           id: bun-cache
           uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                 bun-${{ runner.os }}-
         - run: bun install --frozen-lockfile
         # Main-only save: caches saved on a tag or branch are readable only by
         # that ref yet count against the shared 10 GB repo cache quota.
         - name: Save bun store
           if: github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
           uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         # The prepack executes workspace code which loads the Linux x64
         # addon, so install the native_addons job's artifact before publishing.
         - name: Install prebuilt native addons
           uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Publish to npm
           env:
              # bundle-dist embeds this commit and fails when the built artifact
              # reports a different one — a stale local dist can never be
              # published as this tag (REQ-036).
              ZETA_EXPECTED_COMMIT: ${{ github.sha }}
           run: bun run ci:release:publish

   # Vendored TermIDE (zetaide) upstream test contract, mirroring what the
   # upstream project gates on every PR: fmt / cargo check --all-targets /
   # clippy -D warnings / nextest, with the toolchain pinned by
   # termide/rust-toolchain.toml (read at run time). A full Rust rebuild of the vendored
   # workspace is expensive, so the job self-skips when the triggering change
   # set does not touch termide/ — a manual dispatch always runs the full
   # gate. Same policy: gates the vendor tree, not the Zeta release
   # (release_gate does not depend on it).

   termide_tests:
      name: Test termide (vendored TermIDE)
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - name: Detect termide/ changes
           id: termide
           env:
              BEFORE: ${{ github.event.before }}
              PR_BASE: ${{ github.event.pull_request.base.sha }}
              DISPATCH_BASE: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.full != true && 'main' || '' }}
           run: |
              set -euo pipefail
              base=""
              if [ -n "$PR_BASE" ]; then
                 base="$PR_BASE"
              elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                 base="$BEFORE"
              elif [ -n "$DISPATCH_BASE" ]; then
                 base="refs/remotes/origin/main"
                 git fetch --no-tags --depth=1 origin "+main:$base" || true
              fi
              if [ -z "$base" ]; then
                 echo "No base revision (manual dispatch) - running the full gate"
                 echo "skip=false" >> "$GITHUB_OUTPUT"
                 exit 0
              fi
              # Depth-1 fetch of the base tip; the two-dot diff below then
              # needs no merge-base from the shallow history.
              if [ "$base" != "refs/remotes/origin/main" ]; then
                 git fetch --no-tags --depth=1 origin "$base" || true
              fi
              if git diff --name-only "$base" HEAD -- termide/ | grep -q .; then
                 echo "skip=false" >> "$GITHUB_OUTPUT"
              else
                 echo "termide/ untouched - skipping the vendored Rust gate"
                 echo "skip=true" >> "$GITHUB_OUTPUT"
              fi
         # Action refs mirror the upstream termide CI pins (tag per toolchain
         # release on dtolnay/rust-toolchain; major-version branch on
         # taiki-e/install-action and Swatinem/rust-cache).
         - name: Resolve Rust toolchain pin
           id: rust-pin
           run: |
              echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' termide/rust-toolchain.toml | head -1)" >> "$GITHUB_OUTPUT"
         - uses: dtolnay/rust-toolchain@master
           if: steps.termide.outputs.skip != 'true'
           with:
              toolchain: ${{ steps.rust-pin.outputs.channel }}
              components: rustfmt, clippy
         - uses: Swatinem/rust-cache@v2
           if: steps.termide.outputs.skip != 'true'
           with:
              workspaces: termide
         - name: Check formatting
           if: steps.termide.outputs.skip != 'true'
           working-directory: termide
           run: cargo fmt --all -- --check
         - name: Check compilation
           if: steps.termide.outputs.skip != 'true'
           working-directory: termide
           run: cargo check --workspace --all-targets
         - name: Run clippy (strict mode)
           if: steps.termide.outputs.skip != 'true'
           working-directory: termide
           run: cargo clippy --workspace --all-targets -- -D warnings
         - name: Install cargo-nextest
           if: steps.termide.outputs.skip != 'true'
           uses: taiki-e/install-action@v2
           with:
              tool: cargo-nextest
         - name: Run tests
           if: steps.termide.outputs.skip != 'true'
           working-directory: termide
           run: cargo nextest run --workspace

   # The zeta workspace (main/) Rust gate — fmt / check / clippy / nextest,
   # mirroring termide_tests. Self-skips when main/ is untouched; a manual
   # dispatch always runs the full gate. Gates the workspace tree, not the
   # Zeta release (release_gate does not depend on it). The workbench's npm
   # distribution is not published from 1.3.0 (user ruling 2026-10-19); its
   # main-publish.yml stays for manual republishes of already-released lines.

   main_tests:
      name: Test main workspace (zeta workbench)
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - name: Detect main/ changes
           id: main
           env:
              BEFORE: ${{ github.event.before }}
              PR_BASE: ${{ github.event.pull_request.base.sha }}
              DISPATCH_BASE: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.full != true && 'main' || '' }}
           run: |
              set -euo pipefail
              base=""
              if [ -n "$PR_BASE" ]; then
                 base="$PR_BASE"
              elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
                 base="$BEFORE"
              elif [ -n "$DISPATCH_BASE" ]; then
                 base="refs/remotes/origin/main"
                 git fetch --no-tags --depth=1 origin "+main:$base" || true
              fi
              if [ -z "$base" ]; then
                 echo "No base revision (manual dispatch) - running the full gate"
                 echo "skip=false" >> "$GITHUB_OUTPUT"
                 exit 0
              fi
              if [ "$base" != "refs/remotes/origin/main" ]; then
                 git fetch --no-tags --depth=1 origin "$base" || true
              fi
              # termide/ is in the pathspec because main/ path-links five
              # termide crates (core, config, keyboard, panel-terminal,
              # theme): a pure vendor change can break this workspace while
              # termide_tests stays the only job that ran.
              if git diff --name-only "$base" HEAD -- main/ termide/ | grep -q .; then
                 echo "skip=false" >> "$GITHUB_OUTPUT"
              else
                 echo "main/ and termide/ untouched - skipping the workspace Rust gate"
                 echo "skip=true" >> "$GITHUB_OUTPUT"
              fi
         - name: Resolve Rust toolchain pin
           id: rust-pin
           run: |
              echo "channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' main/rust-toolchain.toml | head -1)" >> "$GITHUB_OUTPUT"
         - uses: dtolnay/rust-toolchain@master
           if: steps.main.outputs.skip != 'true'
           with:
              toolchain: ${{ steps.rust-pin.outputs.channel }}
              components: rustfmt, clippy
         - uses: Swatinem/rust-cache@v2
           if: steps.main.outputs.skip != 'true'
           with:
              workspaces: main
         - name: Check formatting
           if: steps.main.outputs.skip != 'true'
           working-directory: main
           run: cargo fmt --all -- --check
         - name: Check compilation
           if: steps.main.outputs.skip != 'true'
           working-directory: main
           run: cargo check --workspace --all-targets
         - name: Run clippy (strict mode)
           if: steps.main.outputs.skip != 'true'
           working-directory: main
           run: cargo clippy --workspace --all-targets -- -D warnings
         - name: Check the desktop shell with its release features
           if: steps.main.outputs.skip != 'true'
           working-directory: main
           # `tray` and `os-notify` are release-only features: the release job
           # turns them on for every platform. Without this step their code —
           # the Linux KSNI tray included — would only ever be compiled at tag
           # time, so a break there would surface after the version bump.
           run: cargo check -p zetawork-gui --all-targets --features tray,os-notify
         - name: Run tests
           if: steps.main.outputs.skip != 'true'
           working-directory: main
           run: cargo test --workspace
         - name: Run zetawork tests with release features
           if: steps.main.outputs.skip != 'true'
           working-directory: main
           # `cargo test --workspace` builds the default feature set, so the
           # tray queue/wakeup tests were never compiled. This step runs the
           # same tests with the features the release binary ships.
           run: cargo test -p zetawork-gui --features tray,os-notify

   # Publishes the built-in editor's npm distribution (@linxiraos/editor plus
   # its windows/linux x64 platform leaves) on release tags via npm trusted
   # publishing, dispatching the dedicated editor-publish.yml so the OIDC
   # claim matches the workflow binding (same lesson as v1.1.19's editor
   # E404). The payload binaries are built and committed in termide/ before
   # the tag (termide/VENDOR.md's rebuild recipe) — this job publishes what
   # the leaves carry. Does not gate the GitHub release itself (same policy as
   # the other package legs).

   release_editor_packages:
      name: Publish editor npm packages
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_metadata.outputs.publish-allowed == 'true' &&
         needs.release_gate.result == 'success' &&
         !inputs.skip_npm }}
      # npm Trusted Publisher binds the workflow file that EXECUTES the
      # publish. A `uses:` call keeps editor-publish.yml as the callee, but
      # the OIDC claim still names the caller (ci.yml) — v1.1.19's E404. So
      # dispatch the dedicated workflow instead and wait for it: the publish
      # truly runs inside editor-publish.yml, matching the binding, and the
      # same file keeps serving manual republishes via `gh workflow run`.
      needs: [release_metadata, release_gate]
      runs-on: ubuntu-22.04
      permissions:
         contents: read
         actions: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Dispatch editor-publish.yml and wait for it
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # Forward the owner-approved override to the dispatched workflow:
              # a dispatch input does not cross a `gh workflow run` boundary, and
              # the callee re-evaluates the freeze policy itself (ADR 0006).
              RELEASE_OVERRIDE_VERSION: ${{ inputs.release_override_version || vars.RELEASE_FREEZE_OVERRIDE_VERSION }}
              RELEASE_OVERRIDE_REASON: ${{ inputs.release_override_reason || vars.RELEASE_FREEZE_OVERRIDE_REASON }}
           run: |
              set -euo pipefail
              gh workflow run editor-publish.yml --ref "${GITHUB_REF_NAME}" \
                -f override_version="$RELEASE_OVERRIDE_VERSION" \
                -f override_reason="$RELEASE_OVERRIDE_REASON"
              rid=""
              for _ in $(seq 1 30); do
                 sleep 10
                 rid=$(gh run list --workflow=editor-publish.yml --branch "${GITHUB_REF_NAME}" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
                 [ -n "$rid" ] && break
              done
              if [ -z "$rid" ]; then
                 echo "::error::editor-publish run never appeared"
                 exit 1
              fi
              gh run watch "$rid" --exit-status --interval 15

   # Publishes the zeta workbench npm distribution (@linxiraos/main plus its
   # windows/linux x64 platform leaves) on release tags via npm trusted
   # publishing, dispatching main-publish.yml so the OIDC claim matches the
   # workflow binding (same lesson as v1.1.19's editor E404).
   #
   # The launcher pins zetacode (@linxiraos/zeta) and zetaide
   # (@linxiraos/ide) as its same-line companions, so it must publish LAST:
   # npm install of the workbench resolves those pins, and a launcher that
   # lands before its companions exists only as an install with two missing
   # commands (optionalDependencies skip silently). Hence the needs below —
   # scripts/check-workbench-bundles.ts holds this edge.

   # Publishes the vendored termide (zetaide) npm distribution
   # (@linxiraos/ide plus its windows/linux x64 platform leaves) on release
   # tags via npm trusted publishing, dispatching the dedicated
   # ide-publish.yml so the OIDC claim matches the workflow binding (same
   # lesson as v1.1.19's editor E404). Does not gate the GitHub release
   # itself (same policy as the other package legs). 1.3.0 ships zetaide, so
   # this leg stays in the release chain.

   release_ide_packages:
      name: Publish ide npm packages
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_metadata.outputs.publish-allowed == 'true' &&
         needs.release_gate.result == 'success' &&
         !inputs.skip_npm }}
      needs: [release_metadata, release_gate]
      runs-on: ubuntu-22.04
      permissions:
         contents: read
         actions: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Dispatch ide-publish.yml and wait for it
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # Forward the owner-approved override to the dispatched workflow:
              # a dispatch input does not cross a `gh workflow run` boundary, and
              # the callee re-evaluates the freeze policy itself (ADR 0006).
              RELEASE_OVERRIDE_VERSION: ${{ inputs.release_override_version || vars.RELEASE_FREEZE_OVERRIDE_VERSION }}
              RELEASE_OVERRIDE_REASON: ${{ inputs.release_override_reason || vars.RELEASE_FREEZE_OVERRIDE_REASON }}
           run: |
              set -euo pipefail
              gh workflow run ide-publish.yml --ref "${GITHUB_REF_NAME}" \
                -f override_version="$RELEASE_OVERRIDE_VERSION" \
                -f override_reason="$RELEASE_OVERRIDE_REASON"
              rid=""
              for _ in $(seq 1 30); do
                 sleep 10
                 rid=$(gh run list --workflow=ide-publish.yml --branch "${GITHUB_REF_NAME}" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
                 [ -n "$rid" ] && break
              done
              if [ -z "$rid" ]; then
                 echo "::error::ide-publish run never appeared"
                 exit 1
              fi
              gh run watch "$rid" --exit-status --interval 15

   # Publishes the standalone web-ui package (@linxiraos/zeta-web) on release
   # tags via npm trusted publishing. The publish leg lives INSIDE ci.yml rather
   # than in a dedicated workflow file: npm binds a trusted publisher to the
   # workflow FILE that executes the publish, and web-ui must never carry its
   # own workflow — GitHub only executes root workflows (document/release.md),
   # so ci.yml is the binding the npm-side entry for `@linxiraos/zeta-web` has
   # to name (damage class 12).
   #
   # web-ui is deliberately NOT a root Bun workspace member (AGENTS.md: a
   # standalone OMP Web snapshot with its own package manager), so this job
   # brings its own `npm ci` + `next build` before packing: the manifest's
   # `files` list ships `.next`, and a bare `npm publish` from a fresh checkout
   # would publish a missing or stale build against a new gateway.
   #
   # needs: [release_metadata, release_gate] mirrors the vendored
   # main/ide publish jobs — release_metadata supplies is-release (this
   # job must not run on ordinary pushes) and release_gate carries the
   # release-state prerequisite: `check`'s guard steps run on a release run, and
   # publishing before they pass must be impossible. There is no build-artifact
   # dependency to wait on: everything in the tarball is produced inside this
   # job from the tagged tree, so nothing can race an upload (unlike
   # release_npm, whose prepack loads the native_addons artifact). web-ui's own
   # verification legs (`web_ui_build`, retired 2026-11-05 with the frozen tree: type check / lint / colour guard / unit
   # tests / build) gate the PUSH run of the release source commit, not this
   # job — publishing never depends on a sibling test job (damage class 12), and
   # release-v2.ts refuses to tag until that push run is green.
   #
   # Re-run safe: `ci-release-publish.ts --web-ui` packs through the shared
   # publish path, which preflights `npm view <name>@<version>` and skips a
   # version already on the registry (and treats npm's E409 /
   # "previously published versions" output as already published).
   release_web_ui_packages:
      name: Publish web-ui npm package
      # web-ui is frozen (the renderer moved to web-app, 2026-11-05): the
      # package keeps its published versions but only republishes when the
      # `publish_web_ui` dispatch input asks for it.
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_metadata.outputs.publish-allowed == 'true' &&
         needs.release_gate.result == 'success' &&
         inputs.publish_web_ui &&
         !inputs.skip_npm }}
      needs: [release_metadata, release_gate]
      runs-on: ubuntu-22.04
      # id-token is the only publish credential (trusted publishing); the npm
      # trusted publisher for @linxiraos/zeta-web must name this workflow file
      # and this job's publish step.
      permissions:
         id-token: write
         contents: read
      defaults:
         run:
            working-directory: web-ui
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
              cache: npm
              cache-dependency-path: web-ui/package-lock.json
         # npm 12 requires a newer emulated Node than Bun provides when the
         # release script shells out; the OIDC floor is 11.5.1 (this pin matches
         # the sibling publish legs).
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Install web-ui dependencies
           run: npm ci
         # The manifest's `files` list ships `.next`; publishing a fresh
         # checkout without this build would upload a missing or stale Web UI
         # against the release's gateway.
         - name: Build web-ui
           run: npm run build
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Publish @linxiraos/zeta-web
           working-directory: .
           run: bun run ci:release:publish-web-ui

   # Publishes the official plugins (`@linxiraos/pi-messenger`) on release tags
   # via npm trusted publishing. Unlike web-ui there is no build to run: an
   # official plugin ships TS source (`index.ts` entry, `crew/**`, `skills/**`,
   # `bin` → `install.mjs`) for the host loader to transpile, so
   # `ci-release-publish.ts --plugin` packs the directory as-authored through
   # the same as-is path the vendored main/ide/web-ui legs use. The
   # workspace `packages` table (release_npm) cannot carry it: that path's
   # `typescript` kind runs a declaration emit whose output the plugin cannot
   # consume — its sources use `allowImportingTsExtensions`, so the emitted
   # `.d.ts` keep `.ts` specifiers no consumer can resolve — and it rewrites
   # `main`/`exports`/`types`, which the plugin's `pi.extensions` and `bin` do
   # not point at. Shipping source as-authored is the plugin's documented
   # publish contract (document/plugin-system.md).
   #
   # The leg lives INSIDE ci.yml rather than in a dedicated workflow file: npm
   # binds a trusted publisher to the workflow FILE that executes the publish,
   # so the npm-side entry for `@linxiraos/pi-messenger` must name
   # `.github/workflows/ci.yml` (document/release.md) — a first publish with no
   # matching trusted publisher fails `PUT 404` (the v1.1.9 native-leaf lesson).
   #
   # needs: [release_metadata, release_gate] mirrors the other publish legs —
   # release_metadata supplies
   # is-release (this job must not run on ordinary pushes) and release_gate
   # carries the release-state prerequisite: `check`'s guard steps run on a
   # release run, and publishing before they pass must be impossible. No
   # build-artifact edge is needed: everything in the tarball is produced inside
   # this job from the tagged tree, so nothing can race an upload. A failure
   # here reddens the tag run; like the sibling package legs it does not gate
   # release_github's asset assembly.
   #
   # Re-run safe: the shared publish path preflights
   # `npm view @linxiraos/pi-messenger@<version>` and skips a version already on
   # the registry (and treats npm's E409 / "previously published versions"
   # output as already published).
   # 1.3.1 restores the workbench npm line (user ruling 2026-10-18: the GUI
   # stays out of npm, the TUI does not). The leaves carry committed binaries,
   # so main-publish.yml packs the tree as committed — it never rebuilds.
   # zetawork is suspended (2026-11-05, roadmap P0): the workbench packages stay
   # published-but-frozen, and a release only dispatches this leg when
   # `publish_zetawork` is set. `main-publish.yml` itself is untouched, so a
   # manual `gh workflow run main-publish.yml` still works.
   release_main_packages:
      name: Publish zetawork npm packages
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_metadata.outputs.publish-allowed == 'true' &&
         needs.release_gate.result == 'success' &&
         needs.release_npm.result == 'success' &&
         needs.release_ide_packages.result == 'success' &&
         inputs.publish_zetawork &&
         !inputs.skip_npm }}
      needs: [release_metadata, release_gate, release_npm, release_ide_packages]
      runs-on: ubuntu-22.04
      permissions:
         contents: read
         actions: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - name: Dispatch main-publish.yml and wait for it
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # Forward the owner-approved override to the dispatched workflow:
              # a dispatch input does not cross a `gh workflow run` boundary, and
              # the callee re-evaluates the freeze policy itself (ADR 0006).
              RELEASE_OVERRIDE_VERSION: ${{ inputs.release_override_version || vars.RELEASE_FREEZE_OVERRIDE_VERSION }}
              RELEASE_OVERRIDE_REASON: ${{ inputs.release_override_reason || vars.RELEASE_FREEZE_OVERRIDE_REASON }}
           run: |
              set -euo pipefail
              gh workflow run main-publish.yml --ref "${GITHUB_REF_NAME}" \
                -f override_version="$RELEASE_OVERRIDE_VERSION" \
                -f override_reason="$RELEASE_OVERRIDE_REASON"
              rid=""
              for _ in $(seq 1 30); do
                 sleep 10
                 rid=$(gh run list --workflow=main-publish.yml --branch "${GITHUB_REF_NAME}" --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
                 [ -n "$rid" ] && break
              done
              if [ -z "$rid" ]; then
                 echo "::error::main-publish run never appeared"
                 exit 1
              fi
              gh run watch "$rid" --exit-status --interval 15

   # The same publish, without the release gate. npm's trusted-publisher entry
   # is validated by a single successful publish and its window is days wide, so
   # a retry must not queue behind bazel/native builds. Mutually exclusive with
   # release_plugin_packages (which requires is-release and the gate).
   release_plugin_packages_manual:
      name: Publish official plugin npm packages (manual)
      if: ${{ !cancelled() && !inputs.skip_npm && inputs.publish_plugins &&
         needs.release_metadata.outputs.publish-allowed == 'true' }}
      needs: [release_metadata]
      runs-on: ubuntu-22.04
      permissions:
         id-token: write
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Publish official plugin packages
           run: bun run ci:release:publish-plugin

   release_plugin_packages:
      name: Publish official plugin npm packages
      # `publish_plugins` is the single-package escape hatch: npm validates a
      # newly added trusted-publisher entry only when that package is actually
      # published through it, and the window is short (v1.3.0: to 2026-10-21
      # 03:11 UTC). A dispatch with this input runs nothing but this job, so an
      # already-released version line can complete a package that the release
      # run lost — without re-cutting the tag.
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_metadata.outputs.publish-allowed == 'true' &&
         needs.release_gate.result == 'success' &&
         !inputs.skip_npm && !inputs.publish_plugins }}
      needs: [release_metadata, release_gate]
      runs-on: ubuntu-22.04
      # Trusted publishing only (2026-10-19 rule): npm tokens are gone, every
      # publish authenticates through the GitHub OIDC id-token. The npm
      # trusted-publisher entry is a two-step handshake — adding it in the UI
      # leaves it "Pending validation" and it must be exercised by one
      # successful publish inside the window npm shows (otherwise it flips to
      # "Expired"; that is what produced v1.3.0's `PUT 404`).
      permissions:
         id-token: write
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         # Same trusted-publishing floor as the sibling publish jobs: the npm
         # CLI that performs the publish must speak OIDC (>= 11.5.1).
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         # No `bun install --frozen-lockfile` here (unlike release_npm): the
         # as-is path only stages the legal payloads, reads the manifest and runs
         # `bun pm pack` inside the plugin directory, and
         # ci-release-publish.ts's own imports are node builtins. Nothing in the
         # plugin resolves at pack time — it publishes the source it ships.
         - name: Publish official plugin packages
           run: bun run ci:release:publish-plugin

   # Source-only manual gate. The owner paused Android Tier 1, so this job is
   # dispatch-only with `android_build` defaulting false: it can never run on a
   # push, PR, tag or ordinary dispatch, and it refuses (rather than faking) a
   # build while no android/ project exists. No APK/AAB is produced in this
   # train (REQ-018/REQ-049).
   android_tier1_build_manual:
      name: Android Tier 1 build (manual, paused)
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.android_build == true }}
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - name: Refuse while the Android project is not shipped
           run: |
              if [ ! -d android ]; then
                echo "::error::Android Tier 1 is paused (owner ruling; REQ-018). No android/ project exists; nothing is built."
                exit 1
              fi
              echo "android/ exists; wire the owner-approved build entrypoint here when the pause is lifted."

   notify-packages:
      name: Notify packages
      # Only a successful tag release may dispatch packages. Ordinary CI
      # pushes skip release_github, so this job is skipped as well.
      needs: [release_github, release_metadata]
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && needs.release_github.result == 'success' }}
      uses: Linxira-OS/packages/.github/workflows/notify-sync.yml@main
      secrets: inherit
