name: Publish main packages
# Standalone dispatchable entry for the zeta workspace npm distribution
# (@linxiraos/main + platform leaves). Mirrors ide-publish.yml / editor-publish.yml:
# exists so a publish can be run or re-run without re-tagging
# (`gh workflow run main-publish.yml`). NOT wired into the release pipeline yet —
# the first @linxiraos/main publish is manual (bootstrap), and npm trusted
# publishing for these names is configured only afterwards; once trust is in
# place, ci.yml gains a release_main_packages job dispatching this workflow.

on:
   workflow_dispatch:
   workflow_call:

concurrency:
   group: main-publish-${{ github.ref }}
   cancel-in-progress: false

permissions:
   id-token: write
   contents: read

jobs:
   publish:
      name: Publish main npm packages
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Publish main packages
           env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
           run: bun scripts/ci-release-publish.ts --main
