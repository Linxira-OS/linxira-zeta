name: Publish main packages
# Standalone dispatchable entry for the zeta workspace npm distribution
# (@linxiraos/main + platform leaves). Mirrors ide-publish.yml / editor-publish.yml:
# exists so a publish can be run or re-run without re-tagging
# (`gh workflow run main-publish.yml`). Wired into the release pipeline via the
# release_main_packages job in ci.yml (2026-09-30): the 1.1.21 bootstrap was
# published manually, then npm trusted publishing was configured for these
# names; the release chain dispatches this workflow on release tags from then on.

on:
   workflow_dispatch:
      inputs:
         # Owner-approved release override (ADR 0006). Empty by default: this
         # workflow refuses to publish a frozen 1.5.x version, and 1.6.0+ needs
         # the exact version + an audit reason (or the equivalent repository
         # variables RELEASE_FREEZE_OVERRIDE_VERSION / _REASON).
         override_version:
            description: "Owner-approved version to unfreeze (must equal the manifest version; 1.6.0+ only)"
            type: string
            default: ""
         override_reason:
            description: "Audit reason for override_version (required)"
            type: string
            default: ""
   workflow_call:

concurrency:
   group: main-publish-${{ github.ref }}
   cancel-in-progress: false

permissions:
   id-token: write
   contents: read

jobs:
   publish:
      name: Publish main npm packages
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         # Release freeze (ADR 0006): fail closed before any npm credential is
         # used. 1.5.x never publishes; 1.6.0+ needs the explicit override.
         - name: Release freeze guard
           env:
              ZETA_RELEASE_OVERRIDE_VERSION: ${{ inputs.override_version || vars.RELEASE_FREEZE_OVERRIDE_VERSION }}
              ZETA_RELEASE_OVERRIDE_REASON: ${{ inputs.override_reason || vars.RELEASE_FREEZE_OVERRIDE_REASON }}
           run: |
              version=$(node -p "require('./main/npm/main/package.json').version")
              bun scripts/release-policy.ts assert-publish --version "$version"
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Publish main packages
           run: bun scripts/ci-release-publish.ts --main
