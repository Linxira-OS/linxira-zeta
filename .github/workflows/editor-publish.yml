name: Publish editor packages
# Standalone dispatchable entry for the vendored editor npm distribution
# (@linxiraos/editor + platform leaves). Exists so a missed or skipped
# editor publish on a release run can be republished without re-tagging:
# `gh workflow run editor-publish.yml`. The release pipeline runs the same
# step in release_editor_packages; keep both in sync.

on:
   workflow_dispatch:

concurrency:
   group: editor-publish-${{ github.ref }}
   cancel-in-progress: false

permissions:
   id-token: write
   contents: read

jobs:
   publish:
      name: Publish editor npm packages
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Publish editor packages
           env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
           run: bun scripts/ci-release-publish.ts --editor
