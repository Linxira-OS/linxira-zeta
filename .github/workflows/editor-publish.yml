name: Publish editor packages
# Standalone dispatchable entry for the editor npm distribution
# (@linxiraos/editor + platform leaves). Exists so a missed or skipped editor
# publish on a release run can be republished without re-tagging:
# `gh workflow run editor-publish.yml`. The release pipeline runs the same
# step in release_editor_packages; keep both in sync.
#
# The payload is Zeta's built-in editor — the editor-only entry of the vendored
# TermIDE workspace (`termide/src/bin/termide-editor.rs`), built and committed
# into the platform leaves before the tag (termide/VENDOR.md's rebuild recipe),
# and packed as-authored by `scripts/ci-release-publish.ts --editor`. It took
# the name over from the retired vendored TTT editor on 2026-10-17.

on:
   workflow_dispatch:
      inputs:
         # Owner-approved release override (ADR 0006). Empty by default: this
         # workflow refuses to publish a frozen 1.5.x version, and 1.6.0+ needs
         # the exact version + an audit reason (or the equivalent repository
         # variables RELEASE_FREEZE_OVERRIDE_VERSION / _REASON).
         override_version:
            description: "Owner-approved version to unfreeze (must equal the manifest version; 1.6.0+ only)"
            type: string
            default: ""
         override_reason:
            description: "Audit reason for override_version (required)"
            type: string
            default: ""
   workflow_call:

concurrency:
   group: editor-publish-${{ github.ref }}
   cancel-in-progress: false

permissions:
   id-token: write
   contents: read

jobs:
   publish:
      name: Publish editor npm packages
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
         # Release freeze (ADR 0006): fail closed before any npm credential is
         # used. 1.5.x never publishes; 1.6.0+ needs the explicit override.
         - name: Release freeze guard
           env:
              ZETA_RELEASE_OVERRIDE_VERSION: ${{ inputs.override_version || vars.RELEASE_FREEZE_OVERRIDE_VERSION }}
              ZETA_RELEASE_OVERRIDE_REASON: ${{ inputs.override_reason || vars.RELEASE_FREEZE_OVERRIDE_REASON }}
           run: |
              version=$(node -p "require('./editor/npm/editor/package.json').version")
              bun scripts/release-policy.ts assert-publish --version "$version"
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         - name: Ensure npm supports trusted publishing
           run: npm install -g npm@11.17.0
         - name: Publish editor packages
           run: bun scripts/ci-release-publish.ts --editor
