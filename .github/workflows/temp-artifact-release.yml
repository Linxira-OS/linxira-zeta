# TEMPORARY: upload the win32-arm64 native addon as a GitHub Release asset
# so it can be downloaded without the Actions artifact API (which stalls on
# this network). Delete this file after the one-shot run completes.
name: Temp win32-arm64 addon release

on:
   workflow_dispatch:

jobs:
   upload:
      runs-on: windows-11-arm
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: "1.4"
         - run: bun install --frozen-lockfile
         - name: Build win32-arm64 addon
           run: bun scripts/bazel-natives.ts host --dest native
         - name: Upload to release
           shell: pwsh
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              gh release upload v1.1.9 packages/natives/native/pi_natives.win32-arm64.node --clobber
