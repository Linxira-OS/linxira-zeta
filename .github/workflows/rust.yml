name: Rust

on:
   push:
      branches: [main, "dev/*", "sync/omp-release/*", "port/**"]
      paths:
         - "crates/**"
         - "bazel/**"
         - "BUILD.bazel"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "Cargo.toml"
         - "Cargo.lock"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - ".github/workflows/rust.yml"
   pull_request:
      branches: [main, omp2]
      paths:
         - "crates/**"
         - "bazel/**"
         - "BUILD.bazel"
         - "MODULE.bazel"
         - "MODULE.bazel.lock"
         - "Cargo.toml"
         - "Cargo.lock"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - ".bazelrc"
         - ".bazelignore"
         - ".bazelversion"
         - ".github/workflows/rust.yml"
   workflow_dispatch:

concurrency:
   group: "${{ github.workflow }}-${{ github.ref }}"
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
   contents: read

jobs:
   rust_validate:
      name: Validate Rust workspace (bazel)
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - id: cache
           uses: ./.github/actions/bazel-cache
         - name: Rust tests
           # The ulimit guard runs in the step that launches the bazel server
           # (limits are per-process and the server persists across steps).
           run: |
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" test //crates/...
         # Clippy scope mirrors `cargo clippy --workspace` (libraries only, no
         # test targets) plus the strict/default split: crates with
         # `[lints] workspace = true` get the workspace policy.
         # omp-builtins allows every clippy group in its own manifest (ported
         # uutils/jaq code) but is still held to zero rustc warnings;
         # Cargo honors that via `[lints]`, Bazel via the clippy-ported config.
         - name: Clippy (workspace lint policy on opted-in crates)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library|rust_binary', //crates/ast/... + //crates/diff/... + //crates/edit/... + //crates/iso/... + //crates/natives/... + //crates/shell/... + //crates/vcs/... + //crates/voice/... + //crates/xfs/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-strict --
         - name: Clippy (default lints elsewhere)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/... - (//crates/ast/... + //crates/diff/... + //crates/edit/... + //crates/iso/... + //crates/natives/... + //crates/shell/... + //crates/vcs/... + //crates/voice/... + //crates/xfs/...) - //crates/builtins/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy --
         - name: Clippy (manifest allows on ported omp-builtins)
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/builtins/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-ported --
         - name: Rustfmt
           run: bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=rustfmt //crates/...
