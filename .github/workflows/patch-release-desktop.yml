# One-shot patch: rebuild SHA256SUMS.txt for v1.1.16 covering every asset.
# Delete this file after the run succeeds.
name: patch-release-desktop
on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Rebuild checksums over every release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sumdir && cd sumdir
          gh release download v1.1.16 -R "${{ github.repository }}"
          rm -f SHA256SUMS.txt
          sha256sum --binary * | sed 's/\*//' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload v1.1.16 SHA256SUMS.txt --clobber -R "${{ github.repository }}"
