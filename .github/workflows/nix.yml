name: Zeta Nix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"
      - "package.json"
      - "patches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "packages/**"
      - "crates/**"
      - "scripts/**"
      - "docs/**"
  # PRs only evaluate when nix inputs change; main pushes cover every other
  # path, and fork PRs would otherwise queue an approval each time.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/nix.yml"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "bun.lock"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate flake
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Evaluate every supported system
        run: nix flake check --all-systems --no-build --show-trace
      - name: Verify generated Bun dependencies
        run: nix build --no-link .#checks.x86_64-linux.bun-lock --show-trace

  # Thin LTO exercises the same derivations as release builds at a fraction of
  # the link.
  build:
    name: Build package
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Build zeta with thin LTO
        run: |
          out=$(nix build --no-link --print-out-paths --print-build-logs --show-trace --impure \
            --expr "(builtins.getFlake \"git+file://$GITHUB_WORKSPACE\").packages.x86_64-linux.zeta.override { withFatLto = false; }")
          echo "ZETA_OUT=$out" >> "$GITHUB_ENV"
      - name: Smoke-test zeta
        run: |
          "$ZETA_OUT/bin/zeta" --version
          # Batches 3 and 10 (stats-activity worker, mnemopi embed) exceed this
          # runner's memory; their package suites cover the same workers, and
          # batch 10's embedding model is the one that gets SIGKILLed here.
          for batch in 1 2 4 5 6 7 8 9 11 12 13 14 15 16; do
            "$ZETA_OUT/bin/zeta" --smoke-test="$batch"
          done
