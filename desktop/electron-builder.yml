# Zeta desktop shell packaging
# Directory target: a no-install Zeta.exe with its local service runtime.
# The shell spawns Zeta + Web UI and hosts them inside Electron.
# Installer/archive targets (NSIS, zip, deb) are release assets.

appId: com.zeta.desktop
productName: Zeta
protocols:
  - name: Zeta
    schemes:
      - zeta
artifactName: zeta-desktop-${version}-${os}-${arch}.${ext}
copyright: Copyright (c) 2026 Linxira-OS
electronVersion: 37.10.3
# Chromium's built-in UI (context menus, native dialogs) plus spellcheck only
# need the languages the product localizes; electron-builder otherwise copies
# all ~55 locale packs (~42 MiB installed, ~10 MiB in the installer).
electronLanguages:
  - en-US
  - zh-CN

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - package.json

extraResources:
  - from: staging/zeta
    to: zeta
  - from: build/bin
    to: bin
  # Both formats: Windows reads the ICO, Linux/macOS the PNG (an ICO is not a
  # valid GTK/AppKit icon). `iconPath()` picks by platform.
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: ../LICENSE
    to: legal/LICENSE
  - from: ../NOTICE
    to: legal/NOTICE
  - from: ../THIRD-PARTY-NOTICES.txt
    to: legal/THIRD-PARTY-NOTICES.txt

win:
  icon: build/icon.ico
  target:
    - target: dir
      arch:
        - x64
    - target: zip
      arch:
        - x64
    - target: nsis
      arch:
        - x64

nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh

linux:
  icon: build/icon.png
  executableName: zeta-desktop
  category: Development
  desktop:
    entry:
      Name: Zeta
      Comment: Zeta coding agent desktop
  target:
    - target: tar.gz
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dir
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
    - target: dmg
      arch:
        - x64
        - arm64

deb:
  maintainer: Zeta Contributors

npmRebuild: false
