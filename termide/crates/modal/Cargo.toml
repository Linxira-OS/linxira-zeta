[package]
name = "termide-modal"
version.workspace = true
edition.workspace = true
description = "Modal dialog system for termide"
license = "MIT"

[dependencies]
# External
anyhow.workspace = true
chrono.workspace = true
crossterm.workspace = true
ratatui.workspace = true
unicode-width.workspace = true

# Workspace crates
termide-clipboard = { path = "../clipboard" }
termide-core = { path = "../core" }
termide-ui = { path = "../ui" }
termide-theme = { path = "../theme" }
termide-i18n = { path = "../i18n" }
termide-config = { path = "../config" }
termide-state = { path = "../state" }

# The directory picker's drive page asks Windows which volumes exist. This
# table stays last: putting it in the middle of `[dependencies]` moved every
# workspace crate below it under the windows-only table, and the Linux leg then
# failed with `unresolved import termide_theme`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
