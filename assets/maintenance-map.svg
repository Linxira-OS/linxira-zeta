<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="maintenance-map-title maintenance-map-desc">
  <title id="maintenance-map-title">Zeta maintenance and ownership map</title>
  <desc id="maintenance-map-desc">Horizontal map from upstream sources through Zeta integration and product front-ends to the runtime docs and internal document trees.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6577"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#1c2330">Zeta maintenance &amp; ownership map</text>
  <text x="24" y="50" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#5b6577">Ownership boundaries, not a runtime data-flow diagram. Upstream enters only through named release tags or explicit semantic ports.</text>

  <!-- Column headings -->
  <text x="20" y="88" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#33415c">UPSTREAM SOURCES</text>
  <text x="300" y="88" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#5b3f95">ZETA INTEGRATION + HOST (ZETA-OWNED)</text>
  <text x="680" y="88" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#236b55">PRODUCT FRONT-ENDS</text>
  <text x="960" y="88" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#8a5a12">DOCUMENTATION BOUNDARY</text>

  <!-- Upstream group -->
  <rect x="20" y="100" width="240" height="48" rx="7" fill="#e8eef7" stroke="#8ca3c4" stroke-width="1.2"/>
  <text x="32" y="121" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#243247">OMP runtime</text>
  <text x="32" y="139" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#526174">agent · tools · TUI · models</text>

  <rect x="20" y="156" width="240" height="48" rx="7" fill="#e8eef7" stroke="#8ca3c4" stroke-width="1.2"/>
  <text x="32" y="177" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#243247">OMP Studio renderer</text>
  <text x="32" y="195" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#526174">Work Studio fork source</text>

  <rect x="20" y="212" width="240" height="48" rx="7" fill="#e8eef7" stroke="#8ca3c4" stroke-width="1.2"/>
  <text x="32" y="233" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#243247">TermIDE</text>
  <text x="32" y="251" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#526174">terminal IDE · editor upstream</text>

  <rect x="20" y="268" width="240" height="48" rx="7" fill="#f1f2f4" stroke="#aeb5bf" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="32" y="289" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3b4351">OMP Web · frozen</text>
  <text x="32" y="307" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#5b6577">no sync · no upstream issue · not a surface</text>

  <!-- Integration group -->
  <rect x="300" y="100" width="330" height="48" rx="7" fill="#efe7ff" stroke="#9c7bd6" stroke-width="1.2"/>
  <text x="312" y="121" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3f2a67">Server / Studio host</text>
  <text x="312" y="139" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#5a477e">zeta-server · studio-host ops · contracts</text>

  <rect x="300" y="156" width="330" height="48" rx="7" fill="#efe7ff" stroke="#9c7bd6" stroke-width="1.2"/>
  <text x="312" y="177" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3f2a67">HTTP gateway</text>
  <text x="312" y="195" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#5a477e">REST · SSE · WS · auth/origin/scope guards</text>

  <rect x="300" y="212" width="330" height="48" rx="7" fill="#efe7ff" stroke="#9c7bd6" stroke-width="1.2"/>
  <text x="312" y="233" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3f2a67">Channels / IM</text>
  <text x="312" y="251" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#5a477e">adapters · session/workspace routing · delivery</text>

  <rect x="300" y="268" width="330" height="48" rx="7" fill="#efe7ff" stroke="#9c7bd6" stroke-width="1.2"/>
  <text x="312" y="289" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#3f2a67">CLI / TUI + plugin host</text>
  <text x="312" y="307" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#5a477e">zetacode product behavior · official plugins</text>

  <!-- Front-end group -->
  <rect x="680" y="100" width="230" height="48" rx="7" fill="#e4f4ef" stroke="#6fb39a" stroke-width="1.2"/>
  <text x="692" y="121" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#174f3f">Work Studio</text>
  <text x="692" y="139" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#356b5b">web-app renderer · browser workbench</text>

  <rect x="680" y="156" width="230" height="48" rx="7" fill="#e4f4ef" stroke="#6fb39a" stroke-width="1.2"/>
  <text x="692" y="177" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#174f3f">zetacode</text>
  <text x="692" y="195" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#356b5b">CLI + TUI · same session tree</text>

  <rect x="680" y="212" width="230" height="48" rx="7" fill="#e4f4ef" stroke="#6fb39a" stroke-width="1.2"/>
  <text x="692" y="233" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#174f3f">zetaide</text>
  <text x="692" y="251" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#356b5b">TermIDE fork · Zeta deviations</text>

  <rect x="680" y="268" width="230" height="48" rx="7" fill="#e4f4ef" stroke="#6fb39a" stroke-width="1.2"/>
  <text x="692" y="289" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#174f3f">Plugins</text>
  <text x="692" y="307" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#356b5b">official registry · community pointers</text>

  <!-- Docs boundary -->
  <rect x="960" y="100" width="216" height="82" rx="7" fill="#fff1d6" stroke="#d1a45a" stroke-width="1.2"/>
  <text x="972" y="122" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#6b4612">docs/ · runtime docs</text>
  <text x="972" y="141" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#7b5a21">packaged · served at zeta://docs</text>
  <text x="972" y="158" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#7b5a21">users + extension authors</text>
  <text x="972" y="175" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#7b5a21">new commands, flags, tools, URLs</text>

  <rect x="960" y="204" width="216" height="112" rx="7" fill="#fff1d6" stroke="#d1a45a" stroke-width="1.2"/>
  <text x="972" y="226" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#6b4612">document/ · internal</text>
  <text x="972" y="245" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#7b5a21">never packaged · maintainers</text>
  <text x="972" y="262" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#7b5a21">architecture · ADR · roadmap</text>
  <text x="972" y="279" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#7b5a21">merge · release · maintenance protocol</text>
  <text x="972" y="296" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#7b5a21">not a user-facing support surface</text>

  <!-- Arrows: upstream to integration -->
  <path d="M 266 124 L 296 124" stroke="#5b6577" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 266 180 L 296 180" stroke="#5b6577" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 266 236 L 296 236" stroke="#5b6577" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 266 292 L 296 292" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="270" y="151" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#5b6577" transform="rotate(90 270 151)">named release tags</text>

  <!-- Arrows: integration to front-ends -->
  <path d="M 636 124 L 676 124" stroke="#5b6577" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 636 180 L 676 180" stroke="#5b6577" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 636 236 L 676 236" stroke="#5b6577" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 636 292 L 676 292" stroke="#5b6577" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="641" y="151" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9" fill="#5b6577" transform="rotate(90 641 151)">same contract</text>

  <!-- Front-ends to docs boundary -->
  <path d="M 916 124 L 956 128" stroke="#8a6a35" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 916 180 L 956 164" stroke="#8a6a35" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 916 236 L 956 246" stroke="#8a6a35" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 916 292 L 956 280" stroke="#8a6a35" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <line x1="20" y1="340" x2="1180" y2="340" stroke="#d7dce4" stroke-width="1"/>
  <rect x="20" y="354" width="14" height="14" rx="3" fill="#e8eef7" stroke="#8ca3c4"/>
  <text x="42" y="365" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#33415c">upstream source</text>
  <rect x="178" y="354" width="14" height="14" rx="3" fill="#efe7ff" stroke="#9c7bd6"/>
  <text x="200" y="365" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#5b3f95">Zeta-owned integration</text>
  <rect x="376" y="354" width="14" height="14" rx="3" fill="#e4f4ef" stroke="#6fb39a"/>
  <text x="398" y="365" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#236b55">product front-end</text>
  <rect x="540" y="354" width="14" height="14" rx="3" fill="#fff1d6" stroke="#d1a45a"/>
  <text x="562" y="365" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8a5a12">documentation boundary</text>
  <text x="760" y="365" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#5b6577">dashed = frozen / no sync</text>
  <text x="1016" y="365" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#5b6577">Keep README + protocol aligned</text>
</svg>
