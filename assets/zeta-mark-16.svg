<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Zeta LZ mark for 16px">
  <title>Zeta — single-tile LZ fallback (16px)</title>
  <!--
    Concept 04 Cluster, 16px fallback: below 32px the two tiles cannot hold a
    readable L and Z, so the mark collapses to one tile with a 9.5u LZ aperture
    (m-c4-sm on the concept board). Use at 16 and 24 only; 32 is the minimum for
    assets/zeta-mark.svg. Flat, one tile, one ink plate, no accent.
  -->
  <defs>
    <mask id="zeta-lz-tile" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#000"/>
      <rect x="48" y="48" width="416" height="416" rx="112" fill="#fff"/>
      <path d="M368 368H128V128H368L224 368H368" fill="none" stroke="#000" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#0E1417"/>
  <rect width="512" height="512" fill="#2AC9C1" mask="url(#zeta-lz-tile)"/>
</svg>
