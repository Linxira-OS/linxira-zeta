      steps:
         # The NAS runner's egress to github.com is intermittent (observed:
         # `TLS handshake timeout` fetching actions/checkout, and `curl: (56)
         # SSL unexpected eof` fetching a release asset), and actions/checkout
         # has no retry - one reset loses the whole run. Clone from the Gitea
