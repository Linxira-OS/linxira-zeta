           if: steps.termide.outputs.skip != 'true'
           working-directory: termide
           run: cargo check --workspace --all-targets
         - name: Run clippy (strict mode)
           if: steps.termide.outputs.skip != 'true'
           working-directory: termide
           run: cargo clippy --workspace --all-targets -- -D warnings
         - name: Run tests
           if: steps.termide.outputs.skip != 'true'
