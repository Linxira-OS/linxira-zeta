         - name: Checkout (local Gitea remote)
           shell: bash
           run: |
              set -euo pipefail
              ref="${{ github.ref }}"
              sha="${{ github.sha }}"
              host="${{ github.server_url }}"
              host="${host#*://}"
              token="${{ github.token }}"
