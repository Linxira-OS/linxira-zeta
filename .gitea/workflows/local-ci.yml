name: local-ci

# ─────────────────────────────────────────────────────────────────────────────
# 本地 CI（仅 Gitea 执行）。定位：**GitHub CI 的 Linux 精简镜像**。
#
# 保留（不得删除）：本工作流不是上游残留，而是产品面的一部分——我们依赖 Gitea，
# 发行版会随附 Gitea，本地 CI 便随其一起交付；将来在我们自己的 Linux 上自举开发
# 时也有用。它当前靠手动 push 到盒子唤醒（盒子冻结期不动）。因此**不得**以
# "与 ci.yml 重复 / 会漂移"为由删除：与 ci.yml 的逐 job 对应关系是刻意维护的。
#
# 与 .github/workflows/ci.yml 的对应关系（逐 job）：
#   镜像：check / web_ui_build / bazel_lock / rust_validate / native_addons /
#        test_coding_agent_native / test_workspace / test_coding_agent_singleton /
#        test_ts_native / test_coding_agent_ui / test_coding_agent_runtime /
#        test_smoke / install_methods / editor_tests / termide_tests / main_tests
#   裁掉：release_metadata / release_gate / release_binary /
#        release_product_binaries / release_native_leaves / release_github /
#        release_npm / release_{editor,main,ide,web_ui,plugin}_packages（发布链，永不在此跑）
#        desktop_windows、native_addons_cross 的 win32/darwin 腿（Windows/macOS）
#
# 与 GitHub 侧刻意保持一致的地方：命令行入口全部走仓库脚本
# （`bun run ci:test:*`、`bun scripts/*.ts`、`cargo fmt/check/clippy/nextest`），
# 脚本本身共用，因此两边跑的是同一段代码。
#
# 与 GitHub 侧**故意不同**的地方（本地专用，都是为了让"同一台常驻 Linux 机"
# 跑得更快，而不是换一套判定标准）：
#   1. 不做 GitHub artifact/cache 往返：native addon 直接构建到工作区的
#      `packages/natives/native/`，后续 job 直接用（省掉上传/下载与 cache key）。
#   2. 工具链装进 `$GITHUB_WORKSPACE/.tools`（跨运行常驻），rustup/cargo 的
#      target 目录天然增量 → Rust 复跑是秒级到分钟级，而不是冷编译。
#   3. `OMP_TEST_CHUNK_TIMEOUT=900`：NAS 机器比 GitHub runner 慢，600s 看门狗
#      在这里会误杀（已见误杀：scripts/release.test.ts chunk）。
#   4. 分片全部按单片跑（`1/1`）：本地不并发多 runner。
#
# 触发：只认 main 的分支 push + 手动 dispatch。`branches:` 不匹配 tag ref，
# 因此**推 tag 不会触发本工作流的任何 job**；preflight 再断言一次"HEAD 无
# v* tag"，双重保险，确保本地永不产生发布语义。
# ─────────────────────────────────────────────────────────────────────────────

on:
   push:
      branches: [main]
   workflow_dispatch:
      inputs:
         suite:
            description: 本次要跑哪一组（其余 job 直接跳过）
            type: choice
            default: full
            options:
               - full
               - gates
               - ts
               - rust

defaults:
   run:
      shell: bash

env:
   # Tools deliberately live under `$HOME/.local-ci-tools`, resolved in bash at
   # each use site (`${LOCAL_CI_TOOLS:-$HOME/.local-ci-tools}`). A
   # `$GITHUB_WORKSPACE/.tools` path cannot be shared: the host executor gives
   # every job its own `act/<hash>/hostexecutor` workdir. Set LOCAL_CI_TOOLS in
   # the runner environment to move the store.
   NATIVES_X64_TARGETS: natives-linux-x64-baseline natives-linux-x64-modern

jobs:
   # ── 0. 触发面护栏 ─────────────────────────────────────────────────────────
   preflight:
      name: Preflight (no-release guard)
      runs-on: self-hosted
      timeout-minutes: 10
      steps:
         # The NAS runner's egress to github.com is intermittent (observed:
         # `TLS handshake timeout` fetching actions/checkout, and `curl: (56)
         # SSL unexpected eof` fetching a release asset), and actions/checkout
         # has no retry - one reset loses the whole run. Clone from the Gitea
         # instance instead: it is on the LAN and needs no action download.
         - name: Checkout (local Gitea remote)
           shell: bash
           run: |
              set -euo pipefail
              ref="${{ github.ref }}"
              sha="${{ github.sha }}"
              host="${{ github.server_url }}"
              host="${host#*://}"
              token="${{ github.token }}"
              auth=""
              if [ -n "$token" ]; then auth="x-access-token:${token}@"; fi
              url="http://${auth}${host}/${{ github.repository }}.git"
              if [ ! -d .git ]; then git init -q .; fi
              if git remote get-url origin >/dev/null 2>&1; then
                 git remote set-url origin "$url"
              else
                 git remote add origin "$url"
              fi
              git fetch -q --depth=1 --tags origin "$ref"
              # --depth=1 only brings the ref tip; fall back to the full branch
              # when the run's SHA is not that tip (branch moved mid-run).
              if ! git checkout -q -f "$sha" 2>/dev/null; then
                 git fetch -q --tags origin "$ref"
                 git checkout -q -f "$sha"
              fi
              git log -1 --format='checked out %h %s'
         - name: Assert this run can never be a release
           shell: bash
           run: |
              set -euo pipefail
              case "${{ github.ref }}" in
                refs/tags/*)
                   echo "::error::local-ci refuses tag refs (${GITHUB_REF}); tags are GitHub-only"
                   exit 1
                   ;;
              esac
              # HEAD 上挂着 v* tag 时，本地跑测试没有意义（那是发布态）。
              # 提前失败而不是安静跑完，避免"本地绿了就以为能发"。
              if git tag --points-at HEAD | grep -qE '^v[0-9]'; then
                 echo "::error::HEAD carries a v* release tag; local-ci is for pre-release verification only"
                 git tag --points-at HEAD | grep -E '^v[0-9]' >&2
                 exit 1
              fi
              echo "ref=${{ github.ref }} (no release tag at HEAD) — OK"

   # ── 1. 工具链（常驻，跨运行复用）─────────────────────────────────────────
   toolchains:
      name: Toolchains (persistent $HOME/.local-ci-tools)
      needs: [preflight]
      runs-on: self-hosted
      timeout-minutes: 120
      steps:
         # The bootstrap reads package.json (bun pin) and rust-toolchain.toml,
         # so this job needs the workspace; without it `sed: package.json: No
         # such file` exits 2 and every downstream job is skipped (the run
         # still reports "completed" in ~50s, which is how this stayed hidden).
         # The NAS runner's egress to github.com is intermittent (observed:
         # `TLS handshake timeout` fetching actions/checkout, and `curl: (56)
         # SSL unexpected eof` fetching a release asset), and actions/checkout
         # has no retry - one reset loses the whole run. Clone from the Gitea
         # instance instead: it is on the LAN and needs no action download.
         - name: Checkout (local Gitea remote)
           shell: bash
           run: |
              set -euo pipefail
              ref="${{ github.ref }}"
              sha="${{ github.sha }}"
              host="${{ github.server_url }}"
              host="${host#*://}"
              token="${{ github.token }}"
              auth=""
              if [ -n "$token" ]; then auth="x-access-token:${token}@"; fi
              url="http://${auth}${host}/${{ github.repository }}.git"
              if [ ! -d .git ]; then git init -q .; fi
              if git remote get-url origin >/dev/null 2>&1; then
                 git remote set-url origin "$url"
              else
                 git remote add origin "$url"
              fi
              git fetch -q --depth=1 --tags origin "$ref"
              # --depth=1 only brings the ref tip; fall back to the full branch
              # when the run's SHA is not that tip (branch moved mid-run).
              if ! git checkout -q -f "$sha" 2>/dev/null; then
                 git fetch -q --tags origin "$ref"
                 git checkout -q -f "$sha"
              fi
              git log -1 --format='checked out %h %s'
         - name: Bootstrap toolchains
           shell: bash
           run: |
              set -euo pipefail
              # Stable across jobs and runs: the host executor hands every job
              # its own `act/<hash>/hostexecutor` workdir, so a workspace-relative
              # path is invisible to the jobs that consume this bootstrap (run
              # 538: downstream `Toolchain PATH` could not find `.tools/env.path`).
              TOOLS="${LOCAL_CI_TOOLS:-$HOME/.local-ci-tools}"
              echo "TOOLS=$TOOLS" >> "$GITHUB_ENV"
              mkdir -p "$TOOLS/bin"
              export RUSTUP_HOME="$TOOLS/rustup"
              export CARGO_HOME="$TOOLS/cargo"
              export PATH="$TOOLS/bin:$RUSTUP_HOME/bin:$CARGO_HOME/bin:$PATH"
              export RUSTUP_DIST_SERVER=https://mirrors.ustc.edu.cn/rust-static
              export CARGO_NET_RETRY=10

              # The runner's egress to GitHub/nodejs.org/go.dev resets mid-transfer
              # (observed: curl exit 56 "SSL unexpected eof"), and plain `--retry`
              # does not cover that class, so retry every download explicitly.
              fetch() { # fetch <url> <dest>
                 local url="$1" dst="$2" attempt
                 for attempt in 1 2 3 4 5; do
                    if curl -fsSL --connect-timeout 20 --retry 5 --retry-all-errors \
                       --retry-delay 5 --retry-connrefused -o "$dst" "$url"; then
                       return 0
                    fi
                    echo "::warning::download attempt $attempt failed: $url"
                    sleep $((attempt * 5))
                 done
                 echo "::error::cannot download $url"
                 return 1
              }
              # Same failure class, but for tools that download *inside* their own
              # installer (bun's zip, rustup's toolchains): `fetch` cannot cover
              # those, so retry the command itself.
              retry() { # retry <cmd...>
                 local attempt
                 for attempt in 1 2 3 4 5; do
                    if "$@"; then return 0; fi
                    echo "::warning::attempt $attempt failed: $*"
                    sleep $((attempt * 5))
                 done
                 echo "::error::giving up after 5 attempts: $*"
                 return 1
              }

              # bun —— 版本必须满足 package.json 的 packageManager pin，
              # 否则 gen:tool-views 之类的代码生成会和 CI 产生版本偏差。
              want="$(sed -n 's/.*"packageManager": *"bun@\([^"]*\)".*/\1/p' package.json)"
              if [ -z "$want" ]; then
                 echo "::error::could not read pinned bun version from package.json packageManager"
                 exit 1
              fi
              have="$(command -v bun >/dev/null 2>&1 && bun --version || echo)"
              case "$want" in
                '>='*)
                   floor="${want#>=}"
                   [ -n "$have" ] && [ "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -n1)" = "$floor" ] && ok=true || ok=false
                   ;;
                *)
                   [ "$have" = "$want" ] && ok=true || ok=false
                   ;;
              esac
              if [ "${ok:-false}" != true ]; then
                 fetch https://bun.sh/install "$TOOLS/bun-install.sh"
                 # The installer takes the release tag as its first positional
                 # argument when run from the downloaded file. `-s --` belongs to
                 # the `curl | bash` form only: passed here it becomes two extra
                 # script arguments and the installer refuses with "Too many
                 # arguments, only 2 are allowed".
                 case "$want" in
                   '>='*) retry env BUN_INSTALL="$TOOLS" bash "$TOOLS/bun-install.sh" ;;
                   *)     retry env BUN_INSTALL="$TOOLS" bash "$TOOLS/bun-install.sh" "bun-v$want" ;;
                 esac
              fi
              "$TOOLS/bin/bun" --version

              # rustup —— 仓库钉 nightly（rust-toolchain.toml），两个 vendor
              # 工作区各钉 1.91.1（termide/ main/）。三个都要装，否则
              # `cargo fmt/clippy/test` 在 vendor 目录里会触发重编译。
              if [ ! -x "$RUSTUP_HOME/bin/rustup" ]; then
                 fetch https://sh.rustup.rs "$TOOLS/rustup-init.sh"
                 retry env RUSTUP_HOME="$RUSTUP_HOME" CARGO_HOME="$CARGO_HOME" \
                   sh "$TOOLS/rustup-init.sh" -y --profile minimal --no-modify-path
              fi
              repo_pin="$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)"
              vendor_pin="$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' termide/rust-toolchain.toml)"
              for tc in "$repo_pin" "$vendor_pin"; do
                 case "$tc" in
                   nightly*) retry rustup toolchain install "$tc" --profile minimal -c rustfmt,clippy ;;
                   *)        retry rustup toolchain install "$tc" --profile minimal -c rustfmt,clippy ;;
                 esac
              done
              rustup default "$repo_pin"

              # bazelisk —— .bazelversion 钉版本，交给 bazelisk 自己解析。
              if ! command -v bazelisk >/dev/null 2>&1; then
                 fetch "https://github.com/bazelbuild/bazelisk/releases/download/v1.27.0/bazelisk-linux-amd64" \
                   "$TOOLS/bin/bazelisk"
                 chmod +x "$TOOLS/bin/bazelisk"
              fi

              # cargo 工具：nextest（vendor 工作区用）与 deny（license 面）。
              for tool in cargo-nextest cargo-deny; do
                 command -v "$tool" >/dev/null 2>&1 || cargo install "$tool" --locked ||
                   (echo "::warning::cargo install $tool failed"; true)
              done

              # node —— web-ui 与 editor functional harness 用（GitHub 侧 22/24）。
              if ! command -v node >/dev/null 2>&1; then
                 fetch https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz /tmp/node.tar.xz
                 mkdir -p "$TOOLS/node"
                 tar -xJf /tmp/node.tar.xz -C "$TOOLS/node" --strip-components=1
              fi

              # go —— editor（TTT）测试。
              if ! command -v go >/dev/null 2>&1; then
                 fetch https://go.dev/dl/go1.24.5.linux-amd64.tar.gz /tmp/go.tar.gz
                 mkdir -p "$TOOLS/go"
                 tar -xzf /tmp/go.tar.gz -C "$TOOLS/go" --strip-components=1
              fi

              {
                 echo "RUSTUP_HOME=$RUSTUP_HOME"
                 echo "CARGO_HOME=$CARGO_HOME"
                 echo "BUN_INSTALL=$TOOLS"
                 echo "PATH_EXTRA=$TOOLS/bin:$RUSTUP_HOME/bin:$CARGO_HOME/bin:$TOOLS/node/bin:$TOOLS/go/bin"
              } >> "$GITHUB_ENV"

              # GITHUB_ENV is job-scoped, so persist the same PATH for the
              # downstream jobs (they fall back to this file when PATH_EXTRA
              # is absent from their own environment).
              printf '%s\n' "$TOOLS/bin:$RUSTUP_HOME/bin:$CARGO_HOME/bin:$TOOLS/node/bin:$TOOLS/go/bin" > "$TOOLS/env.path"

              # PATH_EXTRA 只是变量，不会进 PATH：本 job 自己的后续步骤
              # （Verify toolchains / Install workspace dependencies）必须靠
              # GITHUB_PATH 拿到 bun，否则 `bun install` 直接 127。
              printf '%s\n' "$TOOLS/bin:$RUSTUP_HOME/bin:$CARGO_HOME/bin:$TOOLS/node/bin:$TOOLS/go/bin" >> "$GITHUB_PATH"

         - name: Verify toolchains
           shell: bash
           run: |
              set -euo pipefail
              echo "bun   $(bun --version)"
              echo "cargo $(cargo --version)"
              echo "rustc $(rustc --version)"
              echo "node  $(node --version 2>/dev/null || echo '<absent: web-ui/editor jobs will install it>')"
              echo "go    $(go version 2>/dev/null || echo '<absent: editor job will install it>')"
              echo "bazel $(bazelisk --version 2>/dev/null | head -1 || echo '<absent>')"

         - name: Install workspace dependencies
           shell: bash
           run: |
              set -euo pipefail
              # 与 GitHub 的 bun-install action 同一条命令（--frozen-lockfile），
              # 只是缓存来自常驻工作区而不是 actions/cache。
              if bun install --frozen-lockfile; then exit 0; fi
              echo "::warning title=bun install retry::retrying with a clean job-local cache"
              retry_cache="$(mktemp -d "${RUNNER_TEMP:-/tmp}/bun-cache-retry.XXXXXX")"
              bun install --frozen-lockfile --cache-dir="$retry_cache"

   # ── 2. 静态门禁（镜像 check）────────────────────────────────────────────
   check:
      name: Lint, type check & web build
      needs: [preflight, toolchains]
      if: ${{ always() && needs.toolchains.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.suite == 'full' || inputs.suite == 'gates') }}
      runs-on: self-hosted
      timeout-minutes: 60
      steps:
         # The NAS runner's egress to github.com is intermittent (observed:
         # `TLS handshake timeout` fetching actions/checkout, and `curl: (56)
         # SSL unexpected eof` fetching a release asset), and actions/checkout
         # has no retry - one reset loses the whole run. Clone from the Gitea
         # instance instead: it is on the LAN and needs no action download.
         - name: Checkout (local Gitea remote)
           shell: bash
           run: |
              set -euo pipefail
              ref="${{ github.ref }}"
              sha="${{ github.sha }}"
              host="${{ github.server_url }}"
              host="${host#*://}"
              token="${{ github.token }}"
              auth=""
              if [ -n "$token" ]; then auth="x-access-token:${token}@"; fi
              url="http://${auth}${host}/${{ github.repository }}.git"
              if [ ! -d .git ]; then git init -q .; fi
              if git remote get-url origin >/dev/null 2>&1; then
                 git remote set-url origin "$url"
              else
                 git remote add origin "$url"
              fi
              git fetch -q --depth=1 --tags origin "$ref"
              # --depth=1 only brings the ref tip; fall back to the full branch
              # when the run's SHA is not that tip (branch moved mid-run).
              if ! git checkout -q -f "$sha" 2>/dev/null; then
                 git fetch -q --tags origin "$ref"
                 git checkout -q -f "$sha"
              fi
              git log -1 --format='checked out %h %s'
         - name: Toolchain PATH
           shell: bash
           run: |
              set -euo pipefail
              tools="${LOCAL_CI_TOOLS:-$HOME/.local-ci-tools}"
              extra="${PATH_EXTRA:-}"
              if [ -z "$extra" ] && [ -f "$tools/env.path" ]; then extra="$(cat "$tools/env.path")"; fi
              if [ -z "$extra" ]; then
                 echo "::error::toolchain PATH unavailable: PATH_EXTRA is empty and $tools/env.path is missing"
                 exit 1
              fi
              echo "$extra:$PATH" >> "$GITHUB_PATH"
         - name: Verify Rust license compliance (cargo-deny)
           shell: bash
           run: |
              set -euo pipefail
              cargo fetch --locked
              cargo deny --locked check licenses sources
         - name: Type check workspace
           run: bun run ci:check:full
         - name: Brand residue guard
           run: bun scripts/brand/brand-check.ts
         - name: Shared-infra ledger guard
           run: bun scripts/check-shared-infra.ts
         - name: Zeta-only sentinel guard
           run: bun scripts/check-zeta-sentinels.ts
         - name: Check CI surface
           run: bun scripts/check-ci-surface.ts
         - name: Release asset-name guard
           run: bun scripts/check-release-asset-names.ts
         - name: Scope import guard
           run: bun scripts/check-scope-imports.ts
         # The desktop shell mirrors the CLI's serve-discovery decision module
         # (it has no workspace dependency), so the two decision matrices must
         # stay equal.
         - name: Serve-discovery parity guard
           run: bun scripts/check-serve-discovery-parity.ts
         # 镜像 GitHub `check` job：robomp 的 worker 按名 spawn CLI,该名字必须是
         # 镜像真正放上 PATH 的名字(两侧均从真实文件推导：Dockerfile 垫片 vs
         # config.py/compose/.env.example)。
         - name: robomp container CLI contract guard
           run: bun scripts/check-robomp-cli-contract.ts
         - name: Upstream merge lineage guard
           run: bun scripts/check-merge-lineage.ts
         # 镜像 GitHub `check` job：`merge.zeta-package` driver 以被并入侧为
         # 基线重建 package.json，分支侧新增的 leaf（`scripts` 下的条目、
         # 顶层 `packageManager`……）会被静默丢掉或回退
         # （2026-10-14 丢过三个 script）。本地合并后即刻跑，能在 push 前发现。
         - name: package.json merge-drop guard
           run: bun scripts/check-package-json-merge.ts
         - name: Unit-test the package.json merge guard
           run: bun test scripts/check-package-json-merge.test.ts
         # 镜像 GitHub：driver 自身的测试是唯一能挡住品牌 sweep 改写上游 scope
         # fixture 的关卡（merge dab5fa80ac4 就是这么把 main 留红的：
         # `test:scripts` 没有接进任何 job）。
         - name: Unit-test the package.json merge driver
           run: bun test scripts/merge-package-json.test.ts
         - name: Build collab web
           run: bun run collab:web:build
         - name: Local-CI parity guard
           # 镜像漂移检测：GitHub 侧新增/改名 job 或仓库脚本时，本地镜像
           # 必须同步更新（或显式登记为"有意排除"），否则这里红。
           run: bun scripts/check-local-ci-parity.ts

   # ── 3. web-ui（镜像 web_ui_build）───────────────────────────────────────
   web_ui_build:
      name: Web UI build
      needs: [preflight, toolchains]
      if: ${{ always() && needs.toolchains.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.suite == 'full' || inputs.suite == 'gates') }}
      runs-on: self-hosted
      timeout-minutes: 45
      steps:
         # The NAS runner's egress to github.com is intermittent (observed:
         # `TLS handshake timeout` fetching actions/checkout, and `curl: (56)
         # SSL unexpected eof` fetching a release asset), and actions/checkout
         # has no retry - one reset loses the whole run. Clone from the Gitea
         # instance instead: it is on the LAN and needs no action download.
         - name: Checkout (local Gitea remote)
           shell: bash
           run: |
              set -euo pipefail
              ref="${{ github.ref }}"
              sha="${{ github.sha }}"
              host="${{ github.server_url }}"
              host="${host#*://}"
              token="${{ github.token }}"
              auth=""
              if [ -n "$token" ]; then auth="x-access-token:${token}@"; fi
              url="http://${auth}${host}/${{ github.repository }}.git"
              if [ ! -d .git ]; then git init -q .; fi
              if git remote get-url origin >/dev/null 2>&1; then
                 git remote set-url origin "$url"
              else
                 git remote add origin "$url"
              fi
              git fetch -q --depth=1 --tags origin "$ref"
              # --depth=1 only brings the ref tip; fall back to the full branch
              # when the run's SHA is not that tip (branch moved mid-run).
              if ! git checkout -q -f "$sha" 2>/dev/null; then
                 git fetch -q --tags origin "$ref"
                 git checkout -q -f "$sha"
              fi
              git log -1 --format='checked out %h %s'
         - name: Toolchain PATH
           shell: bash
           run: |
              set -euo pipefail
              tools="${LOCAL_CI_TOOLS:-$HOME/.local-ci-tools}"
              extra="${PATH_EXTRA:-}"
              if [ -z "$extra" ] && [ -f "$tools/env.path" ]; then extra="$(cat "$tools/env.path")"; fi
              if [ -z "$extra" ]; then
                 echo "::error::toolchain PATH unavailable: PATH_EXTRA is empty and $tools/env.path is missing"
                 exit 1
              fi
              echo "$extra:$PATH" >> "$GITHUB_PATH"
         - name: Install dependencies
           working-directory: web-ui
           run: npm ci
         - name: Type check
           working-directory: web-ui
           run: npx tsc --noEmit
         - name: Lint
           working-directory: web-ui
           run: npm run lint
         - name: Colour literal guard
           working-directory: web-ui
           run: node scripts/check-style-literals.mjs
         - name: Build
           working-directory: web-ui
           run: npm run build

   # ── 4. MODULE.bazel.lock 新鲜度（镜像 bazel_lock）───────────────────────
   bazel_lock:
      name: Check MODULE.bazel.lock freshness
      needs: [preflight, toolchains]
      if: ${{ always() && needs.toolchains.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.suite == 'full' || inputs.suite == 'gates' || inputs.suite == 'rust') }}
      runs-on: self-hosted
      timeout-minutes: 30
      steps:
         # The NAS runner's egress to github.com is intermittent (observed:
