telemetry = false

[install]
minimumReleaseAge = 259200 # 3 days in seconds
minimumReleaseAgeExcludes = [
  # First-party packages: published by our own release runs, so a fast
  # release cadence (leaf@N-1 pinning core@N-1) would always trip the
  # freshness gate. bun 1.4 matches these names exactly — no globs.
  "@types/bun",
  "bun-types",
  "kitty-vt-wasm",
  "@stencil-hq/vibemon",
  "@linxiraos/zeta",
  "@linxiraos/pi-utils",
  "@linxiraos/pi-wire",
  "@linxiraos/pi-omptype",
  "@linxiraos/pi-natives",
  "@linxiraos/pi-natives-linux-x64",
  "@linxiraos/pi-natives-linux-musl-x64",
  "@linxiraos/pi-natives-linux-arm64",
  "@linxiraos/pi-natives-linux-musl-arm64",
  "@linxiraos/pi-natives-darwin-x64",
  "@linxiraos/pi-natives-darwin-arm64",
  "@linxiraos/pi-natives-win32-x64",
  "@linxiraos/pi-natives-win32-arm64",
  "@linxiraos/pi-catalog",
  "@linxiraos/pi-ai",
  "@linxiraos/pi-agent-core",
  "@linxiraos/pi-tui",
  "@linxiraos/pi-snapcompact",
  "@linxiraos/pi-hashline",
  "@linxiraos/pi-stats",
  "@linxiraos/pi-mnemopi",
  "@linxiraos/channels",
  "@linxiraos/collab-web",
]
linker = "hoisted"
exact = true
saveTextLockfile = true

[loader]
".md" = "text"
".py" = "text"
".lark" = "text"

[test]
# bun test does NOT honor .gitignore; prune robomp's repo clones and
# scratch dirs so a root-level `bun test` doesn't walk into them.
pathIgnorePatterns = [
  "**/node_modules/**",
  "**/.git/**",
  "**/target/**",
  "**/dist/**",
  "python/**",
  "docs/**",
  "runs/**",
  "python/robomp/data/**",
  ".wt/**",
  ".worktrees/**",
  "temp/**",
  # `bazel-*` are Bazel's convenience symlinks; without this the scanner
  # recurses through the workspace-root loop and exhausts file descriptors.
  "bazel-*/**",
  "**/bazel-out/**",
]

[run]
bun = true
